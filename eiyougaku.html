<!DOCTYPE html>
<html lang="ja" data-fs="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0ABAB5">
<title>CHART 栄養学学校</title>
<style>
:root{
  --fs:16.5px;
  --bg:#EDF7F6; --card:#FFFFFF; --card2:#F3FAF9; --pale:#E3F4F2;
  --ink:#16302E; --ink2:#4C6B68; --line:#D3E7E4;
  --tif:#0ABAB5; --tifL:#81D8D0; --tifD:#07827E; --tifInk:#08302E;
  --red:#B33A2E; --green:#1B7A56; --amber:#9A6412;
  --sh:0 1px 2px rgba(16,48,46,.06),0 12px 24px -18px rgba(10,60,58,.45);
}
html[data-fs="s"]{--fs:15px}
html[data-fs="m"]{--fs:16.5px}
html[data-fs="l"]{--fs:18px}
html[data-fs="xl"]{--fs:19.5px}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101A19; --card:#172524; --card2:#1D2D2B; --pale:#18302E;
    --ink:#EAF6F4; --ink2:#9FC2BE; --line:#2C403E;
    --tif:#4FD8D2; --tifL:#2E6663; --tifD:#6EE2DC; --tifInk:#08302E;
    --red:#F0A79B; --green:#7FD3A9; --amber:#E0B15C;
    --sh:0 1px 2px rgba(0,0,0,.4),0 12px 24px -18px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);min-height:100dvh;background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
  font-size:var(--fs);line-height:1.78;letter-spacing:.012em;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0;line-height:1.45;font-weight:800;letter-spacing:.005em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:3px solid var(--tifD);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== ヘッダー ===== */
.top{position:sticky;top:0;z-index:20;background:var(--tif);color:var(--tifInk);
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px;box-shadow:0 2px 12px -4px rgba(10,90,88,.4)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top b{font-size:1.04em;font-weight:800;letter-spacing:.06em}
.top .ic{font-size:1.35em}
.top small{margin-left:auto;font-size:.68em;opacity:.78;letter-spacing:.12em}
.wrap{max-width:720px;margin:0 auto;padding:16px 15px 34px}

/* ===== カード ===== */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 15px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.sec{margin-top:24px}
.rule{display:flex;align-items:center;gap:9px;margin:22px 0 11px}
.rule .re{font-size:1.28em}
.rule b{font-size:1.02em;font-weight:800;white-space:nowrap}
.rule::after{content:'';flex:1;height:2px;border-radius:2px;background:var(--line)}
.hr{height:1.5px;background:var(--line);margin:14px 0}
.small{font-size:.83em;color:var(--ink2);line-height:1.72}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;gap:11px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pill{display:inline-block;background:var(--tifD);color:#fff;border-radius:999px;
  padding:3px 13px;font-size:.76em;font-weight:800;white-space:nowrap}
.pill.g{background:var(--green)} .pill.r{background:var(--red)} .pill.gray{background:var(--ink2)}
.plate{display:inline-flex;align-items:center;gap:5px;background:var(--pale);border:1.5px solid var(--line);
  border-radius:999px;padding:4px 12px;font-size:.78em;color:var(--ink)}
.chip{display:inline-block;background:var(--pale);border:1.5px solid var(--line);border-radius:999px;
  padding:6px 13px;font-size:.86em;margin:0 6px 7px 0}
button.chip{color:var(--ink);font-weight:700}
.stars{color:var(--tifD);font-size:.86em;letter-spacing:.08em;white-space:nowrap}
.emo{font-size:1.75em;line-height:1}
.emoplate{width:1.9em;height:1.9em;flex:none;display:grid;place-items:center;font-size:1.55em;
  background:var(--pale);border:2px solid var(--tifL);border-radius:50%}

/* ===== ボタン ===== */
.btn{display:block;width:100%;text-align:center;padding:15px 16px;border-radius:12px;font-weight:800;font-size:1em;
  background:var(--tifD);color:#fff;box-shadow:0 3px 0 rgba(4,80,77,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(4,80,77,.35)}
.btn[disabled]{background:var(--line);color:var(--ink2);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--tifL);box-shadow:0 3px 0 var(--line)}
.btn.green{background:var(--green);box-shadow:0 3px 0 rgba(12,70,48,.35)}
.btn.slim{padding:12px 13px;font-size:.88em}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--tifD);font-size:.88em;margin-bottom:13px;font-weight:800}

/* ===== 入力 ===== */
.field{margin-top:13px}
.field label{display:block;font-size:.8em;color:var(--ink2);margin-bottom:5px;font-weight:800}
select,input[type=text],textarea{width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;
  padding:13px;appearance:none;-webkit-appearance:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--tif)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tifD) 50%),linear-gradient(135deg,var(--tifD) 50%,transparent 50%);
  background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%;background-size:7px 7px,7px 7px;background-repeat:no-repeat;padding-right:38px}
textarea{min-height:104px;font-size:.8em;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.ex{margin-top:7px;background:var(--pale);border-left:4px solid var(--tifL);border-radius:0 8px 8px 0;
  padding:7px 11px;font-size:.78em;color:var(--ink2)}
.ex b{color:var(--tifD);font-weight:800;margin-right:8px;font-size:.92em}
.okline{margin-top:9px;font-size:.8em;color:var(--green);font-weight:800}
.warnline{margin-top:9px;font-size:.8em;color:var(--amber);font-weight:800;line-height:1.6}

/* ===== ホワイトボード ===== */
.board{background:#FFFFFF;border:8px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03),0 3px 0 rgba(16,60,58,.10);margin:15px 0}
@media (prefers-color-scheme: dark){.board{background:#F4FAF9;border-color:#35514E}}
.board svg{display:block;width:100%;height:auto}
.board .cap{font-size:.82em;color:#4C6B68;text-align:center;margin-top:7px}

/* ===== 食材棚 ===== */
.shelf{background:var(--pale);border:2px solid var(--line);border-radius:16px;padding:12px}
.shelf .cells{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cell{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 12px 12px;box-shadow:0 2px 0 var(--line)}
.cell .e{font-size:1.9em;display:block;line-height:1}
.cell .n{display:block;font-weight:800;font-size:.95em;margin-top:7px}
.cell .c{display:block;font-size:.76em;color:var(--ink2);margin-top:3px;line-height:1.55}
.cell .num{position:absolute;top:9px;right:11px;font-size:.74em;color:var(--ink2);font-weight:800}

/* ===== 一覧 ===== */
.entry{width:100%;text-align:left;display:flex;align-items:center;gap:11px;background:var(--card);
  border:1.5px solid var(--line);border-left:6px solid var(--tif);border-radius:12px;padding:12px;margin-top:9px;
  box-shadow:0 2px 0 var(--line)}
.entry .n{font-weight:800;font-size:1em}
.subhead{display:inline-block;font-size:.8em;font-weight:800;color:#fff;background:var(--tifD);
  border-radius:999px;padding:3px 14px;margin:21px 0 2px}

/* ===== 図鑑カード ===== */
.dl{display:grid;grid-template-columns:1.7em 1fr;gap:12px 10px;margin:0;align-items:start}
.dl dt{font-size:1.1em;line-height:1.5}
.dl dd{margin:0;font-size:.95em;line-height:1.78}
.dl dd b{display:block;font-size:.78em;color:var(--tifD);font-weight:800}
ruby rt{font-size:.46em;color:var(--ink2);font-weight:400}

/* ===== おしながき ===== */
.tt{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.tt td{padding:13px 10px;border-top:1.5px solid var(--line);font-size:.94em;vertical-align:middle}
.tt tr:first-child td{border-top:none}
.tt tr[data-ch]{cursor:pointer}
.tt tr[data-ch]:active td{background:var(--card2)}
.tt .h{width:4.6em;background:var(--pale);color:var(--ink2);font-size:.76em;font-weight:800;text-align:center}
.tt .e{width:2.2em;font-size:1.35em;text-align:center}
.tt .d{font-size:.78em;color:var(--ink2)}
.tt .ck{width:2em;text-align:center;font-size:1em}
.tt b{font-weight:800}

/* ===== 授業ノート ===== */
.lesson h3{font-size:1.05em;margin-top:20px;color:var(--tifD);display:flex;gap:7px;align-items:center}
.lesson p{margin:6px 0 0;font-size:.97em;line-height:1.95;
  background-image:repeating-linear-gradient(transparent,transparent calc(1.95em - 1.5px),var(--line) calc(1.95em - 1.5px),var(--line) 1.95em)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.fact{background:var(--card2);border:1.5px solid var(--line);border-left:5px solid var(--tif);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-size:.76em;color:var(--ink2);font-weight:800}
.fact span{font-size:1.06em;font-weight:800}
.key{background:var(--pale);border:2.5px solid var(--tifL);border-radius:12px;padding:15px;margin-top:17px;
  font-size:1.02em;font-weight:800;line-height:1.7}
.key em{display:block;font-style:normal;font-size:.76em;color:var(--tifD);margin-bottom:6px}

/* ===== 貼り紙 ===== */
.notice{background:var(--card);border:2.5px solid var(--red);border-radius:12px;padding:14px;font-size:.9em}
.notice b{color:var(--red);display:block;margin-bottom:5px;font-weight:800}

/* ===== テスト ===== */
.qnum{font-size:.82em;color:var(--ink);font-weight:800}
.qtext{font-size:1.14em;font-weight:800;line-height:1.68;margin:8px 0 16px}
.gauge{height:12px;background:var(--pale);border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--tif)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;
  padding:14px;margin-top:10px;font-size:1em;line-height:1.62;box-shadow:0 2px 0 var(--line)}
.opt .mk{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--pale);
  border:2px solid var(--tifL);font-size:.8em;font-weight:800;margin-right:9px;vertical-align:-.35em}
.opt.ok{border-color:var(--green);background:var(--card2)}
.opt.ok .mk{background:var(--green);color:#fff;border-color:var(--green)}
.opt.ng{border-color:var(--red);background:var(--card2)}
.opt.ng .mk{background:var(--red);color:#fff;border-color:var(--red)}
.exp{margin-top:15px;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:.92em}
.verdict{font-weight:800;font-size:1.04em}
.vok{color:var(--green)} .vng{color:var(--red)}

/* ===== 答案・振り返り ===== */
.answer{text-align:center;padding:6px 0 2px;position:relative}
.answer .big{font-size:3.5em;font-weight:800;line-height:1;color:var(--tifD)}
.answer .big.ng{color:var(--ink2)}
.maru{position:absolute;top:1.6em;left:50%;transform:translateX(-50%);width:11em;pointer-events:none}
.hanko{display:inline-block;margin-top:15px;padding:10px 22px;border:3px solid var(--green);color:var(--green);
  border-radius:10px;font-weight:800;letter-spacing:.16em;transform:rotate(-3deg)}
.hanko.ng{border-color:var(--ink2);color:var(--ink2)}
.statline{display:flex;gap:10px;margin-top:14px}
.statline div{flex:1;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center}
.statline b{display:block;font-size:1.1em;font-weight:800}
.statline span{font-size:.7em;color:var(--ink2);font-weight:700}
.barrow{margin-top:11px}
.barrow .lb{display:flex;justify-content:space-between;font-size:.8em;font-weight:700;margin-bottom:4px}
.barrow .lb em{font-style:normal;color:var(--ink2);font-weight:800}
.bar{height:10px;background:var(--pale);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--tif);border-radius:999px}
.bar i.low{background:var(--red)} .bar i.mid{background:var(--amber)}
.wrongcard{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--red);
  border-radius:12px;padding:14px;margin-top:11px;box-shadow:var(--sh)}
.ansrow{display:grid;grid-template-columns:1.5em 1fr;gap:6px 8px;margin-top:10px;font-size:.92em;align-items:start}
.ansrow .x{color:var(--red);font-weight:800}
.ansrow .o{color:var(--green);font-weight:800}
.ansrow .t.ng{color:var(--ink2);text-decoration:line-through}
.ansrow .t.ok{font-weight:800}
.jump{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.jump button{background:var(--pale);border:1.5px solid var(--tifL);color:var(--tifD);border-radius:999px;
  padding:6px 13px;font-size:.8em;font-weight:800}

/* ===== 成績表 ===== */
.gradetable{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.graderow{display:flex;align-items:center;gap:11px;padding:13px 14px;border-top:1.5px solid var(--line)}
.graderow:first-child{border-top:none}
.graderow .y{width:4.6em;font-size:.82em;font-weight:800;color:var(--ink2)}
.graderow .sc{font-size:1.35em;font-weight:800;min-width:2.6em;text-align:right}
.graderow .mk{font-size:1.2em;font-weight:800;width:1.3em;text-align:center}
.graderow .bar{flex:1}
.hist{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1.5px solid var(--line);font-size:.9em}
.hist:last-child{border-bottom:none}
.badge{display:inline-block;font-size:.72em;font-weight:800;border-radius:999px;padding:1px 9px}
.badge.p{background:var(--green);color:#fff} .badge.f{background:var(--pale);color:var(--ink2)}
.badge.core{background:var(--tif);color:var(--tifInk);font-size:.68em;vertical-align:.12em}

/* ===== 学生証 ===== */
.idcard{background:var(--tif);color:var(--tifInk);border-radius:16px;padding:17px;
  box-shadow:0 3px 0 rgba(6,90,88,.3),var(--sh)}
.idcard .lb{font-size:.74em;font-weight:800;letter-spacing:.1em;opacity:.72}
.idcard .nm{font-size:1.3em;font-weight:800;margin-top:2px}
.idcard .nm.empty{opacity:.55}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
.grades div{background:rgba(255,255,255,.85);border-radius:10px;padding:8px 3px;text-align:center}
.grades b{display:block;font-size:1.18em;font-weight:800;color:var(--tifInk);line-height:1.25}
.grades span{font-size:.64em;color:#2C5250;font-weight:800}
.idcard .small{color:var(--tifInk);opacity:.72}

/* ===== 戻るバー（全ページ・左上） ===== */
.navbar{display:flex;align-items:center;gap:10px;margin:-2px 0 13px}
.navbar .nb{background:var(--card);border:1.5px solid var(--tifL);border-radius:999px;padding:8px 15px;
  font-size:.82em;font-weight:800;color:var(--tifD);box-shadow:0 2px 0 var(--line)}
.navbar .nb:active{transform:translateY(1px);box-shadow:none}
.navbar .nb[disabled]{opacity:.42;color:var(--ink2);border-color:var(--line);box-shadow:none}
.navbar .nw{font-size:.76em;color:var(--ink2);font-weight:800;letter-spacing:.06em}

/* ===== 講義ノート ===== */
.pts{margin:9px 0 0;padding-left:1.25em}
.pts li{margin-top:7px;font-size:.92em;line-height:1.7}
.pts li::marker{color:var(--tifD)}
.faq{background:var(--card2);border:1.5px solid var(--line);border-left:5px solid var(--tif);
  border-radius:0 12px 12px 0;padding:12px 13px;margin-top:11px}
.faq .q{font-weight:800;font-size:.92em;color:var(--tifD)}
.faq .a{font-size:.9em;margin-top:6px;line-height:1.75}
.refs{margin:0;padding-left:1.25em}
.refs li{margin-top:7px;font-size:.85em;color:var(--ink2);line-height:1.65}

/* ===== タブ ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -6px 18px -12px rgba(10,60,58,.4)}
.tabbar button{position:relative;padding:8px 2px 10px;font-size:.68em;color:var(--ink2);font-weight:800;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar .ic{font-size:1.9em;line-height:1.1;width:1.75em;height:1.5em;display:grid;place-items:center;border-radius:999px}
.tabbar button[aria-current=page]{color:var(--tifD)}
.tabbar button[aria-current=page] .ic{background:var(--pale);box-shadow:inset 0 0 0 2px var(--tif)}
</style>
</head>

  <span class="ic">🍎</span><b>CHART 栄養学学校</b>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabbar" id="tabs"></nav>

const MORE={
 energy:[
  {h:'配分は総量の中の話',p:'PFCの比率をいじっても、総エネルギーが同じなら体重の動きはほとんど変わらない。比率が効いてくるのは、体組成の中身、満腹感、そして続けやすさ。この順番で説明すると、相手が優先順位を取り違えない。'},
  {h:'食事誘発性熱産生の差',p:'食べたものを処理するのにもエネルギーがいる。たんぱく質は摂った分の20〜30%、糖質は5〜10%、脂質は0〜3%。高たんぱくの食事が減量で有利とされる理由のひとつが、この差にある。'}],

  {h:'推定式はあくまで出発点',p:'ミフリン・セントジョール式は、男性なら「10×体重kg＋6.25×身長cm−5×年齢＋5」、女性はこの最後が−161。ここに身体活動レベル1.4〜2.0を掛けて総消費を出す。ただし個人差は±10〜15%あるので、2週間の体重推移で必ず補正する。'},

  {h:'戻し方まで設計する',p:'目標体重に着いた日が終わりではない。減量後に一気に戻すと、下がった代謝のまま摂取だけ増えて揺り戻しが起きる。週ごとに少しずつ摂取量を戻していく進め方を、減量に入る前から合意しておく。'}],

  {h:'減量中は除脂肪体重で考える',p:'赤字が深いほど、また体脂肪が少ないほど必要量は上がる。除脂肪体重1kgあたり2.3〜3.1gという幅がよく使われる。体重70kg・体脂肪率20%なら除脂肪56kg、およそ130〜175gが目安になる。'},
  {h:'質をどう見るか',p:'アミノ酸スコアは組成だけを見る。PDCAASは消化率を加えるが1.0で頭打ちになる。DIAASはそこを改め、実態に近い評価とされる。現場では「動物性はおおむね高い、植物性は組み合わせる」で足りる。'},
  {h:'寝る前という選択肢',p:'消化の遅いカゼインを寝る前に30〜40g入れると、睡眠中の数時間にアミノ酸を供給できる。1日の総量が足りている前提での上積みであって、総量の代わりにはならない。'}],
 micro:[
  {h:'鉄でつまずく理由',p:'月経による損失に加え、着地の衝撃で赤血球が壊れる運動性溶血、激しい運動後にヘプシジンが増えて吸収が落ちること、が重なる。ヘモグロビンが正常でもフェリチンが低いことがあるが、そこから先の判断は医療の領域になる。'},

  {h:'開始時点をそろえる',p:'運動の約4時間前に体重1kgあたり5〜7mLを目安に摂り、尿の色が濃ければ足す。走り出す前に整っていない状態から始めると、途中でどれだけ飲んでも追いつかない。'}],
 supp:[

  {h:'量と時間の基本',p:'β-アラニンは1日3.2〜6.4gを2〜4週間以上、効果は1〜4分続く高強度で出やすい。重炭酸ナトリウムは体重1kgあたり0.2〜0.4gを60〜180分前、胃腸の不快感に注意。硝酸塩は運動の2〜3時間前。どれも本番前に必ず試しておく。'}],

  {h:'つなぐ先を用意しておく',p:'線を引くだけでは相手が宙に浮く。連携できる医療機関や管理栄養士を事前に把握しておき、「ここから先は◯◯へ」と具体的に渡せるようにしておく。それができて初めて、線引きが親切になる。'}]
};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function seeded(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pick(arr,n,rnd){const c=arr.slice(),out=[];while(out.length<n&&c.length)out.push(c.splice(Math.floor(rnd()*c.length),1)[0]);return out;}
function shuffle(arr,rnd){const c=arr.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function b64e(s){const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i++)r+=String.fromCharCode(b[i]);return btoa(r);}
function b64d(s){const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new TextDecoder().decode(a);}
function code(str){const a=fnv('CHART-NUT|'+str).toString(16).toUpperCase().padStart(8,'0');const b=(fnv(str.split('').reverse().join(''))%65536).toString(16).toUpperCase().padStart(4,'0');return a+'-'+b;}
function fmtDate(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}

const POOL=[],BYID={};
function addQ(id,lv,cat,q,a,wrongs,x){
  const w=[...new Set(wrongs.filter(v=>v&&v!==a))];   // 同じ文言の誤答が並ばないようにする
  if(w.length<3)return;
  const item={id,lv:Math.min(3,lv),cat,g:groupOf(cat),q,a,o:w.slice(0,3),x};
  POOL.push(item);BYID[id]=item;
}
const vague=v=>/^[—通常非常報告]/.test(v);
function others(list,self,key){            // 誤答は同じ分類から。少なければ同じ区分→全体へ広げる
  let p=list.filter(e=>e.i!==self.i&&e.c===self.c);
  if(p.length<3)p=list.filter(e=>e.i!==self.i&&groupOf(e.c)===groupOf(self.c));
  if(p.length<3)p=list.filter(e=>e.i!==self.i);
  return [...new Set(p.map(e=>e[key]))];             // 同じ説明文を持つ項目があっても1つに寄せる
}
function buildPool(){
  N.forEach(e=>{
    const rnd=seeded(fnv(e.i));
    addQ('n:'+e.i+':w',e.lv,e.c,'次のはたらきをするのはどれ？<br>「'+e.w+'」',e.n,pick(others(N,e,'n'),3,rnd),e.n+'：'+e.w);
    if(!vague(e.d))
      addQ('n:'+e.i+':d',e.lv+1,e.c,e.n+'が足りないと起こりやすいのは？',e.d,pick(others(N,e,'d').filter(v=>!vague(v)),3,rnd),e.n+'の不足：'+e.d+(e.t?'／'+e.t:''));
    addQ('n:'+e.i+':f',e.lv,e.c,e.n+'を多く含む食品の組み合わせは？',e.f.join('、'),pick(others(N,e,'f').map(f=>f.join('、')),3,rnd),e.n+'：'+e.f.join('、'));
    if(!vague(e.e))
      addQ('n:'+e.i+':e',e.lv+1,e.c,e.n+'を摂りすぎたときに起こりやすいのは？',e.e,pick(others(N,e,'e').filter(v=>!vague(v)),3,rnd),e.n+'の過剰：'+e.e);
    if(e.c==='ビタミン'||e.c==='ミネラル'){
      const opp=N.filter(x=>x.c===e.c&&x.s!==e.s).map(x=>x.n);
      addQ('n:'+e.i+':c',e.lv,e.c,'次のうち'+e.s+'の'+e.c+'はどれ？',e.n,pick(opp,3,rnd),e.n+'は'+e.s+'の'+e.c+'。'+(e.c==='ビタミン'?'脂溶性はA・D・E・Kの4種':'多量ミネラルはナトリウム・カリウム・カルシウム・マグネシウム・リン'));
    }
  });
  T.forEach(e=>{
    const rnd=seeded(fnv('t'+e.i));
    let p=T.filter(x=>x.i!==e.i&&x.c===e.c);if(p.length<3)p=T.filter(x=>x.i!==e.i);
    addQ('t:'+e.i+':n',e.lv,e.c,'次の説明にあたる言葉は？<br>「'+e.d+'」',e.n,pick(p.map(x=>x.n),3,rnd),e.n+'：'+e.d);
    addQ('t:'+e.i+':d',e.lv,e.c,e.n+'の説明として正しいのは？',e.d,pick(p.map(x=>x.d),3,rnd),e.n+'：'+e.d);
  });
  Q.forEach((e,i)=>addQ('q:'+i,e.lv,e.c,e.q,e.a,e.o,e.x));
}
buildPool();
POOL.forEach(p=>{if(CORE_ID.has(p.id))p.core=1;});

const DEX=[...N.map(e=>({...e,kind:'n',key:'n:'+e.i,g:groupOf(e.c)})),...T.map(e=>({...e,kind:'t',key:'t:'+e.i,g:groupOf(e.c)}))];

applyFs();
const DAY=86400000,INT=[0,1,2,4,8,16];
function record(id,ok){
  const b=S.box[id]||{b:1,due:0};
  b.b=ok?Math.min(5,b.b+1):1;b.due=Date.now()+INT[b.b]*DAY;S.box[id]=b;
  const st=S.stat[id]||{o:0,n:0};ok?st.o++:st.n++;S.stat[id]=st;
}
const dueList=()=>Object.keys(S.box).filter(id=>BYID[id]&&S.box[id].due<=Date.now());

 1:{g:'ファースト',name:'基礎',desc:'現場に出る前に必ず越える最低ライン',n:20,pass:.9,gate:1,

/* 段ごとの出題範囲：上に行くほど、新しい層の比重が上がる */
const poolOf=r=>r===1?POOL.filter(p=>p.core)
  :r===2?POOL.filter(p=>p.core||p.lv===1)
  :POOL.filter(p=>p.lv<=r-1||p.core);
const mark=p=>p===null?'—':p>=95?'◎':p>=80?'○':p>=60?'△':'×';

let tab='home',ui={},sess=null,HIST=[];
const WHERE={home:'教室',dex:'図鑑',book:'授業',train:'テスト',rec:'通知表',quiz:'テスト中'};
function snap(){const u={};for(const k in ui)if(k!=='tm')u[k]=ui[k];return{tab,ui:u};}
function pushNav(){HIST.push(snap());if(HIST.length>40)HIST.shift();}
function navBack(){
  if(HIST.length){const s=HIST.pop();tab=s.tab;ui=s.ui;}
  else if(tab!=='home'){tab='home';ui={};}
  else return;
  render();scrollTo(0,0);
}
function navBar(){
  const root=!HIST.length&&tab==='home';
  return `<div class="navbar"><button class="nb" data-act="navback" ${root?'disabled':''}>← もどる</button>

  $('#tabs').innerHTML=TABS.map(([k,e,l])=>
   `<button data-tab="${k}" ${tab===k?'aria-current="page"':''}><span class="ic">${e}</span>${l}</button>`).join('');
}

function dexList(list,title,isSearch){
  let h=back(isSearch?'図鑑にもどる':'分類にもどる')+`<h2 class="ttl" style="font-size:1.09em">${title}</h2><div class="small">${list.length}項目</div>`;
  if(!list.length)return h+`<div class="sec small">見つかりませんでした。別の言葉で探してみてください。</div>`;
  [...new Set(list.map(e=>e.kind==='n'?e.s:e.c))].forEach(s=>{
    h+=`<div class="subhead">${esc(s)}</div>`;
    h+=list.filter(e=>(e.kind==='n'?e.s:e.c)===s).map(e=>`<button class="entry" data-dk="${e.key}">
      <span class="emoplate" style="width:1.7em;height:1.7em;font-size:1.3em">${iconOf(e)}</span>
      <span style="flex:1"><span class="n">${ruby(e.n,e.k)}</span>${isCoreEntry(e)?' <span class="badge core">基礎</span>':''}<br><span class="small">${esc((e.kind==='n'?e.w:e.d).slice(0,30))}…</span></span>
      <span class="stars">${stars(e.lv)}</span></button>`).join('');
  });
  return h;
}

    <div style="margin-top:10px">${isCoreEntry(e)?'<span class="badge core" style="margin-right:6px">🔰 基礎</span>':''}<span class="plate">${GROUPS[e.g].emo} ${GROUPS[e.g].label}</span>
      <span class="plate" style="margin-left:6px">${esc(e.kind==='n'?e.c+'／'+e.s:e.c)}</span></div>

  if(e.kind==='n'){
    h+=`<dl class="dl">
      <dt>💪</dt><dd><b>はたらき</b>${esc(e.w)}</dd>
      <dt>😵</dt><dd><b>足りないと</b>${esc(e.d)}</dd>
      <dt>⚠️</dt><dd><b>摂りすぎると</b>${esc(e.e)}</dd>
      <dt>📌</dt><dd><b>おぼえておく</b>${esc(e.t)}</dd></dl>
      ${rule('🍴','これに入っている')}<div>${e.f.map(f=>`<span class="chip">🍴 ${esc(f)}</span>`).join('')}</div>`;
  }else h+=`<dl class="dl"><dt>📖</dt><dd><b>意味</b>${esc(e.d)}</dd></dl>`;
  h+=`</div>`;
  const ch=CH.filter(c=>c.rel.includes(e.i));
  if(ch.length)h+=rule('📚','この授業で出てくる')+ch.map(c=>`<button class="entry" data-ch="${c.i}">
    <span class="emoplate" style="width:1.7em;height:1.7em;font-size:1.3em">${c.emo}</span>

  return h;
}

    結果は終わったあとにコピーして提出できます。</div></div>`;

function balanced(pool,n,rnd){
  const by={};pool.forEach(p=>{(by[p.g]=by[p.g]||[]).push(p);});
  const keys=shuffle(Object.keys(by),rnd);keys.forEach(k=>by[k]=shuffle(by[k],rnd));
  const out=[];let moved=true;
  while(out.length<n&&moved){moved=false;
    for(const k of keys){if(out.length>=n)break;if(by[k].length){out.push(by[k].shift());moved=true;}}}
  return shuffle(out,rnd);
}
function begin(qs,opt){
  if(!qs.length){alert('この条件では問題がありません。出るところを広げてください。');return;}
  sess={qs,i:0,ans:[],lv:opt.lv||0,big:!!opt.big,fb:opt.fb||'each',label:opt.label,review:!!opt.review,t0:Date.now()};
  tab='quiz';renderQuiz();scrollTo(0,0);
}
function buildExam(rank,n,rnd,big){
  if(rank===1){                              // ファースト：線引きを必ず6問入れる
    const pool=POOL.filter(p=>p.core);
    if(!big)return balanced(pool,n,rnd);
    const ma=pool.filter(p=>p.must);
    const must=pick(ma,Math.min(6,ma.length),rnd);
    const ids=new Set(must.map(p=>p.id));
    return shuffle(must.concat(balanced(pool.filter(p=>!ids.has(p.id)),n-must.length,rnd)),rnd);
  }
  if(rank===2)return balanced(POOL.filter(p=>p.core||p.lv===1),n,rnd);
  const main=POOL.filter(p=>p.lv===rank-1);            // サード以上：新しい層を7割
  const a=balanced(main,Math.round(n*.7),rnd);
  const ids=new Set(a.map(p=>p.id));
  const base=POOL.filter(p=>(p.lv<rank-1||p.core)&&!ids.has(p.id));
  return shuffle(a.concat(balanced(base,n-a.length,rnd)),rnd);
}
function startQuiz(lv,g,mode,fb){
  const big=mode==='big';
  const n=big?LV[lv].n:10;
  const rnd=seeded(Date.now()>>>0);
  let qs;
  if(g==='all'||big)qs=buildExam(lv,n,rnd,big);
  else{
    const p=poolOf(lv).filter(x=>x.g===g);
    if(!p.length){alert('この条件では問題がありません。出るところを広げてください。');return;}
    qs=shuffle(p,rnd).slice(0,n);
  }
  begin(qs,{lv,big,fb,label:LV[lv].g+(big?' 昇級テスト':' 小テスト')});
}

const barHtml=p=>`<div class="bar"><i class="${p<50?'low':p<80?'mid':''}" style="width:${Math.max(p,2)}%"></i></div>`;
const fmtMin=ms=>{const s=Math.round(ms/1000);return s<60?s+'秒':Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒';};
const dexKeyFor=q=>{const m=q.id.match(/^([nt]:[^:]+):/);return m?m[1]:null;};
function chapterFor(q){
  const m=q.id.match(/^[nt]:([^:]+):/);
  if(m){const c=CH.find(c=>c.rel.includes(m[1]));if(c)return c;}
  return CH.find(c=>c.g===q.g)||null;
}
function groupStats(){
  const a={};Object.keys(S.stat).forEach(id=>{const q=BYID[id];if(!q)return;
    const g=a[q.g]=a[q.g]||{o:0,n:0};g.o+=S.stat[id].o;g.n+=S.stat[id].n;});
  return a;
}

function submitText(s,score,total,pct,pass,need){
  const name=S.name||'（氏名未記入）',date=fmtDate(s.ts);
  const by={};s.ans.forEach(a=>{const g=by[a.q.g]=by[a.q.g]||{o:0,n:0};a.ok?g.o++:g.n++;});
  const wrong=s.ans.filter(a=>!a.ok);
  const L=['CHART 栄養学学校　テスト結果',
    '氏名：'+name,
    '試験：'+s.label,
    '得点：'+score+'/'+total+'（'+pct+'点）',
    '判定：'+(pass?'合格':'不合格')+'（合格ライン '+need+'点）',
    '日時：'+date,
    '検証コード：'+code(`${name}|${s.label}|${score}/${total}|${date}`),
    '',
    '── 分野ごとの正答率 ──'];
  Object.keys(by).forEach(g=>{const t=by[g].o+by[g].n;
    L.push('・'+GROUPS[g].label+'　'+Math.round(by[g].o/t*100)+'%（'+by[g].o+'/'+t+'）');});
  L.push('');
  L.push('── まちがえた問題 '+wrong.length+'問 ──');
  if(!wrong.length)L.push('・なし');
  else wrong.forEach((a,i)=>L.push((i+1)+'. '+a.q.q.replace(/<br>/g,' ').replace(/<[^>]+>/g,'')+'\n　 正解：'+a.q.a));
  L.push('');
  L.push('※ 氏名・試験・得点・日時を書き換えると、検証コードと合わなくなります');
  return L.join('\n');
}

    .sort((a,b)=>gs[a].o/(gs[a].o+gs[a].n)-gs[b].o/(gs[b].o+gs[b].n));
  if(keys.length){
    L.push('');L.push('── 分野ごとの正答率（苦手な順）──');
    keys.forEach(g=>{const t=gs[g].o+gs[g].n;
      L.push('・'+GROUPS[g].label+'　'+Math.round(gs[g].o/t*100)+'%（'+t+'問）');});
  }
  L.push('');
  L.push('学習量：解いた問題 '+Object.keys(S.box).length+'問／定着 '+Object.values(S.box).filter(x=>x.b===5).length+'問／授業 '+Object.keys(S.read).length+'/'+CH.length+'回');
  const hs=S.hist.filter(e=>e.big).slice(0,8);
  if(hs.length){L.push('');L.push('── 直近の受験 ──');
    hs.forEach(e=>L.push('・'+fmtDate(e.ts)+'　'+e.label+'　'+e.pct+'点　'+(e.pass?'合格':'不合格')));}
  return L.join('\n');
}
function issueText(ts){
  const e=S.hist.find(x=>x.ts===ts);if(!e)return '';
  const name=S.name||'（氏名未記入）',date=fmtDate(e.ts);
  return ['CHART 栄養学学校 修了証','氏名：'+name,'試験：'+e.label,
    '得点：'+e.score+'/'+e.total+'（'+e.pct+'点）','判定：'+(e.pass?'合格':'不合格'),'日時：'+date,
    '検証コード：'+code(`${name}|${e.label}|${e.score}/${e.total}|${date}`)].join('\n');
}
function verifyText(t){
  const g=re=>{const m=t.match(re);return m?m[1].trim():null;};
  const name=g(/氏名：(.+)/),label=g(/試験：(.+)/),sc=t.match(/得点：\s*(\d+)\/(\d+)/),date=g(/日時：(.+)/),cd=g(/検証コード：(.+)/);
  if(!name||!label||!sc||!date||!cd)return{ok:false,msg:'必要な行が読み取れません。テキスト全体をそのまま貼り付けてください。'};
  return code(`${name}|${label}|${sc[1]}/${sc[2]}|${date}`)===cd
    ?{ok:true,msg:`${name}／${label}／${sc[1]}/${sc[2]}／${date}　の内容で発行された修了証です。`}
    :{ok:false,msg:'内容と検証コードが合いません。書き換えられているか、発行したときの氏名がちがいます。'};
}

/* ============================================================
   11. 操作
   ============================================================ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-ch],button');if(!t)return;const d=t.dataset;
  if(d.tab){if(tab==='quiz'&&sess&&!sess.saved&&sess.ans.length&&!confirm('テストをやめますか？'))return;sess=null;go(d.tab);return;}
  if(d.act==='navback'||d.act==='back'){
    if(tab==='quiz'&&sess&&!sess.saved&&sess.ans.length&&!confirm('テストを中断してもどりますか？'))return;
    if(tab==='quiz')sess=null;
    navBack();return;}
  if(d.act==='rev'){startReview();return;}
  if(d.act==='dcore'){pushNav();ui={dcore:1};tab='dex';render();scrollTo(0,0);return;}
  if(d.act==='gotob'){go('book');return;}
  if(d.act==='gotod'){go('dex');return;}
  if(d.act==='gotot'){pushNav();tab='train';ui={tmode:'big',tlv:1};render();scrollTo(0,0);return;}
  if(d.act==='home'){sess=null;go('home');return;}
  if(d.dg){pushNav();ui.dg=d.dg;ui.dkey=null;render();scrollTo(0,0);return;}
  if(d.dk){pushNav();tab='dex';ui={dkey:d.dk};render();scrollTo(0,0);return;}
  if(d.ch){pushNav();tab='book';ui={ch:d.ch};render();scrollTo(0,0);return;}
  if(d.ids){startIds(d.ids.split(','),d.label);return;}
  if(d.gq){startGroup(d.gq,d.label);return;}
  if(d.mini){startQuiz(+d.mini,'all','mini','each');return;}
  if(d.act==='start'){startQuiz(ui.tlv||1,ui.tg||'all',ui.tmode||'mini',ui.tfb||'each');return;}
  if(d.pick!==undefined){
    const s=sess;if(s.picked!==undefined)return;
    const q=s.qs[s.i],picked=s.opts.list[+d.pick],ok=picked===q.a;
    s.picked=picked;s.ans.push({q,picked,ok});record(q.id,ok);save();renderQuiz();return;}
  if(d.act==='next'){sess.i++;sess.picked=undefined;sess.opts=null;
    if(sess.i>=sess.qs.length)renderResult();else{renderQuiz();scrollTo(0,0);}return;}
  if(d.act==='quit'){if(confirm('やめて結果を見ますか？')){if(sess.ans.length)renderResult();else{sess=null;go('home');}}return;}
  if(d.act==='retry'){if(sess.lv)startQuiz(sess.lv,'all',sess.big?'big':'mini',sess.fb);else startIds(sess.qs.map(q=>q.id),sess.label);return;}
  if(d.act==='issue'){pushNav();ui={issued:issueText(+d.ts)};tab='rec';render();scrollTo(0,0);return;}
  if(d.act==='report'){ui.report=reportText();render();return;}
  if(d.act==='copy'||d.act==='copyexp'||d.act==='copysub'||d.act==='copyrep'){
    const el=document.getElementById({copy:'issued',copyexp:'expbox',copysub:'subbox',copyrep:'repbox'}[d.act]);
    if(!el)return;
    const label=t.textContent;
    try{el.focus();el.select();el.setSelectionRange(0,99999);}catch(e){}
    let done=false;
    try{
      if(navigator&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(el.value);done=true;}
      else if(document.execCommand){done=document.execCommand('copy');}
    }catch(err){done=false;}
    t.textContent=done?'✓ コピーしました':'長押しして選択・コピーしてください';
    setTimeout(()=>{t.textContent=label;},1800);
    return;}
  if(d.act==='verify'){const r=verifyText(ui.vtext||'');ui.vok=r.ok;ui.vres=r.msg;render();return;}
  if(d.act==='export'){const j=JSON.stringify(S);ui.exp='NUT2:'+b64e(j)+':'+fnv(j).toString(16).toUpperCase();render();return;}
  if(d.act==='importopen'){ui.impopen=!ui.impopen;render();return;}
  if(d.act==='import'){
    const m=(ui.imptext||'').trim().match(/^NUT2:([A-Za-z0-9+/=]+):([0-9A-F]+)$/);
    if(!m){alert('NUT2形式のテキストではありません。');return;}
    try{const json=b64d(m[1]);
      if(fnv(json).toString(16).toUpperCase()!==m[2]){alert('データが壊れています。コピーし直してください。');return;}
      if(!confirm('いまの学習データを上書きします。よろしいですか？'))return;
      S={...DEF,...JSON.parse(json)};save();ui={};render();alert('読み込みました。');
    }catch(err){alert('読み込めませんでした。');}return;}
  if(d.act==='reset'){if(confirm('すべての記録を消します。元に戻せません。')){S={...DEF};save();ui={};render();}return;}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.set==='fs'){S.fs=e.target.value;save();applyFs();render();}
  if(d.set==='hf'){ui.hf=e.target.value;render();}
  if(d.dex==='furi'){S.furi=e.target.value==='1';save();render();}
  if(d.t==='lv'){ui.tlv=+e.target.value;render();}
  if(d.t==='mode'){ui.tmode=e.target.value;render();}
  if(d.t==='g')ui.tg=e.target.value;
  if(d.t==='fb')ui.tfb=e.target.value;
});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.dex==='kw'){ui.dkw=e.target.value;clearTimeout(ui.tm);
    ui.tm=setTimeout(()=>{const v=ui.dkw;render();const el=document.querySelector('[data-dex="kw"]');
      if(el){el.value=v;el.focus();el.setSelectionRange(v.length,v.length);}},300);}
  if(d.rec==='name'){S.name=e.target.value.slice(0,20);save();
    const n=document.getElementById('idnm');
    if(n){n.textContent=S.name||'名前 未記入';n.className='nm'+(S.name?'':' empty');}
    const st=document.getElementById('nmst');
    if(st)st.innerHTML=nameStatus();}
  if(d.rec==='verify')ui.vtext=e.target.value;
  if(d.rec==='imp')ui.imptext=e.target.value;
});
render();
</script>
