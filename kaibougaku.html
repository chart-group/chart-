<!DOCTYPE html>
<html lang="ja" data-furi="1">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#171012">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ANATOMIA — 解剖学ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#171012; --ink2:#221819; --ink3:#2E2124; --ink4:#3A2A2E;
  --line:#4A363B; --line2:#684C52;
  --ivory:#FBF5EC; --bone:#C4B2A7; --bone2:#9C8880;
  --carmine:#E05159; --carmine-d:#9E2A31; --carmine-g:#F0757A;
  --ochre:#F0BC55; --ochre-d:#C29444;
  --sage:#7ABF97; --sage-d:#3C6E55;
  --warn-t:#EFDADA; --soft-t:#E6DCD2;
  --track:#3A2A2E; --figbase:#2E2124; --fig0:#402A2F;
  --glow1:rgba(217,72,79,.13); --glow2:rgba(240,188,85,.06);
  --r:3px;
  --disp:"Bodoni Moda",serif;
  --jpd:"Shippori Mincho",serif;
  --jp:"Zen Kaku Gothic New",sans-serif;
  --mono:"IBM Plex Mono",monospace;
}
[data-theme="paper"]{
  color-scheme:light;
  --ink:#F5EFE3; --ink2:#EDE4D4; --ink3:#E3D8C4; --ink4:#D5C7AF;
  --line:#CBB99E; --line2:#A89172;
  --ivory:#241A17; --bone:#5E4C42; --bone2:#726052;
  --carmine:#A5262E; --carmine-d:#7A1B22; --carmine-g:#B03039;
  --ochre:#8A6210; --ochre-d:#8A6A1E;
  --sage:#2C6B4E; --sage-d:#5FA37E;
  --warn-t:#4A2A2A; --soft-t:#3A2E28;
  --track:#DCCFB8; --figbase:#E3D8C4; --fig0:#DCCDB4;
  --glow1:rgba(165,38,46,.07); --glow2:rgba(184,146,66,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink)}
#bg{position:fixed;inset:0;z-index:-1;background:var(--ink);
  background-image:
    radial-gradient(ellipse 120% 70% at 50% -8%, var(--glow1), transparent 62%),
    radial-gradient(ellipse 90% 50% at 90% 100%, var(--glow2), transparent 62%);
  pointer-events:none}
body{
  background:var(--ink);
  color:var(--ivory); font-family:var(--jp);
  font-size:15px; line-height:1.75; letter-spacing:.01em;
  min-height:100vh; overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
h1,h2,h3,h4{margin:0;font-weight:500;line-height:1.35}

/* ---------- shell ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 18px 130px}
.topbar{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(180deg,var(--ink) 62%,rgba(21,14,16,.86) 88%,transparent);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  padding:14px 0 16px;margin-bottom:6px;
}
.topbar-in{max-width:760px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px}
.mark{font-family:var(--disp);font-size:18px;letter-spacing:.18em;overflow:hidden;text-overflow:ellipsis;color:var(--ivory);white-space:nowrap}
.mark em{font-style:italic;color:var(--carmine-g)}
.topmeta{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--bone)}
.xpchip{border:1px solid var(--line2);border-radius:999px;padding:5px 11px;color:var(--ochre);letter-spacing:.08em;font-size:11px;white-space:nowrap}
.backbtn{font-family:var(--jp);font-size:13.5px;font-weight:500;letter-spacing:.02em;color:var(--ivory);
  background:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:0 17px;
  min-height:42px;display:flex;align-items:center;gap:6px;transition:.18s;flex:none}
.tbtn{width:38px;height:38px;font-family:var(--jp);flex:none;border:1px solid var(--line);border-radius:999px;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--bone);transition:.18s}
.tbtn:active{background:var(--ink3)}
.tbtn.off{opacity:.38}
.bigback{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;
  border:1px solid var(--line2);border-radius:var(--r);background:var(--ink2);
  padding:16px;margin-top:13px;font-size:14.5px;font-weight:500;color:var(--ivory);transition:.18s}
.bigback:active{background:var(--ink3)}
.bigback span{font-family:var(--mono);font-size:16px;color:var(--ochre)}
.backbtn:focus-visible{color:var(--ivory);border-color:var(--ochre);outline:none}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--bone2)}
.plate-no{font-family:var(--disp);font-size:12px;font-style:italic;color:var(--ochre-d);letter-spacing:.1em}
.h-disp{font-family:var(--disp);font-size:clamp(30px,8.6vw,44px);font-weight:400;letter-spacing:.02em;line-height:1.06}
.h-jp{font-family:var(--jpd);font-weight:700}
.sub{color:var(--bone);font-size:13px;line-height:1.85}
.rule{height:1px;background:linear-gradient(90deg,var(--line2),transparent);margin:22px 0}

/* ---------- home ---------- */
.hero{padding:16px 0 4px;text-align:center}
.hero .h-disp{margin-bottom:2px}
.hero-jp{font-family:var(--jpd);font-size:13px;letter-spacing:.34em;color:var(--bone);margin-bottom:20px}

.atlas{position:relative;display:flex;justify-content:center;gap:6px;margin:4px 0 10px}
.figwrap{position:relative;width:min(50%,205px)}
.figlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--bone2);text-align:center;margin-top:2px}
.fig{width:100%;display:block;overflow:visible}
.fig .base{fill:var(--figbase);stroke:var(--line);stroke-width:.9}
.fig .reg{stroke:var(--line2);stroke-width:.7;cursor:pointer;transition:fill .5s ease,stroke .2s}
.fig .reg:active{stroke:var(--ochre);stroke-width:1.4}
.fig .reg:focus-visible{outline:none;stroke:var(--ochre);stroke-width:1.4}

.ringrow{display:flex;align-items:center;gap:16px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ring-n{font-family:var(--disp);font-size:25px;line-height:1;color:var(--ivory)}
.ring-l{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--bone2);margin-top:3px}
.rankbox{text-align:left;min-width:150px}
.rankname{font-family:var(--jpd);font-size:19px;font-weight:700;color:var(--ochre)}
.rankstat{font-family:var(--mono);font-size:11px;color:var(--bone);letter-spacing:.05em;line-height:1.9}

/* ---------- cards / lists ---------- */
.sec-head{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.sec-head h2{font-family:var(--jpd);font-size:17px;font-weight:700}
.sec-head .eyebrow{margin-left:auto}

.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.rcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(155deg,var(--ink2),var(--ink));padding:13px 13px 11px;overflow:hidden;transition:.2s}
.rcard:focus-visible{border-color:var(--ochre);outline:none}
.rcard:active{background:var(--ink3)}
.rcard .rno{font-family:var(--disp);font-style:italic;font-size:11px;color:var(--ochre-d)}
.rcard .rn{font-family:var(--jpd);font-size:15.5px;font-weight:700;margin:1px 0 1px}
.rcard .rlat{font-family:var(--disp);font-size:10.5px;font-style:italic;color:var(--bone2);letter-spacing:.04em}
.rcard .rmeta{font-family:var(--mono);font-size:10px;color:var(--bone);margin-top:9px;display:flex;justify-content:space-between}
.bar{height:3px;background:var(--ink4);margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--carmine);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.g i{background:var(--sage)}

.mlist{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);
  text-align:left;width:100%;transition:.16s}
.mrow:focus-visible{background:var(--ink2);outline:none}
.mrow:active{background:var(--ink3)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink4);border:1px solid var(--line2)}
.dot.seen{background:var(--ochre);border-color:var(--ochre)}
.dot.mast{background:var(--sage);border-color:var(--sage)}
.mrow .mn{font-family:var(--jpd);font-size:15px;font-weight:500}
.mrow .ml{font-family:var(--disp);font-style:italic;font-size:10.5px;color:var(--bone2);display:block;letter-spacing:.03em}
.mrow .mgo{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--line2)}

/* ---------- detail plate ---------- */
.plate{border:1px solid var(--line);border-radius:var(--r);background:var(--ink2);overflow:hidden}
.plate-hd{padding:18px 17px 15px;background:linear-gradient(165deg,var(--ink3),var(--ink2));border-bottom:1px solid var(--line)}
.plate-hd .rd{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--bone2)}
.plate-hd h1{font-family:var(--jpd);font-size:26px;font-weight:700;margin:3px 0 4px;color:var(--ivory)}
.plate-hd .lat{font-family:var(--disp);font-style:italic;font-size:13.5px;color:var(--carmine-g);letter-spacing:.03em}
.entry{display:flex;gap:13px;padding:15px 17px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:none}
.enum{font-family:var(--disp);font-size:14px;font-style:italic;color:var(--ochre);flex:none;width:20px;padding-top:2px;text-align:right}
.ebody{flex:1;min-width:0}
.elabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--bone2);text-transform:uppercase;margin-bottom:4px}
.etext{font-size:14.5px;line-height:1.8}
.etext.acc{color:var(--ivory)}
.ul{list-style:none;padding:0;margin:0}
.ul li{padding-left:15px;position:relative;font-size:14px;line-height:1.72;margin-bottom:3px}
.ul li::before{content:"—";position:absolute;left:0;color:var(--carmine);font-family:var(--mono);font-size:11px;top:1px}
.ul.o li::before{color:var(--ochre)}
.ul.s li::before{color:var(--sage)}
.nerve{font-family:var(--mono);font-size:13px;color:var(--ochre);letter-spacing:.02em}
.warn{border-left:2px solid var(--carmine);padding-left:11px;color:var(--warn-t);font-size:13.5px;line-height:1.78}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;text-align:center;border:1px solid var(--line2);border-radius:var(--r);
  padding:14px;font-family:var(--jp);font-size:14.5px;font-weight:500;transition:.2s;background:var(--ink2)}
.btn:focus-visible{border-color:var(--ochre);color:var(--ochre);outline:none}
.btn:active{background:var(--ink3)}
.btn.pri{background:linear-gradient(160deg,var(--carmine),var(--carmine-d));border-color:var(--carmine-d);color:#fff}
.btn.pri:focus-visible{filter:brightness(1.12);color:#fff;border-color:var(--carmine-g)}
.btn.pri:active{filter:brightness(1.15)}
.btn.gold{border-color:var(--ochre-d);color:var(--ochre)}
.btn.gold:focus-visible{background:rgba(217,164,65,.12)}
.btn.gold:active{background:rgba(217,164,65,.12)}
.btnrow{display:grid;gap:9px;margin-top:16px}
.btnrow.two{grid-template-columns:1fr 1fr}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--bone);margin-bottom:4px}
.qprog{height:3px;background:var(--ink4);margin-bottom:22px;position:relative;overflow:hidden}
.qprog i{position:absolute;inset:0 auto 0 0;background:var(--ochre);transition:width .35s}
.combo{margin-left:auto;color:var(--carmine-g);font-weight:500;opacity:0;transition:.25s}
.combo.on{opacity:1}
.qkind{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--bone2);text-transform:uppercase}
.qtext{font-family:var(--jpd);font-size:20px;font-weight:500;line-height:1.6;margin:8px 0 6px}
.qsub{font-family:var(--mono);font-size:12px;color:var(--ochre);line-height:1.9;margin-bottom:4px;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.opt{text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:var(--ink2);
  font-size:14.5px;line-height:1.6;transition:.18s;display:flex;gap:11px;align-items:flex-start}
.opt:focus-visible:not(:disabled){border-color:var(--ochre);background:var(--ink3);outline:none}
.opt:active:not(:disabled){background:var(--ink3)}
.opt .ok{font-family:var(--disp);font-style:italic;font-size:12px;color:var(--bone2);flex:none;padding-top:2px;width:13px}
.opt.correct{border-color:var(--sage);background:rgba(95,163,126,.10)}
.opt.correct .ok{color:var(--sage)}
.opt.wrong{border-color:var(--carmine);background:rgba(196,56,63,.09);animation:shk .3s}
.opt.wrong .ok{color:var(--carmine)}
.opt:disabled{cursor:default}
@keyframes shk{0%,100%{transform:translateX(0)}22%{transform:translateX(-5px)}62%{transform:translateX(4px)}}
.feed{margin-top:16px;border:1px solid var(--line);border-left-width:2px;border-radius:var(--r);padding:13px 15px;background:var(--ink2)}
.feed.ok{border-left-color:var(--sage)}
.feed.ng{border-left-color:var(--carmine)}
.feed .fh{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:5px}
.feed.ok .fh{color:var(--sage)}
.feed.ng .fh{color:var(--carmine-g)}
.feed .ft{font-size:13.5px;line-height:1.8;color:var(--soft-t)}
.feed .ft b{color:var(--ivory);font-weight:500}

/* ---------- result ---------- */
.result{text-align:center;padding:26px 0 6px}
.score{font-family:var(--disp);font-size:74px;line-height:1;color:var(--ivory)}
.score small{font-size:22px;color:var(--bone2)}
.verdict{font-family:var(--jpd);font-size:19px;font-weight:700;margin-top:10px}
.rev{margin-top:8px;text-align:left}
.revrow{border-bottom:1px solid var(--line);padding:12px 2px}
.revq{font-size:13.5px;line-height:1.7}
.reva{font-family:var(--mono);font-size:11.5px;color:var(--sage);margin-top:4px}
.revx{font-family:var(--mono);font-size:11.5px;color:var(--carmine-g);text-decoration:line-through;opacity:.75}

ruby{ruby-align:center}
rt{font-size:.5em;font-weight:400;letter-spacing:0;color:var(--bone2);opacity:.95}
[data-furi="0"] rt{display:none}
[data-furi="1"] .etext,[data-furi="1"] .ul li,[data-furi="1"] .warn,[data-furi="1"] .qtext,
[data-furi="1"] .feed .ft,[data-furi="1"] .howto p{line-height:2.15}
.howto{border:1px solid var(--line);border-left:2px solid var(--ochre-d);border-radius:var(--r);
  background:var(--ink2);padding:12px 14px;margin-top:11px}
.howto .hh{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ochre);margin-bottom:6px}
.howto p{margin:0;font-size:14px;line-height:1.85}
.howto .cue{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
  font-size:13px;line-height:1.8;color:var(--soft-t)}
.howto .cue b{color:var(--carmine-g);font-weight:500;font-family:var(--mono);font-size:10px;letter-spacing:.16em}
.pose{background:radial-gradient(ellipse 75% 65% at 50% 50%,#241A1D,#180F12);
  border:1px solid var(--line);border-radius:var(--r);margin-top:10px;padding:6px 4px 0}
.pose svg{width:100%;max-width:250px;display:block;margin:0 auto}
.pose .pl{text-align:center;font-family:var(--jp);font-size:12px;color:#D6C6B8;padding:3px 0 1px;font-weight:500}
.pose .pd{text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:#9A8578;padding:0 0 8px}
.dia{background:radial-gradient(ellipse 80% 60% at 50% 40%,#241A1D,#1A1214);border-bottom:1px solid var(--line);padding:12px 0 0}
.dia svg{width:100%;max-width:232px;display:block;margin:0 auto}
.dia .belly{fill:#D9484F;fill-opacity:.42;stroke:#D9484F;stroke-width:1.4;transition:opacity .3s;
  animation:pulse 2.4s cubic-bezier(.4,0,.6,1) 1}
@keyframes pulse{0%{fill-opacity:.06}55%{fill-opacity:.58}100%{fill-opacity:.40}}
.dia .mo,.dia .mi{transition:opacity .3s}
.dia .lmk{fill:#D9A441;stroke:#150E10;stroke-width:.9}
.dia .lmt{font-family:monospace;font-size:7px;fill:#150E10;text-anchor:middle;font-weight:700}
.dia .mo{fill:#D9A441;stroke:#150E10;stroke-width:.9}
.dia .mi{fill:#5FA37E;stroke:#150E10;stroke-width:.9}
.dia[data-hide~="o"] .mo,.dia[data-hide~="i"] .mi,.dia[data-hide~="b"] .belly{opacity:0}
.dialeg{display:flex;gap:7px;justify-content:center;padding:6px 10px 12px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--bone);
  border:1px solid var(--line);border-radius:999px;padding:9px 13px;min-height:34px;display:flex;align-items:center;gap:5px;transition:.18s}
.chip:focus-visible{border-color:var(--ochre);color:var(--ivory);outline:none}
.chip i{width:7px;height:7px;border-radius:50%;display:block}
.chip.off{opacity:.34;text-decoration:line-through}
.dianote{text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:#6A5952;padding:0 0 9px}
.dia .belly{fill:#D9484F}
.dia .tend{fill:#EADFCB;fill-opacity:.85;stroke:#A8977F;stroke-width:1.2}
.dia .tfib{fill:none;stroke:#B5A48A;stroke-width:.7;opacity:.75}
.dia .fib{fill:none;stroke:#7A1A20;stroke-width:.5;opacity:.55}
.dia .arw{stroke:#F0BC55;stroke-width:4;fill:none;stroke-linecap:round}
.dia .arwh{fill:#F0BC55;stroke:none}
.dia.ln .arw{stroke:#7ABF97}.dia.ln .arwh{fill:#7ABF97}
.dia .belly.sh{fill-opacity:.60}
.dia .belly.ln{fill-opacity:.18;stroke-dasharray:5 3.5}
.refcard{border:1px solid var(--line2);border-left:2px solid var(--ochre);border-radius:var(--r);
  background:var(--ink2);padding:13px 15px;margin-top:13px}
.refcard .rh{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ochre);margin-bottom:6px}
.refcard p{margin:0;font-size:13.5px;line-height:1.8;color:var(--soft-t)}
.dirbox{border:1px solid var(--line);border-left:2px solid var(--sage);border-radius:var(--r);
  background:var(--ink2);padding:13px 15px}
.dirbox .dh{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--sage);margin-bottom:6px}
.dirbox p{margin:0;font-size:15px;line-height:1.85;color:var(--ivory);font-weight:500}
.diasub{background:radial-gradient(ellipse 80% 60% at 50% 45%,#241A1D,#180F12);
  border:1px solid var(--line);border-radius:var(--r);margin-top:12px;padding:8px 8px 0}

.diasub svg{width:100%;max-width:200px;display:block;margin:0 auto}
.diasub .cap{text-align:center;font-family:var(--jp);font-size:11.5px;letter-spacing:.06em;
  color:#CBB9AC;padding:5px 4px 10px}
.diasub .cap b{font-weight:400}
.diasub.sh .cap b{color:#F0BC55}.diasub.ln .cap b{color:#7ABF97}
.diamini{background:#1A1214;border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-top:11px}
.diamini svg{width:100%;max-width:150px;display:block;margin:0 auto}
.diamini .belly{fill:#D9484F;fill-opacity:.45;stroke:#D9484F;stroke-width:1.4}
.diamini .mo{fill:#D9A441}.diamini .mi{fill:#5FA37E}
.sheet{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;
  background:rgba(8,5,6,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet.on{display:flex;animation:fi .2s ease both}
.sheet-in{width:100%;max-width:520px;background:var(--ink2);border:1px solid var(--line2);
  border-radius:14px 14px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--jpd);font-size:17px;font-weight:700;margin-bottom:3px}
.sheet .sd{font-size:12.5px;color:var(--bone);margin-bottom:16px}
.opt-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.opt-row .ot{flex:1;min-width:0}
.opt-row .on1{font-size:14.5px;font-weight:500}
.opt-row .od{font-size:12px;color:var(--bone);line-height:1.6;margin-top:2px}
.sw{width:54px;height:31px;flex:none;border-radius:999px;background:var(--ink4);border:1px solid var(--line2);
  position:relative;transition:.22s}
.sw i{position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:var(--bone);transition:.22s}
.sw[aria-checked="true"]{background:var(--sage-d);border-color:var(--sage)}
.sw[aria-checked="true"] i{left:25px;background:var(--ivory)}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;flex:none}
.seg button{padding:8px 14px;font-size:12.5px;color:var(--bone);transition:.18s}
.seg button[aria-pressed="true"]{background:var(--ink4);color:var(--ivory)}
.codebox{width:100%;margin-top:10px;background:var(--ink);border:1px solid var(--line2);border-radius:var(--r);
  color:var(--ivory);font-family:var(--mono);font-size:11.5px;line-height:1.6;padding:10px;resize:vertical;
  word-break:break-all;-webkit-appearance:none}
.codebox:focus{outline:none;border-color:var(--ochre)}
.smsg{font-size:12.5px;color:var(--ochre);line-height:1.7;margin-top:8px;min-height:1px}
.notice{border:1px solid var(--carmine-d);border-left-width:3px;border-radius:var(--r);
  background:rgba(196,56,63,.10);padding:12px 14px;margin:4px 0 14px;font-size:13px;line-height:1.8}
.notice b{display:block;color:var(--carmine-g);font-weight:500;margin-bottom:3px}
.gearbtn{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:999px;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--bone);transition:.18s}
.gearbtn:active{background:var(--ink3)}
.review{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(160deg,var(--ink3),var(--ink2));
  padding:14px 15px;margin:22px 0 6px}
.review.due{border-color:var(--carmine-d)}
.rvhead{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.rvt{font-family:var(--jpd);font-size:16px;font-weight:700}
.rvn{margin-left:auto;font-family:var(--disp);font-size:28px;line-height:1;color:var(--ivory)}
.rvn small{font-family:var(--jp);font-size:12px;color:var(--bone);margin-left:3px}
.rvbar{display:flex;gap:2px;height:7px;border-radius:99px;overflow:hidden;background:var(--ink4)}
.rvbar i{display:block}
.rvlg{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0 11px;font-family:var(--mono);font-size:9.5px;color:var(--bone2)}
.rvlg span{display:flex;align-items:center;gap:4px}
.rvlg b{width:7px;height:7px;border-radius:2px;display:block}
.rvdone{font-size:13px;color:var(--sage);text-align:center;padding:4px 0 2px}
.lvcard{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(160deg,var(--ink2),var(--ink));
  padding:13px 14px;margin-bottom:9px}
.lvcard.on{border-color:var(--ochre-d)}
.lvhead{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.lvname{font-family:var(--jpd);font-size:17px;font-weight:700}
.lvname .st{font-family:var(--disp);font-style:italic;font-size:12px;color:var(--ochre);margin-left:6px}
.lvdesc{font-size:12.5px;color:var(--bone);line-height:1.7;margin-bottom:9px}
.lvmeta{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--bone2);white-space:nowrap}
.lvbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvbtns button{border:1px solid var(--line2);border-radius:var(--r);background:var(--ink2);padding:11px 8px;
  font-size:13.5px;font-weight:500;transition:.18s;line-height:1.4}
.lvbtns button:active{background:var(--ink3)}
.lvbtns button small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--bone2);margin-top:3px;letter-spacing:.08em}
.lvbtns button b{color:var(--sage);font-weight:500}
.verdict.pass{color:var(--sage)}
.verdict.fail{color:var(--carmine-g)}
.passline{font-family:var(--mono);font-size:11px;color:var(--bone);margin-top:6px}
.tabs{display:flex;gap:6px;margin:22px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13.5px;
  color:var(--bone);transition:.18s;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink3);border-color:var(--ochre-d);color:var(--ivory)}
.wbody{position:relative;background:radial-gradient(ellipse 75% 60% at 50% 45%,#251B1E,#160E11);
  border:1px solid var(--line);border-radius:var(--r);padding:10px 0 2px;margin-top:0}
.wbody svg{width:100%;max-width:250px;display:block;margin:0 auto;overflow:visible}
.wrow{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.wcol{width:100%}
.wcol+.wcol{border-top:1px solid var(--line);padding-top:14px}
.wlab{text-align:center;font-family:var(--jpd);font-size:15px;font-weight:700;letter-spacing:.16em;color:var(--ivory);padding:8px 0 1px}
.wdir{text-align:center;font-size:11.5px;line-height:1.7;color:var(--bone);padding:0 10px 4px}
.wdir b{color:var(--ochre);font-weight:500}
.sidetag{display:flex;justify-content:space-between;max-width:250px;margin:0 auto;padding:0 4px 6px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--bone2)}
.hit{cursor:pointer;transition:.15s}
.hit:active{fill-opacity:1}
.wbody{overflow:hidden;touch-action:none}
.wbody svg{transform-origin:50% 50%;will-change:transform}
.wbody[data-mode="b"] .L-m,.wbody[data-mode="b"] .L-t{display:none}
.wbody[data-mode="m"] .L-b,.wbody[data-mode="m"] .L-t{display:none}
.wbody[data-mode="t"] .L-b,.wbody[data-mode="t"] .L-m{display:none}
.wbody.zoomed{border-color:var(--ochre-d)}
.zhint{text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#8A7268;padding:2px 0 0}
.seg2{display:flex;gap:5px;justify-content:center;margin:2px 0 7px;flex-wrap:wrap}
.seg2 button{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;color:var(--bone);transition:.18s;display:flex;align-items:center;gap:6px}
.seg2 button i{width:8px;height:8px;border-radius:50%;display:block}
.seg2 button[aria-pressed="true"]{background:var(--ink3);border-color:var(--ochre-d);color:var(--ivory)}
.dia{overflow:hidden;touch-action:none}
.dia svg{transform-origin:50% 50%}
.lchips{display:flex;gap:7px;justify-content:center;padding:6px 8px 12px;flex-wrap:wrap}
.keyfacts{border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--ink3),var(--ink2))}
.kf{display:flex;gap:13px;padding:15px 17px;border-bottom:1px solid var(--line);align-items:flex-start}
.kf:last-child{border-bottom:none}
.kf>i{width:12px;height:12px;border-radius:50%;display:block;flex:none;margin-top:6px}
.kf.o>i{background:#D9A441;box-shadow:0 0 0 3.5px rgba(217,164,65,.18)}
.kf.i>i{background:#5FA37E;box-shadow:0 0 0 3.5px rgba(95,163,126,.18)}
.kf.n>i{background:#C4383F;box-shadow:0 0 0 3.5px rgba(196,56,63,.16)}
.kb{flex:1;min-width:0}
.kl{font-family:var(--jpd);font-size:12.5px;font-weight:700;color:var(--bone);letter-spacing:.12em;margin-bottom:5px}
.kv{font-size:16px;line-height:1.8;color:var(--ivory);font-weight:500}
.kv.mono{font-family:var(--mono);font-size:14px;color:var(--ochre);font-weight:400}
.lm-row{display:flex;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.lm-no{font-family:var(--disp);font-style:italic;font-size:13px;color:var(--ochre);flex:none;width:18px;text-align:right;padding-top:2px}
.lm-b{flex:1;min-width:0}
.lm-n{font-size:15px;font-weight:500;color:var(--ivory)}
.lm-m{font-size:13px;line-height:1.75;color:var(--bone);margin-top:3px}
.lm-a{font-size:12.5px;line-height:1.7;color:var(--sage);margin-top:4px}
.term{border-bottom:1px solid var(--line);padding:15px 2px}
.term .tt{font-family:var(--jpd);font-size:19px;font-weight:700}
.term .te{font-family:var(--disp);font-style:italic;font-size:12px;color:var(--bone2);margin-left:9px}
.term .tm{font-size:14px;line-height:1.8;margin-top:5px}
.term .tx{font-size:12.5px;line-height:1.75;color:var(--ochre);margin-top:6px}
.term .tw{font-size:13px;line-height:1.8;color:var(--soft-t);margin-top:6px;border-left:2px solid var(--sage-d);padding-left:10px}
.srch{margin:26px 0 0}
.srch input{width:100%;background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);
  color:var(--ivory);font-family:var(--jp);font-size:14px;padding:12px 14px;outline:none;transition:.2s;-webkit-appearance:none}
.srch input::placeholder{color:var(--bone2)}
.srch input:focus{border-color:var(--ochre-d);background:var(--ink3)}
.empty{text-align:center;padding:40px 0;color:var(--bone2);font-size:13.5px}
.fadein{animation:fi .34s ease both}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
@media (hover:hover) and (pointer:fine){
  .backbtn:hover{color:var(--ivory);border-color:var(--line2)}
  .rcard:hover{border-color:var(--line2);transform:translateY(-2px)}
  .mrow:hover{background:var(--ink2)}
  .btn:hover{border-color:var(--ochre);color:var(--ochre)}
  .btn.pri:hover{filter:brightness(1.12);color:#fff;border-color:var(--carmine-g)}
  .btn.gold:hover{background:rgba(217,164,65,.09)}
  .opt:hover:not(:disabled){border-color:var(--line2);background:var(--ink3)}
  .fig .reg:hover{stroke:var(--ochre);stroke-width:1.2}
  .chip:hover{border-color:var(--line2);color:var(--ivory)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
@media(max-width:400px){.rgrid{grid-template-columns:1fr 1fr;gap:7px}.rcard{padding:11px}.rcard .rn{font-size:14px}
  .mark{font-size:15px;letter-spacing:.12em}.backbtn{padding:0 13px;font-size:12.5px}}
</style>
</head>

f:"腰椎を分節ごとに支える最深層筋。腰痛では発症した椎間レベルに限局して萎縮と脂肪浸潤が起こることが画像研究で示されており、痛みが消えても自動的には戻らない。先行収縮（フィードフォワード）の遅延は腹横筋で最もよく記述されるが、多裂筋でも予測的な活動の低下が報告されている。",
t:["バードドッグ（対角の手足を伸ばす）10秒×10","ヒップリフト、デッドバグ、プランク","四つ這いでの腰椎ニュートラル保持＋呼吸"],
r:"腹臥位で棘突起の外側1〜2cm、脊柱起立筋の下層を垂直に圧迫。硬結よりも“反応の鈍さ”を評価する。触診と同時に軽く収縮させて筋の応答を確認するのが有効。",
c:"バードドッグを毎日。四つ這いで背骨をニュートラルに保ったまま呼吸10回。腰を反らせるのではなく“積み上げる”感覚。",
p:"慢性腰痛、椎間板障害、分節不安定性、萎縮・脂肪浸潤。"},

{g:"back",n:"腰方形筋",y:"ようほうけいきん",e:"Quadratus Lumborum",k:"クアドラタス・ランボラム",
o:"腸骨稜の後内側部・腸腰靭帯",
i:"第12肋骨の下縁、L1〜L4の肋骨突起",
nv:"腰神経叢 T12–L4",
a:["腰椎の同側側屈","骨盤の挙上（ヒップハイク）","両側：腰椎の伸展・安定化、第12肋骨を固定し呼吸を助ける"],
f:"「隠れた腰痛の主犯」。腰の最深層にあり、片側だけ硬いと骨盤が挙上して脚長差のように見える。座位で片肘をつく、片脚重心、片側でバッグを持つ癖が直結する。立ち上がり時・寝返り時の鋭い腰痛はここが多い。",
t:["サイドプランク（最も効率的なQL種目）","スーツケースキャリー、ファーマーズウォーク（片側荷重に耐える）","ヒップハイク（段差上で骨盤を上下）"],
r:"側臥位（対象側を上）で腸骨稜と第12肋骨の間の“くぼみ”に指を沈め、外側縁から内側へ。脊柱起立筋の外側縁を越えて深部に入る必要がある。腎臓の位置に注意し、圧は側方から。",
c:"側臥位でフォームローラーを腰の外側に当てる。バナナストレッチ（仰向けで両手足を片側に寄せて体をCの字に）30秒×左右。片側重心の癖を止める。",
p:"片側腰痛、骨盤の左右差、機能的脚長差、立ち上がり時痛、側屈制限。"},

{g:"back",n:"胸腰筋膜",y:"きょうようきんまく",e:"Thoracolumbar Fascia",k:"ソラコランバー・ファシア",
o:"（構造体）仙骨・腸骨稜・腰椎棘突起・肋骨に付着する三層構造の腱膜",
i:"広背筋・大殿筋・腹横筋・内腹斜筋・脊柱起立筋を連結する",
nv:"脊髄神経後枝（豊富な自由神経終末を含む）",
a:["腹横筋の収縮を張力に変換し腰椎を安定させる","右広背筋↔左大殿筋の力の伝達（後斜スリング）","腰椎屈曲の受動的制動"],
f:"筋ではなく筋膜だが、腰痛を語るなら外せない構造。侵害受容器が非常に密で、それ自体が痛みの発生源になりうる。腹横筋が収縮するとこの膜に張力がかかり、天然のコルセットとして働く。歩行時に対角の広背筋と大殿筋が交互に張力をかけて骨盤を安定させる。",
t:["後斜スリングを使う種目：ケーブルチョップ、ウッドチョッパー","片脚デッドリフト、逆側荷重のキャリー系","バードドッグ（対角パターンの再教育）"],
r:"腹臥位で仙骨上縁から腸骨稜、L4/L5レベルにかけて手掌または前腕で斜め方向の広いストローク。皮膚を寄せて“遊び”を確認し、滑走性の低い方向へリリース。",
c:"チャイルドポーズで側方に手を伸ばす（斜めのラインを伸ばす）。フォームローラーで腰仙部を斜めに転がす。",
p:"非特異的腰痛、後斜スリング機能不全、歩行時の骨盤動揺。"},

/* ---------- V. 体幹・コア ---------- */
{g:"core",n:"腹直筋",y:"ふくちょくきん",e:"Rectus Abdominis",k:"レクタス・アブドミニス",
o:"恥骨稜・恥骨結合",
i:"第5〜7肋軟骨、剣状突起",
nv:"肋間神経 T7–T12",
a:["体幹の屈曲（胸郭を骨盤に近づける）","骨盤の後傾","腹腔内圧の上昇、呼気の補助"],
f:"腱画により“シックスパック”に見えるだけで、実際は上下で分かれた筋ではない（ただし神経支配は分節的で上部下部で優位差はある）。腹直筋鞘に包まれ、白線で左右が接合。腹直筋離開は出産後だけでなく、腹圧のかけ方を誤った男性にも起こる。見た目の主役だが、安定性の主役は腹横筋であることを混同しない。",
t:["クランチ、ハンギングレッグレイズ、アブローラー","デッドバグ、リバースクランチ（骨盤後傾を意識）","※体脂肪を落とさないと視認できないため、栄養管理が本質"],
r:"背臥位・膝立てで、肋骨弓下から恥骨まで筋腹を上下にストローク。腱画部の癒着を確認。腹部は内臓があるため呼気に合わせて浅く。",
c:"コブラポーズ（うつ伏せから上体を反らす）で伸張。フォームローラー胸椎伸展。過度な短縮は反り腰ではなく“丸まり腰”を作る。",
p:"腹直筋離開、骨盤後傾過多、腰椎屈曲位固定、呼吸時の肋骨下制不全。"},

{g:"core",n:"外腹斜筋",y:"がいふくしゃきん",e:"External Oblique",k:"エクスターナル・オブリーク",
o:"第5〜12肋骨の外側面（前鋸筋・広背筋と噛み合う）",
i:"腸骨稜前半、鼠径靭帯、腹直筋鞘を介して白線",
nv:"肋間神経 T7–T12、腸骨下腹神経 L1",
a:["体幹の屈曲","同側への側屈","反対側への回旋（右外腹斜筋→左回旋）"],
f:"線維は「ポケットに手を入れる方向」＝前下方に走る。同側の内腹斜筋と反対側の外腹斜筋がペアで回旋を作る。肋骨を引き下げる作用があるため、肋骨が開いた（フレアした）反り腰の修正キーとなる。",
t:["ケーブルウッドチョッパー（高→低）","サイドベンド、パロフプレス（抗回旋）","バイシクルクランチ、ロシアンツイスト"],
r:"側臥位または背臥位で、肋骨外側から腸骨稜へ向かう斜め線維に直交してストローク。肋骨下縁の付着部は特に反応しやすい。",
c:"側屈＋回旋を組み合わせたストレッチ（バンザイして斜め後方へ）。90/90ブリージングで肋骨を下げる練習。",
p:"肋骨フレア（開き）、反り腰、回旋の左右差、側腹部痛。"},

{g:"core",n:"内腹斜筋",y:"ないふくしゃきん",e:"Internal Oblique",k:"インターナル・オブリーク",
o:"鼠径靭帯外側1/2、腸骨稜中間線、胸腰筋膜",
i:"第10〜12肋骨下縁、腹直筋鞘を介して白線",
nv:"肋間神経 T7–T12、腸骨下腹・腸骨鼠径神経 L1",
a:["体幹の屈曲","同側への側屈","同側への回旋（右内腹斜筋→右回旋）"],
f:"外腹斜筋と直交して後上方（“ポケットから手を出す方向”）に走る。外腹斜筋との斜めのペアが体幹回旋のトルクを生む。下部線維は腹横筋と一体化しており、骨盤・腰椎の分節安定にも寄与する。",
t:["ケーブルウッドチョッパー（低→高）","サイドプランク＋回旋","メディシンボールの回旋スロー"],
r:"外腹斜筋の深層。腸骨稜の上縁内側から後上方に向かう線維を、外腹斜筋をずらしながら捉える。触診は難易度が高く、収縮させて確認するのが現実的。",
c:"オープンブックストレッチ、座位ツイスト。左右の回旋可動域差を必ず測る（差があれば片側短縮）。",
p:"回旋可動域の左右差、体幹回旋時の腰痛、スポーツヘルニアの関与。"},

{g:"core",n:"腹横筋",y:"ふくおうきん",e:"Transversus Abdominis",k:"トランスバース・アブドミニス",
o:"鼠径靭帯外側1/3、腸骨稜、胸腰筋膜、第7〜12肋軟骨内面",
i:"腹直筋鞘を介して白線、恥骨稜",
nv:"肋間神経 T7–T12、L1",
a:["腹腔内圧の上昇（天然のコルセット）","胸腰筋膜への張力付与による腰椎安定化","強制呼気、内臓の保持"],
f:"腹筋群の最深層で、線維は水平（ベルト状）に走る。四肢を動かす前に先行して収縮する（フィードフォワード）のが正常だが、腰痛経験者では遅延・消失する。腹圧の要であり、ここを飛ばして腹直筋だけ鍛えても腰痛は改善しない。「お腹を薄く引き込む（ドローイン）」で選択的に働く。",
t:["ドローイン（お腹を薄く引き込み呼吸を止めない）10秒×10","デッドバグ、ヒップリフト、プランク","※重量挙上ではブレーシング（腹圧全体を固める）に切り替える"],
r:"直接的な触診・圧迫は困難。周囲（腹斜筋・胸腰筋膜）を緩めたうえで、呼気時の収縮を触知しながら再教育するアプローチが実際的。",
c:"仰向け膝立てでドローイン＋通常呼吸を毎日。歩行中に軽く下腹を引き込む習慣づけ。",
p:"慢性腰痛、フィードフォワード消失、腹圧不全、下腹のぽっこり。"},

{g:"core",n:"骨盤底筋群",y:"こつばんていきんぐん",e:"Pelvic Floor Muscles",k:"ペルビック・フロア",
o:"恥骨後面、坐骨棘、肛門挙筋腱弓",
i:"尾骨、肛門尾骨靭帯、会陰腱中心",
nv:"陰部神経 S2–S4",
a:["骨盤内臓器の支持","尿道・肛門の閉鎖（禁制）","腹腔内圧の下部圧板として体幹安定に関与"],
f:"横隔膜・腹横筋・多裂筋とともに“コアシリンダー”の底面を構成する。横隔膜と同期して上下に動くのが正常で、呼吸と切り離せない。産後・加齢・慢性的な腹圧のかけすぎで機能低下すると、尿もれだけでなく腰痛・股関節痛の原因になる。逆に“過緊張”のケースも多く、締めるだけの指導は危険。",
t:["ケーゲル（締める5秒→完全に緩める5秒）※緩める側が重要","ヒップリフト、スクワットと呼吸の同期","90/90ブリージングで呼気時に自然な引き上げを感じる"],
r:"外部からの直接施術は専門領域（理学療法士の専門資格が必要）。トレーナー・整体の範囲では、股関節周囲（内転筋・梨状筋）と横隔膜の調整を通じて間接的に整える。",
c:"呼吸に合わせて吸気で緩め、呼気で軽く引き上げる。“常に締める”のは逆効果。",
p:"腹圧性尿失禁、骨盤臓器脱、慢性骨盤痛、過緊張による排尿障害、腰痛。"},

/* ---------- VI. 上肢 ---------- */
{g:"arm",n:"上腕二頭筋",y:"じょうわんにとうきん",e:"Biceps Brachii",k:"バイセプス・ブラキイ",
o:"長頭：肩甲骨関節上結節／短頭：肩甲骨烏口突起",

nv:"筋皮神経 C5–C6",
a:["肘関節の屈曲","前腕の回外（最強の回外筋）","肩関節の屈曲（長頭は外転・短頭は内転の補助）"],
f:"二関節筋で、実は「回外」が主役。ドライバーでネジを締める方向が本領。長頭腱は結節間溝を通って関節内に入るため、ここが炎症を起こすと肩前面痛になる（＝“肩の痛み”の原因が二頭筋であることは非常に多い）。ダンベルカールで手のひらを返しながら上げるのが解剖学的に正しい。",
t:["バーベルカール、インクラインダンベルカール（長頭を伸張位で）","ハンマーカール（上腕筋・腕橈骨筋主体）","チンアップ（アンダーグリップ懸垂）"],
r:"上腕前面の筋腹を上下にストローク。結節間溝（肩の前、上腕骨頭の外側）の長頭腱は圧痛点として重要。肘窩は正中神経・上腕動脈があるため強圧禁止。",
c:"壁に手をついて体を反対に回す（肩伸展＋肘伸展＋回内で最大伸張）30秒。デスクワークで肘屈曲位が続く人は必須。",
p:"上腕二頭筋長頭腱炎、肩前面痛、肘屈曲拘縮、SLAP損傷の関与。"},

{g:"arm",n:"上腕筋",y:"じょうわんきん",e:"Brachialis",k:"ブラキアリス",
o:"上腕骨前面の遠位1/2",
i:"尺骨粗面、鉤状突起",
nv:"筋皮神経 C5–C6（一部 橈骨神経）",
a:["肘関節の屈曲（純粋な屈曲の主働筋）"],
f:"回外・回内の影響を受けない“真の肘屈筋”で、断面積は上腕二頭筋より大きい。二頭筋の深層にあり、発達すると二頭筋を押し上げて腕を太く見せる。回内位でのカール（ハンマー・リバース）で優先的に動員される。",
t:["ハンマーカール、リバースカール","プリーチャーカール（回内グリップ）","ロープハンマーカール"],
r:"上腕二頭筋を内外にずらし、その下層の上腕骨に付着する筋を捉える。肘の外側寄り、二頭筋腱の外側縁からアプローチするとよい。",
c:"二頭筋と同じく肘伸展＋回内でのストレッチ。テニス肘の患者では上腕筋の緊張も併発していることが多い。",

{g:"arm",n:"烏口腕筋",y:"うこうわんきん",e:"Coracobrachialis",k:"コラコブラキアリス",
o:"肩甲骨の烏口突起（短頭・小胸筋と共同）",
i:"上腕骨内側面の中央部",
nv:"筋皮神経 C5–C7（筋を貫通する）",
a:["肩関節の屈曲","肩関節の内転","上腕骨頭の安定化の補助"],
f:"筋皮神経がこの筋を貫通するのが解剖学的特徴で、過緊張・肥厚により神経絞扼を起こしうる（前腕外側のしびれ）。腋窩前壁の深部にあり、見落とされやすいが上腕内側の慢性痛の原因になる。",

r:"背臥位・肩外転位で、腋窩前壁の内側寄り（大胸筋の深層、上腕骨内側に向かう索状物）を丁寧に把持。神経・血管束を避け、圧は上腕骨側へ。",
c:"バンザイ＋外転＋外旋のポジションで壁を使って伸ばす。ドアフレームストレッチでも伸張される。",
p:"上腕内側痛、筋皮神経絞扼（前腕外側のしびれ）、肩の伸展制限。"},

{g:"arm",n:"上腕三頭筋",y:"じょうわんさんとうきん",e:"Triceps Brachii",k:"トライセプス・ブラキイ",
o:"長頭：肩甲骨関節下結節／外側頭：上腕骨後面（橈骨神経溝より上）／内側頭：上腕骨後面（橈骨神経溝より下）",
i:"尺骨の肘頭",
nv:"橈骨神経 C6–C8",
a:["肘関節の伸展","長頭のみ：肩関節の伸展・内転","肘関節の後方安定化"],
f:"上腕の体積の約2/3を占め、“腕を太くする”なら二頭筋よりこちら。長頭のみ二関節筋で、肩を屈曲（バンザイ）させると伸張位になり最大限に動員できる。橈骨神経が外側頭と内側頭の間の溝を走るため、上腕骨骨幹部骨折で下垂手が起こる。",
t:["長頭：オーバーヘッドエクステンション、インクラインスカルクラッシャー","外側・内側頭：プレスダウン、ナローベンチ、ディップス","※種目間で肩の角度を変えて全頭を狙う"],
r:"腹臥位または側臥位で上腕後面を上下にストローク。長頭は腋窩後壁近くまで追う。肘頭付近の停止部と、橈骨神経溝周辺の過圧は避ける。",
c:"バンザイして肘を曲げ、反対の手で肘を後方へ引く（長頭ストレッチ）30秒。デスクワークの巻き肩改善にも有効。",
p:"肘後面痛、上腕三頭筋腱炎、オーバーヘッド動作時の詰まり感、テニス肘の関与。"},

{g:"arm",n:"腕橈骨筋",y:"わんとうこつきん",e:"Brachioradialis",k:"ブラキオラディアリス",
o:"上腕骨外側顆上稜の近位2/3",
i:"橈骨の茎状突起（手首の親指側）",
nv:"橈骨神経 C5–C6",
a:["肘関節の屈曲（中間位＝親指を上に向けた状態で最強）","回内位からの回外／回外位からの回内（中間位へ戻す）"],

i:"膝蓋骨内側縁、脛骨粗面（膝蓋腱を介して）",
nv:"大腿神経 L2–L4",
a:["膝関節の伸展","膝蓋骨を内側に引き、正しい軌道に保つ（VMO＝斜頭）"],
f:"膝蓋骨の内側下方に位置する“涙滴（ティアドロップ）”。特にVMO（内側広筋斜頭）は膝蓋骨の外方偏位を防ぐ唯一のブレーキ。膝を痛めると最も早く萎縮し、最も戻りにくい。膝蓋大腿疼痛症候群（PFPS）の中核であり、リハビリの最優先ターゲット。",
t:["膝伸展最終域（0〜30°）でのターミナルニーエクステンション","レッグエクステンション最終域での2秒静止","ステップダウン、スプリットスクワット、ボールを膝で挟んだレッグプレス"],
r:"背臥位で膝を軽度屈曲させ、膝蓋骨内側上縁から大腿内側へストローク。膝蓋骨を内外に他動的に動かして可動性（膝蓋骨モビライゼーション）を出すと即時に伸展が改善することが多い。",
c:"タオルを膝下に置いて押しつぶす等尺性収縮10秒×10（膝痛がある人でも安全）。膝蓋骨を手で内外上下に動かすセルフモビライゼーション。",
p:"膝蓋大腿疼痛症候群、膝蓋骨の外方偏位、膝伸展最終域の不全（extension lag）、膝崩れ。"},

{g:"thigh",n:"外側広筋",y:"がいそくこうきん",e:"Vastus Lateralis",k:"バスタス・ラテラリス",
o:"大腿骨の大転子外側、転子間線上部、粗線外側唇",
i:"膝蓋骨外側縁、脛骨粗面（膝蓋腱を介して）",
nv:"大腿神経 L2–L4",
a:["膝関節の伸展","膝蓋骨を外側に引く"],
f:"大腿四頭筋で最大の筋。腸脛靭帯の直下にあり、両者の滑走不全が大腿外側の張りを作る。内側広筋より強いため、内外バランスが崩れると膝蓋骨が外側に引かれてPFPSに。筋肉注射の推奨部位（安全性が高い）としても知られる。",
t:["スクワット、レッグプレス、ハックスクワット","ランジ、レッグエクステンション","※内側広筋とのバランスを意識し、外側優位にしすぎない"],
r:"側臥位で大腿外側の腸脛靭帯を後方にずらし、その深層の筋腹を前後に横断ストローク。腸脛靭帯そのものより、下層の外側広筋の滑走を出すことが目的。",
c:"側臥位でフォームローラーを大腿外側に当ててゆっくり60秒（強圧は不要）。うつ伏せで踵を尻に引き寄せ、やや内側へ。",
p:"膝蓋骨の外方偏位、PFPS、大腿外側の張り、腸脛靭帯との滑走不全。"},

{g:"thigh",n:"中間広筋",y:"ちゅうかんこうきん",e:"Vastus Intermedius",k:"バスタス・インターメディウス",
o:"大腿骨骨幹部の前面・外側面（近位2/3）",
i:"膝蓋骨上縁、脛骨粗面（膝蓋腱を介して）",
nv:"大腿神経 L2–L4",
a:["膝関節の伸展"],
f:"大腿直筋の直下に隠れる最深層の広筋。遠位に「膝関節筋」という小さな分束を持ち、膝伸展時に膝蓋上包を引き上げて挟み込みを防ぐ。触診できないため見落とされるが、膝屈曲拘縮や大腿前面の深部痛の原因になりうる。",
t:["スクワット、レッグプレス、レッグエクステンション（他の広筋と同時動員）","股関節伸展位での膝伸展種目で相対的に大腿直筋の関与を減らせる"],
r:"大腿直筋を内外にずらして深層へ垂直に圧を入れる。膝蓋骨上方の膝関節筋領域は、膝の屈曲制限がある症例で重点的に。",
c:"大腿四頭筋ストレッチ全般。膝蓋骨上方を軽くつまんで上下に動かすセルフモビライゼーション。",
p:"膝屈曲制限、大腿前面深部痛、膝蓋上包の癒着、術後の膝可動域制限。"},

{g:"thigh",n:"大腿二頭筋",y:"だいたいにとうきん",e:"Biceps Femoris",k:"バイセプス・フェモリス",
o:"長頭：坐骨結節／短頭：大腿骨粗線外側唇",
i:"腓骨頭（一部 脛骨外側顆）",
nv:"長頭：脛骨神経 L5–S2／短頭：総腓骨神経 L5–S2",
a:["膝関節の屈曲","股関節の伸展（長頭のみ）","膝屈曲位での下腿の外旋"],
f:"ハムストリングスの外側。長頭と短頭で神経支配が異なる（脛骨神経／総腓骨神経）唯一の筋で、この神経支配のズレが肉離れ好発の一因とされる。スプリントの遊脚後期（脚が前に振り出され減速する瞬間）に遠心性収縮で最大負荷がかかり、肉離れの90%近くがこの筋の近位腱移行部で起こる。",
t:["ルーマニアンデッドリフト、ノルディックハムカール（遠心性が最重要）","レッグカール、グッドモーニング、ヒップスラスト","※遠心性トレーニングが肉離れ再発予防のエビデンス最上位"],
r:"腹臥位で坐骨結節から腓骨頭へのラインを近位から遠位へストローク。坐骨結節付着部の圧痛はハムストリングス腱症を示唆。膝窩は総腓骨神経が腓骨頭を回るため強圧禁止。",
c:"仰向けでタオルを足にかけて脚を上げる（膝を軽く曲げて坐骨神経の緊張を避ける）60秒。ノルディックハムカールを週2回。",
p:"ハムストリングス肉離れ（再発率が非常に高い）、坐骨結節部腱症、膝屈曲拘縮、前屈制限。"},

{g:"thigh",n:"半腱様筋",y:"はんけんようきん",e:"Semitendinosus",k:"セミテンディノサス",
o:"坐骨結節（大腿二頭筋長頭と共同腱）",
i:"脛骨粗面の内側（鵞足）",
nv:"脛骨神経 L5–S2",
a:["膝関節の屈曲","股関節の伸展","膝屈曲位での下腿の内旋"],
f:"ハムストリングス内側の浅層。名前の通り筋腹の半分以上が長い腱で、ACL再建術の移植腱として最も使われる。鵞足を構成する3筋の1つ。骨盤を後傾させる作用があり、短縮すると腰椎の前弯が失われ、逆に腰痛の原因になる（“ハムが硬い＝腰痛”の機序）。",
t:["ルーマニアンデッドリフト、レッグカール","ヒップスラスト、片脚デッドリフト","ノルディックハムカール"],
r:"腹臥位で大腿後面内側の索状の腱・筋を近位から遠位へ。鵞足部（脛骨内側）は薄筋・縫工筋と重なるため、鵞足炎の鑑別を意識する。",
c:"ハムストリングスストレッチ＋つま先を内側に向ける（内側ハムを選択的に伸ばす）60秒。前屈で背中を丸めず骨盤から倒す。",
p:"ハムストリングス肉離れ、鵞足炎、骨盤後傾、前屈制限、腰痛。"},

{g:"thigh",n:"半膜様筋",y:"はんまくようきん",e:"Semimembranosus",k:"セミメンブラノサス",
o:"坐骨結節（半腱様筋より深層・外側）",
i:"脛骨内側顆の後面、斜膝窩靭帯",
nv:"脛骨神経 L5–S2",
a:["膝関節の屈曲","股関節の伸展","膝屈曲位での下腿の内旋"],
f:"半腱様筋の深層にある扁平な筋。停止が膝関節後内側の関節包に及び、内側半月板の後角を後方に引いて挟み込みを防ぐ。膝後内側の安定に直接関与するため、膝の深部後方痛や膝窩の張りの原因になりやすい。ベーカー嚢腫の好発部位でもある。",
t:["半腱様筋と同種目（RDL、レッグカール、ヒップスラスト）","膝屈曲＋内旋を意識したレッグカールでより選択的に"],
r:"腹臥位で半腱様筋腱を内側にずらし、その深層・外側の厚い筋腹を捉える。膝窩の内側上方の付着部は圧痛が強い。膝窩中央は神経血管束のため圧迫しない。",
c:"つま先内向きのハムストリングスストレッチ。膝を完全に伸ばした状態での前屈を段階的に。",
p:"膝後内側痛、膝窩の張り、ベーカー嚢腫、半月板後角の症状、肉離れ。"},

{g:"thigh",n:"縫工筋",y:"ほうこうきん",e:"Sartorius",k:"サルトリウス",
o:"上前腸骨棘（ASIS）",
i:"脛骨粗面の内側（鵞足の最前部）",
nv:"大腿神経 L2–L3",
a:["股関節の屈曲・外転・外旋","膝関節の屈曲","膝屈曲位での下腿の内旋"],
f:"人体で最も長い筋（約50cm）。あぐらをかく動作＝全作用の複合で、「仕立て屋（sartor）の筋」の名の由来。大腿前面を内下方へ斜めに横切り、内転筋管の屋根を形成する。鵞足3筋の最前部で、ASIS付着部は成長期の裂離骨折の好発部位。",
t:["専用種目はほぼ不要。ランジ、コサックスクワットで動員","股関節の外転外旋＋膝屈曲を組み合わせた動きで活性化"],
r:"ASISから大腿内側へ斜めに走る細い索状の筋を、走行に沿って追跡ストローク。大腿神経・大腿動脈が近接する三角部（スカルパ三角）では圧を控える。",
c:"股関節を伸展・内転・内旋させ膝を屈曲するストレッチ（大腿四頭筋ストレッチで脚を後ろ内側へ）。あぐらの逆方向を意識。",
p:"鵞足炎、ASIS裂離骨折（成長期）、大腿前内側の張り、膝内側痛。"},

/* ---------- IX. 下腿・足部 ---------- */
{g:"leg",n:"腓腹筋",y:"ひふくきん",e:"Gastrocnemius",k:"ガストロクネミウス",
o:"内側頭：大腿骨内側顆の後面／外側頭：大腿骨外側顆の後面",
i:"アキレス腱を介して踵骨隆起",
nv:"脛骨神経 S1–S2",
a:["足関節の底屈（膝伸展位で最強）","膝関節の屈曲","歩行・跳躍の推進"],
f:"二関節筋のため、膝を伸ばすと伸張され底屈力が最大になり、膝を曲げると弛緩する（＝膝屈曲位の底屈はヒラメ筋が主役）。速筋線維の比率が高く瞬発力担当。“こむら返り”の代表筋で、テニスレッグ（内側頭の肉離れ）は中年以降に多い。",
t:["スタンディングカーフレイズ（膝伸展位）","ジャンプ系、ダッシュ","※可動域全域＋トップで1秒静止"],
r:"腹臥位で膝を軽度屈曲させ弛緩位にして、内側頭・外側頭の筋腹を近位から遠位へストローク。膝窩は神経血管束のため、その下縁から開始する。",
c:"壁ドンストレッチ（膝を伸ばしたまま踵を床につける）30秒×左右。段差でのカーフストレッチ。就寝前の水分・電解質補給でこむら返り予防。",
p:"こむら返り、テニスレッグ（内側頭肉離れ）、アキレス腱炎、足関節背屈制限。"},

{g:"leg",n:"ヒラメ筋",y:"ひらめきん",e:"Soleus",k:"ソレウス",
o:"腓骨頭・腓骨後面上部、脛骨のヒラメ筋線",
i:"アキレス腱を介して踵骨隆起",
nv:"脛骨神経 S1–S2",
a:["足関節の底屈（膝屈曲位で主役）","立位時の姿勢保持（前方への転倒を防ぐ）","下肢の静脈還流を助ける"],
f:"「第2の心臓（ミルキングアクション）」。遅筋線維が約80%を占め、立位を維持し続ける持久筋。単関節筋なので膝の角度に影響されず、シーテッドカーフレイズで選択的に鍛えられる。背屈制限の真の原因は腓腹筋よりヒラメ筋であることが多く、スクワットで踵が浮く人の主犯。",
t:["シーテッドカーフレイズ（膝屈曲90°）","ヒラメ筋プッシュアップ（座位でのつま先上下運動）","高回数（20〜30回）×複数セットが適する"],
r:"腹臥位・膝屈曲位で、腓腹筋の外側縁・内側縁から深層へ指を入れてヒラメ筋を捉える。アキレス腱移行部の癒着を横断ストロークで剥がす。",
c:"膝を曲げたままのカーフストレッチ（壁に手をつき膝を曲げて踵を下げる）30秒。デスクワーク中のかかと上下運動20回×毎時。",
p:"足関節背屈制限（スクワットで踵が浮く）、アキレス腱症、下腿のむくみ、シンスプリントの関与。"},

{g:"leg",n:"後脛骨筋",y:"こうけいこつきん",e:"Tibialis Posterior",k:"チビアリス・ポステリア",
o:"下腿骨間膜の後面、脛骨後面、腓骨後面",
i:"舟状骨粗面を主とし、全楔状骨・立方骨・第2〜4中足骨底",
nv:"脛骨神経 L4–L5",
a:["足関節の底屈","足部の内反","内側縦アーチの動的保持（最重要）"],
f:"「土踏まずを吊り上げる筋」。下腿最深層にあり、内果の後ろを回って足底に広く停止する。機能不全（PTTD）＝成人期扁平足の最大原因で、進行すると足部が外反・回内位に崩れ、knee-inや腰痛まで波及する。片脚踵上げができるかが臨床上の重要テスト。",
t:["カーフレイズを“母趾側に体重をかけて”行う","タオルギャザー、ショートフットエクササイズ（アーチを高くする）","チューブでの内反運動、片脚バランス"],
r:"腹臥位で下腿後面内側、腓腹筋・ヒラメ筋の内側縁から深層へ。内果後方（後脛骨筋腱の走行部）の圧痛と腫脹を確認。足根管（脛骨神経）が近いためしびれに注意。",
c:"ショートフット（足趾を曲げずに土踏まずだけ高くする）10秒×10。青竹踏み、ゴルフボールで足底を転がす。適切な土踏まずサポートのある靴を選ぶ。",
p:"後脛骨筋腱機能不全（扁平足）、シンスプリント（内側）、内側縦アーチの低下、足根管症候群の関与。"},

{g:"leg",n:"前脛骨筋",y:"ぜんけいこつきん",e:"Tibialis Anterior",k:"チビアリス・アンテリア",
o:"脛骨外側面の上部2/3、骨間膜",
i:"内側楔状骨、第1中足骨底の内側面",
nv:"深腓骨神経 L4–L5",
a:["足関節の背屈（主働筋）","足部の内反","歩行の遊脚期につま先を持ち上げ、接地時に足を静かに下ろす"],
f:"つまずき・転倒予防の最重要筋。加齢や深腓骨神経麻痺で下垂足（drop foot）になる。走りすぎ・硬い路面でシンスプリント（前方型）や前脛骨コンパートメント症候群を起こす。ヒール靴を履き続けると相対的に弱化し、ふくらはぎとのバランスが崩れる。",
t:["トゥレイズ（かかと立ちでつま先上げ）20回×3","チューブでの背屈、ヒールウォーク","※腓腹筋・ヒラメ筋と1:1のバランスを意識する"],
r:"背臥位で脛骨稜のすぐ外側の筋腹を、近位から遠位へ母指でストローク。前脛骨筋腱（足関節前面の最も内側の腱）の滑走も確認する。深腓骨神経の走行に注意。",
c:"正座または足首を底屈させて前脛骨部を伸ばす30秒。かかと立ちで20歩歩く。デスクでのつま先上げ運動。",
p:"シンスプリント（前方）、下垂足、前方コンパートメント症候群、つまずき・転倒リスク。"},

{g:"leg",n:"腓骨筋群",y:"ひこつきんぐん",e:"Peroneus Longus / Brevis",k:"ペロネウス",

i:"長腓骨筋：足底を横断し内側楔状骨・第1中足骨底／短腓骨筋：第5中足骨粗面",
nv:"浅腓骨神経 L5–S1",
a:["足部の外反（主働筋）","足関節の底屈","長腓骨筋：横アーチの保持と第1中足骨頭の接地"],

t:["チューブでの外反運動20回×3","バランスディスク・片脚立ち（反応速度の再教育）","サイドステップ、ラテラルホップ"],
r:"側臥位で腓骨に沿って外側面を近位から遠位へストローク。腓骨頭直下は総腓骨神経が回り込むため強圧禁止（下垂足のリスク）。外果後方の腱溝の癒着を確認。",
c:"チューブ外反を毎日。捻挫の既往がある人は片脚立ち（目を閉じて30秒）を習慣化。",
p:"内反捻挫の再発、慢性足関節不安定症、外果後方の腱鞘炎、腓骨筋腱脱臼。"},

{g:"leg",n:"長趾屈筋・長母趾屈筋",y:"ちょうしくっきん・ちょうぼしくっきん",e:"Flexor Digitorum / Hallucis Longus",k:"フレクサー・デジトラム",
o:"長趾屈筋：脛骨後面の中央部／長母趾屈筋：腓骨後面の下部2/3",

/* ============ STORAGE ============ */
const _mem={};
let STORE="memory";                     // app | local | session | memory
function probeStore(){
 if(window.storage) return "app";
 const t="__anatomia_probe";
 try{ localStorage.setItem(t,"1");
      const ok=localStorage.getItem(t)==="1"; localStorage.removeItem(t);
      if(ok) return "local"; }catch(e){}
 try{ sessionStorage.setItem(t,"1");
      const ok=sessionStorage.getItem(t)==="1"; sessionStorage.removeItem(t);
      if(ok) return "session"; }catch(e){}
 return "memory";
}
const Store={
 async get(k){
  try{
   if(STORE==="app"){const r=await window.storage.get(k,false); return r?r.value:null}
   if(STORE==="local")   return localStorage.getItem(k);
   if(STORE==="session") return sessionStorage.getItem(k);
  }catch(e){}
  return (k in _mem)?_mem[k]:null;
 },
 async set(k,v){
  _mem[k]=v;
  try{
   if(STORE==="app"){await window.storage.set(k,v,false); return}
   if(STORE==="local"){localStorage.setItem(k,v); return}
   if(STORE==="session"){sessionStorage.setItem(k,v); return}
  }catch(e){}
 }
};
const STORE_LABEL={app:"このアプリ内に保存されます",local:"この端末のブラウザに保存されます",
 session:"タブを閉じるまでの一時保存です",memory:"保存できません。このプレビューでは閉じると記録が消えます"};

/* ---- backup code: compact, index-based so it can be copied by hand ---- */
function packST(){
 const rows=[], ALL=[...M.map(m=>m.n),...BONES.map(b=>b.n),...TENDONS.map(t=>t.n)];
 ALL.forEach((n,i)=>{const d=ST.m[n]; if(d&&(d.s||d.c||d.w)) rows.push([i,d.s|0,d.c|0,d.w|0,d.b|0,d.d||0].join("."))});
 return "ANA2-"+(ST.xp|0)+"-"+rows.join("_");
}
function unpackST(code){
 const p=String(code).trim().split("-");
 if(p[0]!=="ANA1"&&p[0]!=="ANA2") throw new Error("形式が違います");
 const v2=p[0]==="ANA2";
 const ALL=v2?[...M.map(m=>m.n),...BONES.map(b=>b.n),...TENDONS.map(t=>t.n)]:M.map(m=>m.n);
 const st={xp:parseInt(p[1],10)||0,m:{}};
 (p.slice(2).join("-")||"").split("_").filter(Boolean).forEach(r=>{
  const a=r.split(".").map(Number);
  if(ALL[a[0]]){const o={s:a[1]|0,c:a[2]|0,w:a[3]|0};
   if(v2&&a[4]){o.b=a[4];o.d=a[5]||0}
   st.m[ALL[a[0]]]=o;}
 });
 return st;
}

const DAY=864e5, BOX=[1,3,7,16,35];        // 正解するたび復習間隔が伸びる（日）
const nowD=()=>Math.floor(Date.now()/DAY);
function schedule(d,ok){
 d.b = ok ? Math.min((d.b||0)+1, BOX.length) : 1;
 d.d = nowD() + BOX[d.b-1];
}
function mScore(name){
 const d=ST.m[name];if(!d)return 0;
 let v=Math.min(1,(d.s?0.3:0)+Math.min(d.c||0,3)/3*0.7);
 if(d.d){const over=nowD()-d.d;                  // 期限を過ぎたぶんだけ定着度が下がる
  if(over>0) v*=Math.max(0.5, 1-over/70);}
 return v;
}
function dueNames(){
 const t=nowD();
 return Object.keys(ST.m).filter(n=>{const d=ST.m[n]; return d&&d.d!==undefined&&d.d<=t});
}
function boxCounts(){
 const c=[0,0,0,0,0];
 Object.values(ST.m).forEach(d=>{if(d.b)c[Math.min(d.b,5)-1]++});
 return c;
}
function mState(name){const v=mScore(name);return v>=0.85?"mast":(v>0?"seen":"")}
function regionScore(g){const a=inRegion(g);return a.reduce((s,m)=>s+mScore(m.n),0)/a.length}
function totalScore(){return M.reduce((s,m)=>s+mScore(m.n),0)/M.length}

function arrowSVG(d,mode){
 const O=_ctr(d.o), I=_ctr(d.i);
 let dx=O[0]-I[0], dy=O[1]-I[1]; const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
 let ox=-dy, oy=dx;                                  // perpendicular offset...
 if((I[0]-100)*ox<0){ox=-ox;oy=-oy}                  // ...pushed away from the midline
 const s=mode==="sh"?1:-1, ux=dx*s, uy=dy*s;
 const cx=v=>Math.max(12,Math.min(188,v)), cy=v=>Math.max(12,Math.min(268,v));
 const ax=cx(I[0]+ox*18), ay=cy(I[1]+oy*18);
 const bx=cx(ax+ux*38),   by=cy(ay+uy*38);
 const h=13, w=7.2, vx=-uy, vy=ux;
 const head=`${bx},${by} ${bx-ux*h+vx*w},${by-uy*h+vy*w} ${bx-ux*h-vx*w},${by-uy*h-vy*w}`;
 const sl=MOTION?`<animateTransform attributeName="transform" type="translate" additive="sum"
   values="0,0;${(ux*11).toFixed(1)},${(uy*11).toFixed(1)};0,0" dur="3.2s" repeatCount="indefinite"
   calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.25 1;0.45 0 0.25 1"/>`:"";
 return `<g>${sl}<line class="arw" x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${(bx-ux*h*.7).toFixed(1)}" y2="${(by-uy*h*.7).toFixed(1)}"/>
   <polygon class="arwh" points="${head}"/></g>`;
}
function dia(name,mode){
 const d=DIA[name]; if(!d||!STG[d.s])return "";
 const r=mode==="mini"?3.4:mode?2.6:3;
 const alt=mode==="ln"?{b:d.b3,f:d.f3,i:d.i3}:{b:d.b2,f:d.f2,i:d.i2};
 const live=MOTION&&alt.b;
 const AN=(v1,v2)=>live?`<animate attributeName="d" values="${v1};${v2};${v1}" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.25 1;0.45 0 0.25 1"/>`:"";
 const ANP=(a,b,k)=>live?`<animate attributeName="c${k}" values="${a};${b};${a}" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.25 1;0.45 0 0.25 1"/>`:"";
 const mk=(a,cls)=>a.map((p,n)=>{
   const t=(cls==="mi"&&live&&alt.i)?ANP(p[0],alt.i[n][0],"x")+ANP(p[1],alt.i[n][1],"y"):"";
   return t?`<circle cx="${p[0]}" cy="${p[1]}" r="${r}" class="${cls}">${t}</circle>`
           :`<circle cx="${p[0]}" cy="${p[1]}" r="${r}" class="${cls}"/>`}).join("");
 const bc=(mode==="sh"||mode==="ln")?" "+mode:"";
 const arw=(mode==="sh"||mode==="ln")?arrowSVG(d,mode):"";
 const lbl=mode==="sh"?name+"の収縮方向":mode==="ln"?name+"の伸張方向":name+"の起始停止 模式図";
 return `<svg viewBox="0 0 200 280" role="img" aria-label="${lbl}">
  ${STG[d.s]}<path d="${d.b}" class="belly${bc}">${live?AN(d.b,alt.b):""}</path>
  ${(d.f||[]).map((f,n)=>`<path d="${f}" class="fib">${live?AN(f,alt.f[n]):""}</path>`).join("")}
  ${mk(d.o,"mo")}${mk(d.i,"mi")}${arw}</svg>`;
}

/* ============ QUIZ ENGINE ============ */
const CUT=(s,n)=>{n=n||46; s=String(s); if(s.length<=n)return s;
 const c=s.slice(0,n);
 const i=Math.max(c.lastIndexOf("、"),c.lastIndexOf("／"),c.lastIndexOf("・"),c.lastIndexOf("）"));
 return (i>n*0.45? c.slice(0,i+1) : c)+"…";};
const FIRST=s=>{const a=String(s).split("。").filter(Boolean); return (a[0]||s)+"。";};

/* --- distractors: anatomically confusable, and matched for length --- */
const AKW=t=>(String(t).match(/屈曲|伸展|外転|内転|外旋|内旋|回旋|側屈|背屈|底屈|掌屈|内反|外反|挙上|下制|安定|前傾|後傾|回内|回外/g)||[]);
function simScore(a,b){
 let s=0;
 if(a.g===b.g) s+=4;
 const nv=t=>(String(t).match(/[^\s、（(]*神経/g)||[]);
 if(nv(a.nv).some(x=>nv(b.nv).includes(x))) s+=3;
 const ka=AKW(a.a.join("")), kb=AKW(b.a.join(""));
 s+=ka.filter(x=>kb.includes(x)).length;
 return s;
}
const _kj=s=>new Set((String(s).match(/[\u4E00-\u9FFF]/g)||[]));
function ovK(a,b){const A=_kj(a);let n=0;_kj(b).forEach(c=>{if(A.has(c))n++});return n}
/* 選択肢どうしを似せる度合い。初級は似せず消去法を効かせ、上級は極限まで似せる */
const HOMO_LV={1:0,2:3,3:7};
function cands(m,valOf,ban,lv){
 const _v=lv||LVL, W=(LV[_v]||LV[2]).sim, HOMO=HOMO_LV[_v]!==undefined?HOMO_LV[_v]:3;
 const L=valOf?valOf(m).length:0, OT=valOf?ovK(m.n,valOf(m)):0;
 return M.filter(x=>x.n!==m.n&&(!ban||!ban(x)))
  .map(x=>({x,s:simScore(m,x)*W-(valOf?Math.abs(valOf(x).length-L)/6:0)
    -(valOf?Math.abs(ovK(m.n,valOf(x))-OT)*3:0)
    +(valOf?ovK(valOf(m),valOf(x))*HOMO:0)+Math.random()*1.2}))
  .sort((a,b)=>b.s-a.s).slice(0,12).map(o=>o.x);
}
function fourOpts(ans,list,valOf){
 if(!list||!list.length) list=[];
 // list arrives ranked by anatomical similarity; keep that order dominant and
 // use length only to break near-ties, so a knee question never offers an arm muscle
 const seen=new Set([ans]), cand=[];
 list.forEach((x,r)=>{const v=valOf(x); if(!seen.has(v)){seen.add(v);
   cand.push({v,k:r+Math.abs(v.length-ans.length)*0.35+Math.random()*0.8})}});
 cand.sort((a,b)=>a.k-b.k);
 const out=[ans,...cand.slice(0,3).map(o=>o.v)];
 while(out.length<4){const f=pick(M,1)[0], v=valOf(f); if(!out.includes(v))out.push(v)}
 return shuffle(out);
}

const KINDS=["origin","insert","nerve","action","reverse","trouble","care"];
/* 難易度は「問題数」ではなく ①出題形式 ②誤答の紛らわしさ ③出題範囲 ④合格ライン で決める */
const BASIC=["胸鎖乳突筋","三角筋","棘下筋","大円筋","僧帽筋","菱形筋","前鋸筋","大胸筋","広背筋",
 "脊柱起立筋","腹直筋","外腹斜筋","上腕二頭筋","上腕三頭筋","腕橈骨筋","前腕屈筋群","前腕伸筋群",
 "大殿筋","中殿筋","腸腰筋","大腿筋膜張筋","内転筋群","大腿直筋","内側広筋","外側広筋",
 "大腿二頭筋","半腱様筋","縫工筋","腓腹筋","ヒラメ筋","前脛骨筋","腓骨筋群","横隔膜","腹横筋"];
const LV={
 1:{n:"初級",d:"名前を言われて答える",kinds:["origin","insert","nerve"],
    pool:()=>M.filter(m=>BASIC.includes(m.n)), sim:-6, lm:0, tq:0, pass:70, s:10, l:30},
 2:{n:"中級",d:"所見から筋を同定する",kinds:["origin","insert","nerve","action","reverse"],
    pool:()=>M, sim:6, lm:.2, tq:0, pass:80, s:10, l:40},
 3:{n:"上級",d:"臨床像から絞り込む",kinds:KINDS,
    pool:()=>M, sim:9, lm:.2, tq:.15, pass:85, s:10, l:50}
};
let LVL=1, QZ_LV=1;
const LMS=[]; BONES.forEach(b=>b.lm.forEach(l=>LMS.push({b:b.n,n:l.n,m:l.m,a:l.a})));
const LMA=LMS.filter(l=>!/^—/.test(l.a));   // 付着物のないランドマークは「付くのは？」で使わない
function makeLMQ(){
 const wantBone=Math.random()<0.5;
 let pool=LMS;
 if(wantBone) pool=LMS.filter(l=>!l.b.split(/[（）・]/).some(w=>w.length>1&&l.n.includes(w)));
 const L=pick(pool.length?pool:LMS,1)[0];
 if(wantBone&&pool.length){
  const opts=fourOpts(L.b, shuffle(BONES.filter(b=>b.n!==L.b)), b=>b.n);
  return {m:L.b,kd:"骨のランドマーク",q:"「"+L.n+"」はどの骨のランドマーク？",sub:"",ans:L.b,opts};
 }
 const A=/^—/.test(L.a)?pick(LMA,1)[0]:L;
 const others=shuffle(LMA.filter(x=>x.a!==A.a&&x.n!==A.n));
 const opts=fourOpts(A.a, others, x=>x.a);
 return {m:A.b,kd:"付着部",q:"「"+A.n+"」に付くのは？",sub:A.m,ans:A.a,opts};
}

function makeTQ(){
 const t=pick(TENDONS,1)[0];
 const useFn=Math.random()<0.5;
 const V=x=>CUT(useFn?x.fn:x.cl,44);
 const others=shuffle(TENDONS.filter(x=>x.n!==t.n&&x.st===t.st))
   .concat(shuffle(TENDONS.filter(x=>x.n!==t.n&&x.st!==t.st)));
 const opts=fourOpts(t.n, others, x=>x.n);
 return {m:t.n, kd:useFn?"腱・靭帯の役割":"腱・靭帯の障害",
   q:useFn?"次の役割をもつ構造は？":"次の障害が起こる構造は？", sub:V(t), ans:t.n, opts};
}
function makeQ(m,pool,forced,lv){
 lv=lv||LVL;
 const k=forced||KINDS[Math.floor(Math.random()*KINDS.length)];
 let q,sub="",ans,opts,kd;
 if(k==="origin"||k==="insert"||k==="nerve"){
  const f=k==="origin"?"o":k==="insert"?"i":"nv";
  kd=k==="origin"?"起始":k==="insert"?"停止":"支配神経";
  q=m.n+"の"+kd+"は？";
  const V=x=>CUT(x[f]); ans=V(m);
  opts=fourOpts(ans,cands(m,V,null,lv),V);
  if(new Set(opts).size<4) opts=fourOpts(m[f],cands(m,x=>x[f],null,lv),x=>x[f]), ans=m[f];
 }
 else if(k==="action"){kd="作用";
  const shown=pick(m.a,Math.min(2,m.a.length));
  sub="・"+shown.join("\n・"); ans=m.n; q="この作用をもつ筋は？";
  const ban=x=>x.a.some(a=>shown.some(s=>s.includes(a)||a.includes(s)));
  opts=fourOpts(m.n,cands(m,x=>x.n,ban,lv),x=>x.n);
 }
 else if(k==="reverse"){kd="起始停止から同定";q="この起始・停止をもつ筋は？";
  sub="起始："+CUT(m.o,40)+"\n停止："+CUT(m.i,40); ans=m.n;
  opts=fourOpts(m.n,cands(m,x=>x.n,null,lv),x=>x.n);
 }
 else if(k==="trouble"){kd="臨床";q="次の所見に最も関与する筋は？";sub=m.p;ans=m.n;
  const tok=m.p.split(/[、。・（）]/).filter(t=>t.length>=3);
  const ban=x=>tok.some(t=>x.p.includes(t));
  opts=fourOpts(m.n,cands(m,x=>x.n,ban,lv),x=>x.n);
 }
 else {kd="セルフケア";q=m.n+"のセルフケアとして適切なのは？";
  const V=x=>FIRST(x.c); ans=V(m);
  opts=fourOpts(ans,cands(m,x=>FIRST(x.c),null,lv),V);
 }
 return {m:m.n,kd,q,sub,ans,opts};
}

function buildQuiz(list,count,title,lv){
 if(lv)LVL=lv;
 const K=(LV[LVL]||LV[2]).kinds;
 const pool=list, small=pool.length<=3;
 let seq=[]; while(seq.length<count) seq=seq.concat(shuffle(pool));
 seq=seq.slice(0,count);
 for(let i=1;i<seq.length;i++){                       // never ask the same part twice in a row
  if(seq[i].n===seq[i-1].n){
   for(let j=i+1;j<seq.length;j++){
    if(seq[j].n!==seq[i-1].n&&(j+1>=seq.length||seq[j+1].n!==seq[i].n)){[seq[i],seq[j]]=[seq[j],seq[i]];break}
   }
  }
 }
 const used={}, NAMED=["action","reverse","trouble"];   // these have the muscle name as the answer
 const qs=seq.map(m=>{                                  // never the same way twice, and never
  const u=used[m.n]=used[m.n]||[];                      // the same name as the answer twice
  const namedTaken=u.some(k=>NAMED.includes(k));
  let ks=shuffle(K).filter(k=>!u.includes(k)&&!(namedTaken&&NAMED.includes(k)));
  if(!ks.length) ks=shuffle(K).filter(k=>!u.includes(k));
  if(!ks.length){u.length=0; ks=shuffle(K)}
  u.push(ks[0]);
  return makeQ(m,pool,ks[0],LVL);
 });
 // 同一の問題文＋提示が重ならないよう最終確認する
 const seenQ=new Set();
 for(let i=0;i<qs.length;i++){
  let key=qs[i].q+"|"+(qs[i].sub||""), t=0;
  while(seenQ.has(key)&&t<12){
   const alt=shuffle(K).find(k=>k!==qs[i].kind);
   qs[i]=makeQ(seq[i],pool,alt||shuffle(K)[0],LVL);
   key=qs[i].q+"|"+(qs[i].sub||""); t++;
  }
  seenQ.add(key);
 }
 const cfg=LV[LVL]||LV[2];
 if(!small&&count>=10&&cfg.lm){                       // 骨のランドマーク
  const n=Math.max(2,Math.round(count*cfg.lm)), slots=shuffle([...qs.keys()]).slice(0,n), seen=new Set();
  slots.forEach(i=>{let q,t=0; do{q=makeLMQ();t++}while(seen.has(q.q)&&t<10);
   seen.add(q.q); if(q.opts.length===4&&!seenQ.has(q.q+"|"+(q.sub||""))){qs[i]=q;seenQ.add(q.q+"|"+(q.sub||""))}});
 }
 if(!small&&count>=10&&cfg.tq){                       // 腱・靭帯（上級のみ）
  const n=Math.max(2,Math.round(count*cfg.tq)), used=qs.map((q,i)=>i).filter(i=>qs[i].kd!=="骨のランドマーク"&&qs[i].kd!=="付着部");
  const slots=shuffle(used).slice(0,n), seen=new Set();
  slots.forEach(i=>{let q,t=0; do{q=makeTQ();t++}while(seen.has(q.sub)&&t<10);
   seen.add(q.sub); if(q.opts.length===4&&!seenQ.has(q.q+"|"+(q.sub||""))){qs[i]=q;seenQ.add(q.q+"|"+(q.sub||""))}});
 }
 QZ_LV=LVL;
 QZ={title,qs,i:0,ok:0,combo:0,best:0,log:[],locked:false};
 go({name:"quiz"});
}

function buildReview(){
 const due=dueNames();
 const mus=due.map(byName).filter(Boolean);
 const bns=due.filter(n=>byBone(n)), tds=due.filter(n=>byTend(n));
 const n=Math.min(20, due.length);
 if(!n){QZ=null; return false}
 LVL=2;
 const qs=[];
 shuffle(mus).slice(0,n).forEach(m=>qs.push(makeQ(m,M,null,2)));
 shuffle(bns).slice(0,Math.max(0,n-qs.length)).forEach(()=>{const q=makeLMQ(); if(q.opts.length===4)qs.push(q)});
 shuffle(tds).slice(0,Math.max(0,n-qs.length)).forEach(()=>{const q=makeTQ(); if(q.opts.length===4)qs.push(q)});
 if(!qs.length) return false;
 const seen=new Set(); const uniq=[];
 shuffle(qs).forEach(q=>{const k=q.q+"|"+(q.sub||""); if(!seen.has(k)){seen.add(k);uniq.push(q)}});
 QZ={title:"今日の復習",qs:uniq.slice(0,n),i:0,ok:0,combo:0,best:0,log:[],locked:false};
 go({name:"quiz"});
 return true;
}

/* ============ PINCH ZOOM ============ */
function enableZoom(box){
 if(box.dataset.zoom) return; box.dataset.zoom="1";
 const g=box.querySelector("svg"); if(!g) return;
 let sc=1,tx=0,ty=0,d0=0,s0=1,lx=0,ly=0,mode=0,moved=0,tap=0;
 const apply=()=>{g.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
   box.classList.toggle("zoomed",sc>1.02)};
 const reset=()=>{sc=1;tx=0;ty=0;apply()};
 const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
 const clamp=()=>{const lx2=box.clientWidth*(sc-1)/2, ly2=box.clientHeight*(sc-1)/2;
   tx=Math.max(-lx2,Math.min(lx2,tx)); ty=Math.max(-ly2,Math.min(ly2,ty))};
 box.addEventListener("touchstart",e=>{
  moved=0;
  if(e.touches.length===2){mode=2;d0=dist(e.touches);s0=sc;e.preventDefault()}
  else if(e.touches.length===1&&sc>1.02){mode=1;lx=e.touches[0].clientX;ly=e.touches[0].clientY}
  else mode=0;
 },{passive:false});
 box.addEventListener("touchmove",e=>{
  if(mode===2&&e.touches.length===2){e.preventDefault();moved=1;
   sc=Math.max(1,Math.min(6,s0*dist(e.touches)/d0));
   if(sc<=1.02){tx=0;ty=0} else clamp(); apply();}
  else if(mode===1&&e.touches.length===1){e.preventDefault();
   const t=e.touches[0]; tx+=t.clientX-lx; ty+=t.clientY-ly; lx=t.clientX; ly=t.clientY;
   moved=1; clamp(); apply();}
 },{passive:false});
 box.addEventListener("touchend",e=>{
  if(e.touches.length===0){
   mode=0;
   if(!moved){const n=Date.now(); if(n-tap<320){reset();moved=1} tap=n}
  }
 });
 box.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=0}},true);
}
function wireZoom(){document.querySelectorAll(".wbody,.dia,.diasub,.pose").forEach(enableZoom)}

document.addEventListener("click",e=>{
 const o=e.target.closest(".opt");if(o&&!o.disabled){answer(+o.dataset.o);return}
 const reg=e.target.closest(".reg,.rcard");if(reg&&reg.dataset.r&&!reg.dataset.act){go({name:"region",id:reg.dataset.r});return}
 const cat=e.target.closest("[data-cat]");
 if(cat){CAT=cat.dataset.cat;render();return}
 const wl=e.target.closest("[data-w]");
 if(wl){const v=wl.dataset.v||"front", k=wl.dataset.w;
  WMODE[v]=k;
  const col=wl.closest(".wcol");
  if(col){ col.querySelector(".wbody").dataset.mode=k;
    col.querySelectorAll(".seg2 button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.w===k)); }
  return}
 const bn=e.target.closest("[data-b]");
 if(bn&&bn.dataset.b){go({name:"bone",name2:bn.dataset.b});return}
 const td=e.target.closest("[data-t]");
 if(td&&td.dataset.t){
  if(byTend(td.dataset.t)) go({name:"tendon",name2:td.dataset.t});
  else if(byName(td.dataset.t)) go({name:"muscle",name2:td.dataset.t});
  return}
 const mr=e.target.closest("[data-m]");
 const lay=e.target.closest("[data-lay]");
 if(lay){const w=$("#dia"),k=lay.dataset.lay;
  const cur=new Set((w.dataset.hide||"").split(" ").filter(Boolean));
  cur.has(k)?cur.delete(k):cur.add(k);
  w.dataset.hide=[...cur].join(" ");lay.classList.toggle("off",cur.has(k));return}
 const b=e.target.closest("[data-act]");
 if(b){
  const a=b.dataset.act;
  if(a==="rev"){if(!buildReview()) return}
  else if(a==="lv"){const v=+b.dataset.v, k=b.dataset.k, L=LV[v];
   buildQuiz(L.pool(), k==="s"?L.s:L.l, L.n+"｜"+(k==="s"?"小テスト":"大テスト"), v);
   QZ.key=k+v; QZ.pass=L.pass;}
  else if(a==="rand")buildQuiz(M,10,"ランダムドリル");
  else if(a==="weak"){const w=M.filter(m=>ST.m[m.n]&&ST.m[m.n].w>0&&mScore(m.n)<0.85);buildQuiz(w,Math.min(15,w.length*2),"苦手復習")}
  else if(a==="rq"){const r=regionOf(b.dataset.r);buildQuiz(inRegion(b.dataset.r),10,"部位テスト｜"+r.n)}
  else if(a==="mq"){buildQuiz([byName(b.dataset.m)],5,"単一部位｜"+b.dataset.m)}
  else if(a==="next"){QZ.locked=false;QZ.i++;if(QZ.i>=QZ.qs.length){addXP(QZ.qs.length>=30?100:20);go({name:"result"},false)}else render()}
  else if(a==="retry"){const t=QZ.title;const l=QZ.qs.map(q=>byName(q.m));buildQuiz([...new Set(l)],QZ.qs.length,t)}
  else if(a==="home"){HIST=[];go({name:"home"},false)}
  else if(a==="back"){back()}
  return;
 }
 if(mr&&mr.dataset.m){go({name:"muscle",name2:mr.dataset.m});return}
});
document.addEventListener("input",e=>{
 if(e.target.id!=="q")return;
 const v=e.target.value.trim(),lo=v.toLowerCase();
 const res=$("#sres"),grid=$("#catbody"),tabs=document.querySelector(".tabs");
 if(!v){res.innerHTML="";if(grid)grid.style.display="";if(tabs)tabs.style.display="";return}
 if(grid)grid.style.display="none";if(tabs)tabs.style.display="none";
 const hit=M.filter(m=>m.n.includes(v)||m.y.includes(v)||m.e.toLowerCase().includes(lo)||regionOf(m.g).n.includes(v));
 res.innerHTML=hit.length?`<div class="eyebrow" style="margin:14px 0 2px">${hit.length} 件</div><div class="mlist">`+hit.map(m=>
  `<button class="mrow" data-m="${esc(m.n)}"><span class="dot ${mState(m.n)}"></span>
   <span><span class="mn">${rb(m.n)}</span><span class="ml">${regionOf(m.g).n} ／ ${m.k}</span></span>
   <span class="mgo">›</span></button>`).join("")+`</div>`:`<div class="empty">該当なし。よみ（ひらがな）や英名でも検索できます。</div>`;
});
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"||e.key===" "){const f=document.activeElement;if(f&&f.classList.contains("reg")){e.preventDefault();f.click()}}
 if(VIEW.name==="quiz"&&!QZ.locked&&["1","2","3","4"].includes(e.key)){const b=document.querySelector(`.opt[data-o="${+e.key-1}"]`);if(b)b.click()}
});
$("#back").addEventListener("click",back);
const sheet=$("#sheet");
const openSheet=v=>{sheet.classList.toggle("on",v); if(v)$("#s-close").focus()};
$("#gear").addEventListener("click",()=>openSheet(true));
$("#s-close").addEventListener("click",()=>openSheet(false));
sheet.addEventListener("click",e=>{if(e.target===sheet)openSheet(false)});
$("#sw-furi").addEventListener("click",()=>applyFuri(!FURI,true));
$("#sw-motion").addEventListener("click",()=>{applyMotion(!MOTION,true);render()});
$("#th-dark").addEventListener("click",()=>{applyTheme("dark",true);render()});
$("#th-paper").addEventListener("click",()=>{applyTheme("paper",true);render()});
const box=$("#s-code"), msg=$("#s-msg");
$("#s-exp").addEventListener("click",async()=>{
 flushST(); const code=packST();
 box.value=code; box.classList.remove("hidden"); box.focus(); box.select();
 let done=false;
 try{ await navigator.clipboard.writeText(code); done=true; }catch(e){
  try{ done=document.execCommand("copy"); }catch(e2){}
 }
 msg.textContent=done?"コピーしました。メモ帳などに貼って保管してください。":"下の文字をすべて選択してコピーしてください。";
});
$("#s-imp").addEventListener("click",()=>{
 if(box.classList.contains("hidden")||!box.value.trim()){
  box.value=""; box.classList.remove("hidden"); box.placeholder="ここに書き出したコードを貼り付けて、もう一度この行を押してください";
  box.focus(); msg.textContent="コードを貼り付けてから、もう一度「記録を読み込む」を押してください。"; return;
 }
 try{ ST=unpackST(box.value); flushST(); msg.textContent="読み込みました。"; render(); }
 catch(e){ msg.textContent="読み込めませんでした。コードを確認してください。"; }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")openSheet(false)});

/* ============ BOOT ============ */
["s-title","s-desc","s-f1","s-f2","s-m1","s-m2","s-c1","s-c2","s-close"].forEach(id=>{
  const el=$("#"+id); if(el)el.innerHTML=rb(el.textContent);
});
addEventListener("pagehide",flushST);
addEventListener("beforeunload",flushST);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushST()});
(async()=>{await loadST();render()})();
</script>
</body>
</html>
