<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14284b">
<title>CHART MEMBER</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f7fa;
  --ink: #101b2d;
  --ink-2: #3a475f;
  --muted: #6b7890;
  --line: #dfe4ec;
  --line-2: #eceff4;
  --brand: #14284b;
  --brand-2: #1d3766;
  --brand-ink: #ffffff;
  --brand-muted: #a9b8d3;
  --accent: #f25c2a;
  --accent-press: #d94c1d;
  --accent-ink: #ffffff;
  --accent-soft: #fde9e1;
  --ok: #178a5c;
  --ok-soft: #dff3ea;
  --warn: #a86b00;
  --warn-soft: #fbf0d9;
  --danger: #cc3b30;
  --danger-soft: #fbe5e3;
  --lot-carryover: #c47a14;
  --lot-carryover-soft: #fbeedb;
  --lot-monthly: #2f63d6;
  --lot-monthly-soft: #e3ebfb;
  --lot-unlimited: #178a5c;
  --lot-unlimited-soft: #dff3ea;
  --lot-pack: #7a4fe0;
  --lot-pack-soft: #ece5fc;
  --shadow: 0 1px 2px rgba(16, 27, 45, .06), 0 6px 20px rgba(16, 27, 45, .06);
  --shadow-lg: 0 18px 50px rgba(16, 27, 45, .22);
  --radius: 14px;
  --radius-sm: 10px;
  --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  --num: "Barlow Condensed", "Oswald", "Arial Narrow", "Zen Kaku Gothic New", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0f18;
    --surface: #121a28;
    --surface-2: #172133;
    --ink: #e9eef6;
    --ink-2: #c3ccda;
    --muted: #8d99ae;
    --line: #243148;
    --line-2: #1c273a;
    --brand: #1a3160;
    --brand-2: #22407a;
    --brand-muted: #9fb1d4;
    --accent: #ff7447;
    --accent-press: #ff8a63;
    --accent-soft: #3a1f16;
    --ok: #3cc58c;
    --ok-soft: #12301f;
    --warn: #e6a93a;
    --warn-soft: #33270e;
    --danger: #ff6b5e;
    --danger-soft: #3a1714;
    --lot-carryover: #f0a33e;
    --lot-carryover-soft: #35260e;
    --lot-monthly: #6f9bff;
    --lot-monthly-soft: #172646;
    --lot-unlimited: #3cc58c;
    --lot-unlimited-soft: #12301f;
    --lot-pack: #a787ff;
    --lot-pack-soft: #251b45;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
    --shadow-lg: 0 18px 50px rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0f18;
  --surface: #121a28;
  --surface-2: #172133;
  --ink: #e9eef6;
  --ink-2: #c3ccda;
  --muted: #8d99ae;
  --line: #243148;
  --line-2: #1c273a;
  --brand: #1a3160;
  --brand-2: #22407a;
  --brand-muted: #9fb1d4;
  --accent: #ff7447;
  --accent-press: #ff8a63;
  --accent-soft: #3a1f16;
  --ok: #3cc58c;
  --ok-soft: #12301f;
  --warn: #e6a93a;
  --warn-soft: #33270e;
  --danger: #ff6b5e;
  --danger-soft: #3a1714;
  --lot-carryover: #f0a33e;
  --lot-carryover-soft: #35260e;
  --lot-monthly: #6f9bff;
  --lot-monthly-soft: #172646;
  --lot-unlimited: #3cc58c;
  --lot-unlimited-soft: #12301f;
  --lot-pack: #a787ff;
  --lot-pack-soft: #251b45;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
  --shadow-lg: 0 18px 50px rgba(0, 0, 0, .55);
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  font-feature-settings: "palt" 1;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

.app {
  max-width: 540px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px 40px;
  min-height: 100%;
}
.app.wide { max-width: 760px; }

/* ---------- 上のバー ---------- */
.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  margin-bottom: 8px;
}
.bar .title { flex: 1; min-width: 0; }
.bar .title h1 { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .title .sub { font-size: 12px; color: var(--muted); }
.wordmark {
  font-family: var(--num);
  font-weight: 700;
  letter-spacing: .14em;
  font-size: 15px;
  color: var(--ink);
}
.wordmark b { color: var(--accent); font-weight: 700; }
.bar .wordmark { white-space: nowrap; font-size: 14px; letter-spacing: .1em; }
.iconbtn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  flex: none;
}
.iconbtn svg { width: 20px; height: 20px; }
.chip-me {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 13px;
  max-width: 48vw;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.role-badge {
  font-size: 11px; font-weight: 700;
  padding: 1px 7px; border-radius: 999px;
  background: var(--brand); color: var(--brand-ink);
}
.role-badge.staff { background: var(--line); color: var(--ink-2); }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 700;
  text-decoration: none;
  transition: transform .06s ease, background .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:active { background: var(--accent-press); }
.btn.dark { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.btn.block { width: 100%; }
.btn.big { min-height: 60px; font-size: 18px; border-radius: 14px; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* ---------- 最初の画面 ---------- */
.start {
  display: flex; flex-direction: column; gap: 22px;
  padding-top: min(10vh, 72px);
}
.start-mark { display: flex; flex-direction: column; gap: 6px; }
.start-mark .wordmark { font-size: 34px; letter-spacing: .16em; line-height: 1; }
.start-mark .lead { color: var(--muted); font-size: 14px; }
.door {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
  width: 100%;
  text-align: left;
  padding: 20px 20px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.door .t { font-size: 20px; font-weight: 700; }
.door .d { grid-column: 1; font-size: 13px; color: var(--muted); }
.door .arrow { grid-row: 1 / span 2; grid-column: 2; font-family: var(--num); font-size: 26px; color: var(--muted); }
.door.customer { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.door.customer .d, .door.customer .arrow { color: var(--brand-muted); }

/* ---------- フォーム ---------- */
.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--muted); }
.req { color: var(--accent); font-size: 11px; margin-left: 4px; }
.input, .select, .textarea {
  width: 100%;
  min-height: 50px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 16px;
}
.textarea { min-height: 84px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.select {
  appearance: none; -webkit-appearance: none;
  padding-right: 38px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
}
.select.is-placeholder { color: var(--muted); }
.row3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pin { letter-spacing: .5em; font-family: var(--num); font-size: 24px; text-align: center; }
.msg {
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 14px;
  background: var(--danger-soft);
  color: var(--danger);
}
.msg.info { background: var(--surface-2); color: var(--ink-2); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.preview {
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  font-size: 14px;
  color: var(--ink-2);
}
.preview b { color: var(--ink); }
details.more { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.more > summary { padding: 12px 14px; cursor: pointer; font-weight: 700; font-size: 14px; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "＋"; float: right; color: var(--muted); }
details.more[open] > summary::after { content: "－"; }
details.more > .inner { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 14px; }

/* ---------- 会員カード ---------- */
.ticket { display: flex; flex-direction: column; filter: drop-shadow(0 10px 22px rgba(16, 27, 45, .14)); }
.card {
  position: relative;
  padding: 18px 20px 20px;
  border-radius: 20px 20px 0 0;
  background: radial-gradient(120% 90% at 100% 0%, var(--brand-2) 0%, var(--brand) 55%);
  color: var(--brand-ink);
  overflow: hidden;
}
.card::after {
  content: "";
  position: absolute; inset: auto -40px -60px auto;
  width: 180px; height: 180px;
  border-radius: 50%;
  border: 26px solid rgba(255, 255, 255, .05);
}
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.card .top .wordmark { color: var(--brand-ink); font-size: 13px; }
.card .plan { font-weight: 700; font-size: 14px; }
.card .avail-label { margin-top: 14px; font-size: 13px; color: var(--brand-muted); }
.card .avail { display: flex; align-items: baseline; gap: 6px; margin-top: -4px; }
.card .avail .n { font-family: var(--num); font-weight: 700; font-size: 104px; line-height: .95; letter-spacing: -.01em; }
.card .avail .u { font-size: 22px; font-weight: 700; }
.card .renew { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 10px; }
.card .renew .k { font-size: 12px; color: var(--brand-muted); }
.card .renew .v { font-size: 16px; font-weight: 700; }
.card .days {
  text-align: right;
  font-size: 13px; color: var(--brand-muted);
}
.card .days .num { font-size: 34px; font-weight: 700; color: var(--brand-ink); line-height: 1; margin: 0 2px; }
.card .status {
  display: inline-block; margin-left: 8px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 700;
  background: rgba(255, 255, 255, .14);
}
.perf {
  height: 14px;
  background:
    radial-gradient(circle at 0 50%, transparent 7px, var(--surface) 7.5px) left / 51% 100% no-repeat,
    radial-gradient(circle at 100% 50%, transparent 7px, var(--surface) 7.5px) right / 51% 100% no-repeat;
  position: relative;
}
.perf::before {
  content: ""; position: absolute; left: 14px; right: 14px; top: 50%;
  border-top: 2px dashed var(--line);
}
.stubs {
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface);
  border-radius: 0 0 20px 20px;
  padding: 4px 6px 14px;
}
.stubs.four { grid-template-columns: repeat(4, 1fr); }
.stub { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stub + .stub { border-left: 1px solid var(--line-2); }
.stub .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.stub .k i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.stub .v { display: flex; align-items: baseline; gap: 2px; }
.stub .v .num { font-size: 34px; font-weight: 700; line-height: 1.05; }
.stub .v .u { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.stub .x { font-size: 11px; color: var(--muted); white-space: nowrap; }
.dot-carryover { background: var(--lot-carryover); }
.dot-monthly { background: var(--lot-monthly); }
.dot-unlimited { background: var(--lot-unlimited); }
.dot-pack { background: var(--lot-pack); }

/* ---------- 数字タイル ---------- */
.section { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
.section > .h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section > .h h2 { font-size: 15px; font-weight: 700; }
.section > .h .s { font-size: 12px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile {
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 2px;
}
.tile .k { font-size: 12px; color: var(--muted); line-height: 1.35; min-height: 2.7em; }
.tile .v { display: flex; align-items: baseline; gap: 2px; }
.tile .v .num { font-size: 32px; font-weight: 700; line-height: 1; }
.tile .v .u { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.tile.warn .v .num { color: var(--danger); }

.notice {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--warn-soft);
  color: var(--ink);
  font-size: 14px;
}
.notice .ic { flex: none; font-weight: 700; color: var(--warn); }
.notice.info { background: var(--surface-2); }

.panel {
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 4px 14px;
}
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; font-size: 14px; }
.kv + .kv { border-top: 1px solid var(--line-2); }
.kv .k { color: var(--muted); flex: none; }
.kv .v { text-align: right; font-weight: 500; }

/* ---------- 履歴 ---------- */
.period { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; }
.period + .period { margin-top: 10px; }
.period-h { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; background: var(--surface-2); border-bottom: 1px solid var(--line-2); }
.period-h .t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 15px; }
.period-h .s { font-size: 12px; color: var(--muted); }
.badge {
  display: inline-flex; align-items: center;
  padding: 1px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 700;
  background: var(--line-2); color: var(--ink-2);
  white-space: nowrap;
}
.badge.now { background: var(--accent-soft); color: var(--accent); }
.badge.paused { background: var(--warn-soft); color: var(--warn); }
.badge.ended { background: var(--danger-soft); color: var(--danger); }
.badge.void { background: var(--danger-soft); color: var(--danger); }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 10px; padding: 11px 14px; align-items: start; }
.item + .item { border-top: 1px solid var(--line-2); }
.item .d { font-family: var(--num); font-size: 16px; font-weight: 600; color: var(--ink-2); line-height: 1.5; }
.item .l { min-width: 0; }
.item .l .a { font-size: 14px; font-weight: 700; }
.item .l .m { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.item .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.item .q { font-family: var(--num); font-size: 22px; font-weight: 700; line-height: 1; }
.item .q.plus { color: var(--ok); }
.item .q.minus { color: var(--ink); }
.item .q.zero { color: var(--muted); }
.item.voided .a, .item.voided .q { text-decoration: line-through; color: var(--muted); }
.lotchip { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
.lot-carryover { color: var(--lot-carryover); background: var(--lot-carryover-soft); }
.lot-monthly { color: var(--lot-monthly); background: var(--lot-monthly-soft); }
.lot-unlimited { color: var(--lot-unlimited); background: var(--lot-unlimited-soft); }
.lot-pack { color: var(--lot-pack); background: var(--lot-pack-soft); }
.item .void-link {
  margin-top: 2px; padding: 4px 0;
  background: none; border: 0;
  font-size: 12px; font-weight: 700;
  color: var(--danger);
  text-decoration: underline; text-underline-offset: 3px;
}
.empty { padding: 26px 14px; text-align: center; color: var(--muted); font-size: 14px; }

/* ---------- 顧客一覧 ---------- */
.searchbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: 8px;
  padding: 8px 0 10px;
  background: var(--bg);
}
.clist { display: flex; flex-direction: column; gap: 8px; }
.crow {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
  width: 100%; text-align: left;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--line-2);
  background: var(--surface);
}
.crow .n { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.crow .kana { font-size: 12px; color: var(--muted); font-weight: 400; }
.crow .meta { grid-column: 1; font-size: 12px; color: var(--muted); }
.crow .av { grid-row: 1 / span 2; grid-column: 2; text-align: right; }
.crow .av .num { font-size: 30px; font-weight: 700; line-height: 1; }
.crow .av .u { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.crow .av .s { font-size: 11px; color: var(--muted); display: block; }
.count-line { font-size: 12px; color: var(--muted); padding: 2px 2px 0; }

/* ---------- 顧客詳細 ---------- */
.who { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 14px; }
.who h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.who .kana { font-size: 13px; color: var(--muted); }
.who .meta { font-size: 13px; color: var(--ink-2); }
.dock {
  position: sticky; bottom: 0; z-index: 6;
  margin-inline: -16px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, color-mix(in srgb, var(--bg) 0%, transparent));
}
.admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.admin-grid .btn { min-height: 52px; font-size: 14px; justify-content: flex-start; text-align: left; padding: 10px 14px; }
.admin-grid .btn span.s { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }

/* ---------- シート（下から出る画面） ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(8, 14, 26, .45);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .15s ease;
}
.sheet {
  width: 100%; max-width: 540px;
  max-height: calc(100% - 24px - env(safe-area-inset-top, 0px));
  overflow: auto;
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  box-shadow: var(--shadow-lg);
  animation: up .2s ease;
}
.sheet .grip { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 4px auto 10px; }
.sheet .sh { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.sheet .sh h2 { font-size: 18px; font-weight: 700; }
.sheet .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
@media (min-width: 700px) {
  .scrim { align-items: center; }
  .sheet { border-radius: 20px; max-height: 88vh; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }

.choice {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
  width: 100%; text-align: left;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
}
.choice + .choice { margin-top: 8px; }
.choice .t { font-size: 17px; font-weight: 700; }
.choice .d { font-size: 12px; color: var(--muted); grid-column: 1; }
.choice .e { grid-row: 1 / span 2; grid-column: 2; font-family: var(--num); font-size: 22px; font-weight: 700; color: var(--ink-2); }
.choice.main { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.confirm-box {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--line-2);
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;
}
.confirm-box .kind { font-size: 18px; font-weight: 700; }
.confirm-box .flow { display: flex; align-items: baseline; gap: 12px; }
.confirm-box .flow .num { font-size: 56px; font-weight: 700; line-height: 1; }
.confirm-box .flow .arr { font-size: 22px; color: var(--muted); }
.confirm-box .flow .after { color: var(--accent); }
.confirm-box .s { font-size: 13px; color: var(--muted); }

/* ---------- トースト ---------- */
.toast {
  position: fixed; left: 50%; z-index: 60;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: min(520px, calc(100% - 32px));
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--ink); color: var(--bg);
  box-shadow: var(--shadow-lg);
  font-size: 14px;
  animation: up .2s ease;
}
.toast .t { flex: 1; }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 6px 4px; }
.toast.err { background: var(--danger); color: #fff; }
.toast.err button { color: #fff; }

/* ---------- 管理 ---------- */
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-item {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px;
  width: 100%; text-align: left;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--line-2);
  background: var(--surface);
}
.menu-item .t { font-weight: 700; }
.menu-item .d { font-size: 12px; color: var(--muted); grid-column: 1; }
.menu-item .arrow { grid-row: 1 / span 2; grid-column: 2; color: var(--muted); font-family: var(--num); font-size: 20px; }
.log { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius); }
.logrow { padding: 11px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.logrow + .logrow { border-top: 1px solid var(--line-2); }
.logrow .a { font-weight: 700; font-size: 14px; }
.logrow .m { grid-column: 1 / 3; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.logrow .t { font-size: 12px; color: var(--muted); font-family: var(--num); white-space: nowrap; }

.loading { padding: 60px 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; gap: 12px; }
.spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.foot { margin-top: 28px; display: flex; justify-content: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 360px) {
  .card .avail .n { font-size: 88px; }
  .stub .v .num { font-size: 28px; }
  .tile .v .num { font-size: 26px; }
}

<script>
/* CHART MEMBER 共通の小道具（日付・受付番号） */
(function (G) {
  'use strict';
  const DAY = 86400000;
  const D = {
    parse(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); },
    fmt(ms) { return new Date(ms).toISOString().slice(0, 10); },
    add(s, n) { return D.fmt(D.parse(s) + n * DAY); },
    diff(a, b) { return Math.round((D.parse(a) - D.parse(b)) / DAY); },
    dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); },
    renewalDate(y, m, day) { return D.fmt(Date.UTC(y, m - 1, Math.min(day, D.dim(y, m)))); },
    nextRenewalAfter(s, day) {
      const y = +s.slice(0, 4), m = +s.slice(5, 7);
      const v = D.renewalDate(y, m, day);
      if (v > s) return v;
      return m === 12 ? D.renewalDate(y + 1, 1, day) : D.renewalDate(y, m + 1, day);
    },
    renewalOnOrAfter(s, day) { return D.nextRenewalAfter(D.add(s, -1), day); },
    jst(ms) { const x = new Date(ms + 9 * 3600000).toISOString(); return { date: x.slice(0, 10), time: x.slice(11, 23) }; },
    jstDateOf(iso) { return D.jst(Date.parse(iso)).date; },
  };

  function uuid() {
    const c = G.crypto;
    if (c && c.randomUUID) return c.randomUUID();
    const b = new Uint8Array(16);
    if (c && c.getRandomValues) c.getRandomValues(b); else for (let i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }
  G.CMUtil = { D, uuid };
})(typeof globalThis !== 'undefined' ? globalThis : window);

<script>
/* CHART MEMBER デモ用エンジン
   本番の setup.sql と同じルール・同じAPIをブラウザの中で動かす（データはメモリ上だけ）。
   テスト（test/parity.mjs）で、同じ操作をSQL版と流して結果が一致することを確認している。 */
(function (G) {
  'use strict';

  class ApiError extends Error {
    constructor(message, hint) { super(message); this.hint = hint || null; }
  }
  const err = (m, h) => new ApiError(m, h);

  // ---------------- 名前の照合 ----------------
  const KATA = 'ァアィイゥウェエォオカガキギクグケゲコゴサザシジスズセゼソゾタダチヂッツヅテデトドナニヌネノハバパヒビピフブプヘベペホボポマミムメモャヤュユョヨラリルレロヮワヰヱヲンヴヵヶ';
  const HIRA = 'ぁあぃいぅうぇえぉおかがきぎくぐけげこごさざしじすずせぜそぞただちぢっつづてでとどなにぬねのはばぱひびぴふぶぷへべぺほぼぽまみむめもゃやゅゆょよらりるれろゎわゐゑをんゔゕゖ';
  const ITA_F = '髙﨑𠮷德邊邉齋齊濵冨惠國澤廣眞榮瀨嶋條櫻';
  const ITA_T = '高崎吉徳辺辺斎斉浜富恵国沢広真栄瀬島条桜';
  function translate(s, from, to) {
    const f = Array.from(from), t = Array.from(to), m = new Map();
    f.forEach((ch, i) => { if (!m.has(ch)) m.set(ch, i < t.length ? t[i] : ''); });
    return Array.from(s).map(ch => (m.has(ch) ? m.get(ch) : ch)).join('');
  }
  const normName = p => translate(String(p == null ? '' : p).normalize('NFKC').replace(/[\s・]+/gu, ''), ITA_F, ITA_T).toLowerCase();
  const normKana = p => translate(normName(p), KATA, HIRA);
  const trimOrNull = v => { if (v == null) return null; const t = String(v).trim(); return t === '' ? null : t; };
  const str = v => (v == null ? null : String(v));
  const intOrNull = v => (v == null || v === '' ? null : parseInt(v, 10));
  const numOrNull = v => (v == null || v === '' ? null : Number(v));
  const fmtN = n => (Number.isInteger(n) ? String(n) : n.toFixed(1));

  // ---------------- 日付（'YYYY-MM-DD'） ----------------
  const DAY = 86400000;
  const D = {
    parse(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); },
    fmt(ms) { return new Date(ms).toISOString().slice(0, 10); },
    add(s, n) { return D.fmt(D.parse(s) + n * DAY); },
    diff(a, b) { return Math.round((D.parse(a) - D.parse(b)) / DAY); },
    dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); },
    renewalDate(y, m, day) { return D.fmt(Date.UTC(y, m - 1, Math.min(day, D.dim(y, m)))); },
    nextRenewalAfter(s, day) {
      const y = +s.slice(0, 4), m = +s.slice(5, 7);
      const v = D.renewalDate(y, m, day);
      if (v > s) return v;
      return m === 12 ? D.renewalDate(y + 1, 1, day) : D.renewalDate(y, m + 1, day);
    },
    renewalOnOrAfter(s, day) { return D.nextRenewalAfter(D.add(s, -1), day); },
    jst(ms) { const x = new Date(ms + 9 * 3600000).toISOString(); return { date: x.slice(0, 10), time: x.slice(11, 23) }; },
    jstDateOf(iso) { return D.jst(Date.parse(iso)).date; },
  };

  function uuid() {
    const c = G.crypto;
    if (c && c.randomUUID) return c.randomUUID();
    const b = new Uint8Array(16);
    if (c && c.getRandomValues) c.getRandomValues(b); else for (let i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }
  const newToken = () => uuid().replace(/-/g, '') + uuid().replace(/-/g, '');
  // デモ用の簡易ハッシュ（本番は SQL 側の sha256）
  function hashText(s) {
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (const ch of String(s)) { const c = ch.codePointAt(0); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = Math.imul(h2 ^ c, 2246822519) >>> 0; }
    return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
  }
  const clone = v => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  // 消化の順番：当月分を先に使い、使い切ったら前月繰越 → 回数券 → 無期限
  const LOT_RANK = { monthly: 1, carryover: 2, pack: 3, unlimited: 9 };
  const isHalf = n => typeof n === 'number' && isFinite(n) && Math.round(n * 2) === n * 2;

  class Engine {
    constructor() { this.reset(); }

    reset() {
      this.db = { version: 4, seq: {}, stores: [], plans: [], staff: [], customers: [], contracts: [], periods: [], lots: [],
                  ledger: [], events: [], audit: [], sessions: [], attempts: [], requests: {} };
      this.override = null;   // デモの日付
      this.clock = null;      // デモの時刻（'HH:MM'）
      this.headers = null;    // 接続元（テスト用）
    }
    nextId(t) { this.db.seq[t] = (this.db.seq[t] || 0) + 1; return this.db.seq[t]; }

    // ---------------- 時刻 ----------------
    now() {
      if (this._tx) return this._tx;   // 1回の呼び出しの中では同じ時刻（SQLのトランザクションと同じ）
      if (!this.override) return new Date().toISOString();
      const t = this.clock || D.jst(Date.now()).time;   // デモの時刻（未設定なら今の時刻）
      return new Date(Date.parse(`${this.override}T${t}+09:00`)).toISOString();
    }
    today() { return this.override || D.jst(Date.now()).date; }
    realNow() { return Date.now(); }

    // ---------------- 参照 ----------------
    cust(id) { return this.db.customers.find(c => c.id === id); }
    lot(id) { return this.db.lots.find(l => l.id === id); }
    period(id) { return this.db.periods.find(p => p.id === id); }
    plan(id) { return this.db.plans.find(p => p.id === id); }
    staffById(id) { return this.db.staff.find(s => s.id === id); }
    openContract(cid) { return this.db.contracts.find(k => k.customer_id === cid && k.ended_on == null); }
    openPeriod(contractId) { return this.db.periods.find(p => p.contract_id === contractId && p.closed_at == null); }

    // ---------------- 束と台帳 ----------------
    lotExpires(l) { return l.period_id != null ? this.period(l.period_id).end_date : l.expires_on; }
    lotBalance(id) { let s = 0; for (const g of this.db.ledger) if (g.lot_id === id) s += g.qty; return s; }
    vLots(cid) {
      return this.db.lots.filter(l => l.customer_id === cid)
        .map(l => Object.assign({}, l, { effective_expires_on: this.lotExpires(l), balance: this.lotBalance(l.id) }));
    }
    lotUsableOn(id, d) {
      const l = this.lot(id); if (!l) return false;
      const e = this.lotExpires(l);
      return l.closed_at == null && l.valid_from <= d && (e == null || d < e);
    }
    ledgerAdd(cid, lotId, type, qty, staffId = null, reason = null, note = null, periodId = null, batch = null, effectiveOn = null, eventId = null) {
      const l = this.lot(lotId);
      if (!l || l.customer_id !== cid) throw err('台帳：チケットの束と顧客が一致しません');
      if (l.closed_at != null) throw err('台帳：締め済みのチケットは動かせません');
      if (type === 'consume' && !this.lotUsableOn(lotId, this.today())) throw err('台帳：有効期間外のチケットは使えません');
      const lb = this.lotBalance(lotId);
      if (lb + qty < 0) throw err('残りの回数より多くは減らせません');
      if (!isHalf(qty)) throw err('回数は0.5回（30分）単位です');
      const signOk = qty !== 0 && ((['grant', 'carry_in', 'void'].includes(type) && qty > 0) ||
        (['carry_out', 'expire', 'consume'].includes(type) && qty < 0) ||
        ['adjust', 'plan_change'].includes(type));
      if (!signOk) throw err('台帳：増減の値が正しくありません');
      if (['grant', 'carry_in', 'carry_out', 'expire'].includes(type) &&
          this.db.ledger.some(g => g.lot_id === lotId && g.entry_type === type)) {
        throw err('台帳：同じ処理はすでに記録されています');
      }
      let cb = 0; for (const g of this.db.ledger) if (g.customer_id === cid) cb += g.qty;
      const row = { id: this.nextId('ledger'), customer_id: cid, lot_id: lotId, entry_type: type, qty,
        balance_before: cb, balance_after: cb + qty, lot_balance_after: lb + qty, period_id: periodId,
        batch_id: batch, reason, note: trimOrNull(note), staff_id: staffId, event_id: eventId,
        effective_on: effectiveOn || this.today(), created_at: this.now() };
      this.db.ledger.push(row);
      return row;
    }
    newLot(cid, type, periodId, validFrom, expiresOn = null, sourceLotId = null, staffId = null) {
      if (['monthly', 'carryover'].includes(type) !== (periodId != null)) throw err('チケットの束の設定が正しくありません');
      if ((type === 'pack') !== (expiresOn != null)) throw err('チケットの束の設定が正しくありません');
      if (periodId != null && this.db.lots.some(l => l.period_id === periodId && l.lot_type === type)) {
        throw err('同じ期間に同じ種類の束はすでにあります');
      }
      const l = { id: this.nextId('lots'), customer_id: cid, lot_type: type, period_id: periodId, source_lot_id: sourceLotId,
        valid_from: validFrom, expires_on: expiresOn, closed_at: null, created_at: this.now(), created_by: staffId, note: null };
      this.db.lots.push(l);
      return l.id;
    }
    // 消化の順番（SQL の app.pick_lot と同じ）
    usableLots(cid, d) {
      const c = this.vLots(cid).filter(v => v.closed_at == null && v.balance > 0 && v.valid_from <= d &&
        (v.effective_expires_on == null || d < v.effective_expires_on));
      c.sort((a, b) =>
        (a.effective_expires_on == null) - (b.effective_expires_on == null) ||
        String(a.effective_expires_on || '').localeCompare(String(b.effective_expires_on || '')) ||
        (LOT_RANK[a.lot_type] || 5) - (LOT_RANK[b.lot_type] || 5) || a.id - b.id);
      return c;
    }
    pickLot(cid, d) { const c = this.usableLots(cid, d); return c.length ? c[0].id : null; }
    // amount回分を、消化の順番どおりにどの束から何回使うか
    consumePlan(cid, amount) {
      const plan = [];
      let left = amount;
      for (const v of this.usableLots(cid, this.today())) {
        if (left <= 0) break;
        const take = Math.min(left, v.balance);
        plan.push({ lot_id: v.id, lot_type: v.lot_type, qty: take });
        left -= take;
      }
      return { plan, short: left > 0 ? left : 0 };
    }
    balances(cid) {
      const t = this.today(), r = { carryover: 0, monthly: 0, unlimited: 0, pack: 0, total: 0 };
      for (const v of this.vLots(cid)) {
        if (v.closed_at == null && v.valid_from <= t && (v.effective_expires_on == null || t < v.effective_expires_on)) {
          r[v.lot_type] += v.balance; r.total += v.balance;
        }
      }
      return r;
    }
    totalBalance(cid) { return this.balances(cid).total; }

    audit(role, staffId, cid, action, qty, detail) {
      this.db.audit.push({ id: this.nextId('audit'), at: this.now(), actor_role: role, actor_staff_id: staffId,
        customer_id: cid, action, qty_delta: qty == null ? null : qty, detail: clone(detail || {}) });
    }

    // ---------------- 契約・更新処理 ----------------
    startContract(cid, planId, start, day, staffId = null, batch = null) {
      const plan = this.db.plans.find(p => p.id === planId && p.kind === 'monthly' && p.is_active);
      if (!plan) throw err('プランを選んでください');
      if (day == null || day < 1 || day > 31) throw err('更新日は1〜31日から選んでください');
      if (!start) throw err('開始日を選んでください');
      if (start > this.today()) throw err('開始日に未来の日付は選べません');
      const end = D.nextRenewalAfter(start, day);
      if (end <= this.today()) throw err('開始日が古すぎます。今の期間の開始日（直近の更新日）を選んでください');
      if (this.openContract(cid)) throw err('この方にはすでに契約中の契約があります');
      const ts = this.now();
      const k = { id: this.nextId('contracts'), customer_id: cid, kind: 'monthly', renewal_day: day, started_on: start,
        ended_on: null, pending_plan_id: null, pending_status: null, created_at: ts, updated_at: ts };
      this.db.contracts.push(k);
      const p = { id: this.nextId('periods'), contract_id: k.id, customer_id: cid, start_date: start, end_date: end,
        plan_id: plan.id, status: 'active', sessions_granted: plan.sessions, carryover_max: plan.carryover_max,
        closed_at: null, created_at: ts };
      this.db.periods.push(p);
      if (plan.sessions > 0) {
        const lot = this.newLot(cid, 'monthly', p.id, start, null, null, staffId);
        this.ledgerAdd(cid, lot, 'grant', plan.sessions, staffId, 'contract_start', null, p.id, batch, start);
      }
      return k.id;
    }

    renewOnce(contractId) {
      const c = this.db.contracts.find(k => k.id === contractId);
      if (!c || c.ended_on != null) return false;
      const p = this.openPeriod(c.id);
      if (!p) throw err(`契約 ${c.id} に今の期間がありません`);
      if (p.end_date > this.today()) return false;
      const d = p.end_date;
      const status = c.pending_status || p.status;
      const plan = this.plan(c.pending_plan_id != null ? c.pending_plan_id : p.plan_id);
      const m = this.db.lots.find(l => l.period_id === p.id && l.lot_type === 'monthly');
      const cl = this.db.lots.find(l => l.period_id === p.id && l.lot_type === 'carryover');
      const rm = m ? this.lotBalance(m.id) : 0;
      const rc = cl ? this.lotBalance(cl.id) : 0;
      const carry = status !== 'ended' ? Math.min(rm, p.carryover_max) : 0;
      const batch = uuid();
      if (rc > 0) this.ledgerAdd(c.customer_id, cl.id, 'expire', -rc, null, 'carryover_expired', null, p.id, batch, d);
      if (carry > 0) this.ledgerAdd(c.customer_id, m.id, 'carry_out', -carry, null, 'carry_out', null, p.id, batch, d);
      if (rm - carry > 0) {
        this.ledgerAdd(c.customer_id, m.id, 'expire', -(rm - carry), null,
          status === 'ended' ? 'contract_ended' : 'over_carry_limit', null, p.id, batch, d);
      }
      const ts = this.now();
      for (const l of this.db.lots) if (l.period_id === p.id) l.closed_at = ts;
      p.closed_at = ts;
      if (status === 'ended') {
        Object.assign(c, { ended_on: d, pending_plan_id: null, pending_status: null, updated_at: ts });
        this.audit('system', null, c.customer_id, 'contract_ended', -(rm + rc), { ended_on: d, expired: rm + rc });
        return true;
      }
      const e = D.nextRenewalAfter(d, c.renewal_day);
      const grant = status === 'active' ? plan.sessions : 0;
      if (this.db.periods.some(x => x.contract_id === c.id && x.start_date === d)) throw err('期間が重複しています');
      const np = { id: this.nextId('periods'), contract_id: c.id, customer_id: c.customer_id, start_date: d, end_date: e,
        plan_id: plan.id, status, sessions_granted: grant, carryover_max: plan.carryover_max, closed_at: null, created_at: ts };
      this.db.periods.push(np);
      if (carry > 0) {
        const lot = this.newLot(c.customer_id, 'carryover', np.id, d, null, m.id, null);
        this.ledgerAdd(c.customer_id, lot, 'carry_in', carry, null, 'carry_in', null, np.id, batch, d);
      }
      if (grant > 0) {
        const lot = this.newLot(c.customer_id, 'monthly', np.id, d, null, null, null);
        this.ledgerAdd(c.customer_id, lot, 'grant', grant, null, 'monthly_grant', null, np.id, batch, d);
      }
      Object.assign(c, { pending_plan_id: null, pending_status: null, updated_at: ts });
      this.audit('system', null, c.customer_id, 'renewal', grant - (rm - carry) - rc,
        { period_start: d, next_renewal: e, plan: plan.name, status, carried: carry, expired: (rm - carry) + rc, granted: grant });
      return true;
    }

    ensureCurrent(cid) {
      if (!this.cust(cid)) throw err('お客様が見つかりません');
      const k = this.openContract(cid);
      if (k) {
        let n = 0;
        while (this.renewOnce(k.id)) { n++; if (n > 240) throw err(`更新処理が終わりません（契約 ${k.id}）`); }
      }
      for (const v of this.vLots(cid)) {
        if (v.closed_at == null && v.lot_type === 'pack' && v.effective_expires_on <= this.today()) {
          if (v.balance > 0) this.ledgerAdd(cid, v.id, 'expire', -v.balance, null, 'pack_expired', null, null, null, v.expires_on);
          this.lot(v.id).closed_at = this.now();
        }
      }
    }

    runDueRenewals() {
      const t = this.today(), ids = new Set();
      for (const p of this.db.periods) {
        const k = this.db.contracts.find(x => x.id === p.contract_id);
        if (k && k.ended_on == null && p.closed_at == null && p.end_date <= t) ids.add(p.customer_id);
      }
      for (const l of this.db.lots) if (l.lot_type === 'pack' && l.closed_at == null && l.expires_on <= t) ids.add(l.customer_id);
      let n = 0;
      for (const id of [...ids].sort((a, b) => a - b)) {
        const snap = this.snapshot();
        try { this.ensureCurrent(id); n++; }
        catch (e) { this.restore(snap); this.audit('system', null, id, 'renewal_error', null, { error: e.message }); }
      }
      return n;
    }

    // ---------------- 表示用 ----------------
    periodStats(cid, periodId) {
      const r = { visits: 0, consumed: 0, cancel_consumed: 0, cancel_free: 0 };
      if (periodId == null) return r;
      for (const e of this.db.events) {
        if (e.customer_id !== cid || e.period_id !== periodId || e.voided_at != null) continue;
        if (e.kind === 'session') r.visits++;
        if (e.kind === 'session' || e.kind === 'cancel_consume') r.consumed += e.amount;
        if (e.kind === 'cancel_consume') r.cancel_consumed += e.amount;
        if (e.kind === 'cancel_free') r.cancel_free++;
      }
      return r;
    }
    planJson(id) {
      const p = this.plan(id); if (!p) return null;
      return { id: p.id, code: p.code, name: p.name, sessions: p.sessions, carryover_max: p.carryover_max, price_yen: p.price_yen };
    }
    customerSummary(cid, forStaff) {
      const cu = this.cust(cid);
      if (!cu) throw err('お客様が見つかりません');
      const store = this.db.stores.find(s => s.id === cu.store_id);
      const c = this.openContract(cid);
      let ctr = null, ended = null, p = null;
      if (c) {
        p = this.openPeriod(c.id);
        ctr = {
          id: c.id, status: p.status, plan: this.planJson(p.plan_id), renewal_day: c.renewal_day, started_on: c.started_on,
          period: { id: p.id, start: p.start_date, end: D.add(p.end_date, -1) },
          next_renewal: p.end_date, days_left: D.diff(p.end_date, this.today()),
          pending: { plan: c.pending_plan_id != null ? this.planJson(c.pending_plan_id) : null, status: c.pending_status || null },
        };
      } else {
        const ks = this.db.contracts.filter(k => k.customer_id === cid).sort((a, b) =>
          (a.ended_on == null) - (b.ended_on == null) || String(b.ended_on || '').localeCompare(String(a.ended_on || '')) || b.id - a.id);
        if (ks.length) {
          const k = ks[0];
          const lp = this.db.periods.filter(x => x.contract_id === k.id).sort((a, b) => b.start_date.localeCompare(a.start_date))[0];
          ended = { ended_on: k.ended_on, plan_name: lp ? this.plan(lp.plan_id).name : null };
        }
      }
      const open = this.vLots(cid).filter(v => v.closed_at == null);
      const maxOf = xs => (xs.length ? xs.sort().slice(-1)[0] : null);
      const minOf = xs => (xs.length ? xs.sort()[0] : null);
      const expires = {
        carryover: maxOf(open.filter(v => v.lot_type === 'carryover').map(v => D.add(v.effective_expires_on, -1))),
        monthly: maxOf(open.filter(v => v.lot_type === 'monthly').map(v => D.add(v.effective_expires_on, -1))),
        pack: minOf(open.filter(v => v.lot_type === 'pack' && v.balance > 0).map(v => D.add(v.effective_expires_on, -1))),
      };
      const nl = this.pickLot(cid, this.today());
      const customer = { id: cu.id, name: cu.name, name_kana: cu.name_kana, store_id: cu.store_id, store: store ? store.name : null };
      if (forStaff) Object.assign(customer, { birth_date: cu.birth_date, note: cu.note });
      return {
        today: this.today(), customer, contract: ctr, ended_contract: ended, balances: this.balances(cid), expires,
        stats: this.periodStats(cid, ctr ? p.id : null), next_lot_type: nl ? this.lot(nl).lot_type : null,
      };
    }

    history(cid, role, viewerStaffId) {
      const t = this.today(), items = [];
      const name = id => { const s = this.staffById(id); return s ? s.name : null; };
      for (const e of this.db.events.filter(x => x.customer_id === cid)) {
        const gs = this.db.ledger.filter(x => x.event_id === e.id && x.entry_type === 'consume');
        const g = gs.length ? gs[gs.length - 1] : null;
        const types = [...new Set(gs.map(x => this.lot(x.lot_id).lot_type))];
        const item = { type: e.kind, event_id: e.id, minutes: e.minutes || null,
          delta: e.kind === 'cancel_free' || e.voided_at != null ? 0 : -e.amount,
          lot_type: types[0] || null, lot_types: types, voided: e.voided_at != null, void_reason: e.void_reason || null };
        if (role !== 'customer') {
          const usable = gs.every(x => this.lotUsableOn(x.lot_id, t));
          Object.assign(item, {
            ledger_id: g ? g.id : null, balance_after: g ? g.balance_after : null, staff: name(e.staff_id),
            note: e.note || null, voided_by: e.voided_by != null ? name(e.voided_by) : null, voided_at: e.voided_at || null,
            voidable: e.voided_at == null && (
              (role === 'admin' || role === 'staff') && usable),
          });
        }
        items.push({ period_id: e.period_id, on: D.jstDateOf(e.occurred_at), at: e.occurred_at, sort_id: e.id, src: 1, item });
      }
      for (const g of this.db.ledger.filter(x => x.customer_id === cid)) {
        if (g.entry_type === 'consume' || (g.entry_type === 'void' && role === 'customer')) continue;
        const l = this.lot(g.lot_id);
        const item = { type: g.entry_type, delta: g.qty, lot_type: l.lot_type, reason: g.reason || null };
        if (role !== 'customer') {
          Object.assign(item, { ledger_id: g.id, balance_after: g.balance_after,
            staff: name(g.staff_id) || (g.staff_id == null ? '自動' : null), note: g.note || null });
        }
        items.push({ period_id: g.period_id, on: g.effective_on, at: g.created_at, sort_id: g.id, src: 2, item });
      }
      const groups = new Map();
      for (const i of items) {
        const key = i.period_id == null ? 'none' : i.period_id;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(i);
      }
      const out = [];
      for (const [key, list] of groups) {
        list.sort((a, b) => b.on.localeCompare(a.on) || b.at.localeCompare(a.at) || b.src - a.src || b.sort_id - a.sort_id);
        const p = key === 'none' ? null : this.period(key);
        out.push({
          sortDate: p ? p.start_date : list.map(i => i.on).sort().slice(-1)[0], pid: p ? p.id : null,
          period: p ? { id: p.id, start: p.start_date, end: D.add(p.end_date, -1), plan: this.plan(p.plan_id).name,
                        status: p.status, current: p.closed_at == null } : null,
          stats: p ? this.periodStats(cid, p.id) : null,
          items: list.map(i => Object.assign({}, i.item, { on: i.on, at: i.at })),
        });
      }
      out.sort((a, b) => b.sortDate.localeCompare(a.sortDate) || (a.pid == null ? -1 : b.pid == null ? 1 : b.pid - a.pid));
      return out.map(({ period, stats, items: it }) => ({ period, stats, items: it }));
    }

    contractChanges(cid) {
      const acts = ['customer_created', 'customer_updated', 'contract_started', 'plan_change_scheduled', 'plan_changed_now',
        'renewal_day_changed', 'status_scheduled', 'status_changed_now', 'pending_cancelled', 'contract_ended'];
      return this.db.audit.filter(a => a.customer_id === cid && acts.includes(a.action)).sort((a, b) => b.id - a.id)
        .map(a => { const s = this.staffById(a.actor_staff_id); return { at: a.at, action: a.action, staff: s ? s.name : '自動', detail: clone(a.detail) }; });
    }

    // ---------------- ログイン ----------------
    issueToken(kind, cid, sid) {
      const t = newToken();
      const now = this.realNow();
      this.db.sessions.push({ token_hash: hashText(t), kind, customer_id: cid, staff_id: sid, created_at: now,
        expires_at: now + (kind === 'customer' ? 365 * DAY : 30 * DAY), last_seen_at: now, revoked_at: null });
      this.db.sessions = this.db.sessions.filter(s => s.expires_at >= now - 30 * DAY);
      return t;
    }
    clientIp() {
      const h = this.headers;
      if (!h) return 'unknown';
      const v = h['cf-connecting-ip'] || h['x-real-ip'] || (h['x-forwarded-for'] ? String(h['x-forwarded-for']).split(',')[0] : null);
      return v && v.trim() ? v.trim() : 'unknown';
    }
    auth(token, need) {
      if (token == null || String(token).length < 32) throw err('ログインしてください', 'auth');
      const s = this.db.sessions.find(x => x.token_hash === hashText(token));
      if (!s || s.revoked_at != null || s.expires_at < this.realNow()) {
        throw err('ログインの期限が切れました。もう一度ログインしてください', 'auth');
      }
      let ctx;
      if (s.kind === 'customer') ctx = { kind: 'customer', role: 'customer', customer_id: s.customer_id, staff_id: null, staff_name: null };
      else {
        const st = this.staffById(s.staff_id);
        if (!st || !st.is_active) throw err('このアカウントは使えません', 'auth');
        ctx = { kind: 'staff', role: st.role, customer_id: null, staff_id: st.id, staff_name: st.name };
      }
      if ((need === 'customer' && ctx.role !== 'customer') || (need === 'staff' && !['staff', 'admin'].includes(ctx.role))) {
        throw err('この画面を使う権限がありません', 'forbidden');
      }
      if (need === 'admin' && ctx.role !== 'admin') throw err('この操作は管理者だけができます', 'forbidden');
      s.last_seen_at = this.realNow();
      return ctx;
    }
    hashPin(salt, pin) { return hashText(salt + ':' + pin); }
    checkPinFormat(pin) { if (pin == null || !/^[0-9]{4,8}$/.test(pin)) throw err('暗証番号は4〜8桁の数字にしてください'); }
    priorResult(rid) { if (rid == null) return null; const r = this.db.requests[rid]; return r ? Object.assign(clone(r.result), { duplicate: true }) : null; }
    saveResult(rid, action, cid, sid, result) {
      if (rid != null) {
        if (this.db.requests[rid]) throw err('受付番号が重複しています');
        this.db.requests[rid] = { action, customer_id: cid, staff_id: sid, result: clone(result), created_at: this.realNow() };
      }
      return result;
    }
    setupAdmin(name, pin) {
      this.checkPinFormat(pin);
      const n = String(name).trim();
      let st = this.db.staff.find(s => s.name === n && s.is_active);
      if (!st) { st = this.insertStaff(n, 'admin', true); }
      const salt = newToken();
      Object.assign(st, { role: 'admin', pin_salt: salt, pin_hash: this.hashPin(salt, pin), failed_count: 0, locked_until: null, updated_at: this.now() });
      this.audit('system', null, null, 'setup_admin', null, { staff_id: st.id, name: n });
      return st;
    }
    insertStaff(name, role, active) {
      if (!name || !String(name).trim()) throw err('名前を入れてください');
      if (active && this.db.staff.some(s => s.is_active && s.name === name)) throw new ApiError('__unique__');
      const ts = this.now();
      const st = { id: this.nextId('staff'), name, role, pin_salt: null, pin_hash: null, is_active: active, failed_count: 0,
        locked_until: null, created_at: ts, updated_at: ts };
      this.db.staff.push(st);
      return st;
    }
    currentPeriodId(cid) {
      const k = this.openContract(cid); if (!k) return null;
      const p = this.openPeriod(k.id); return p ? p.id : null;
    }

    // v3までの記録を、時間（30/60/90分）と複数の束にまたがる消化に対応した形に直す
    migrate() {
      const db = this.db;
      if ((db.version || 0) >= 4) return false;
      for (const e of db.events) {
        if (e.minutes == null) { e.minutes = 60; e.amount = e.kind === 'cancel_free' ? 0 : 1; }
        if (e.ledger_id != null) { const g = db.ledger.find(x => x.id === e.ledger_id); if (g) g.event_id = e.id; }
        if (e.void_ledger_id != null) { const g = db.ledger.find(x => x.id === e.void_ledger_id); if (g) g.event_id = e.id; }
        delete e.ledger_id; delete e.void_ledger_id;
      }
      for (const g of db.ledger) if (g.event_id === undefined) g.event_id = null;
      db.version = 4;
      return true;
    }

    // ---------------- スナップショット（失敗した処理は丸ごと取り消す） ----------------
    snapshot() { return JSON.stringify(this.db); }
    restore(s) { this.db = JSON.parse(s); }

    call(fn, args) {
      const f = API[fn];
      if (!f) throw err(`不明なAPIです：${fn}`);
      const snap = this.snapshot();
      this._tx = null;
      this._tx = this.now();
      try { return clone(f.call(this, args || {})); }
      catch (e) {
        this.restore(snap);
        if (e instanceof ApiError) throw e;
        throw err(e && e.message ? e.message : String(e));
      } finally { this._tx = null; }
    }
  }

  // =================================================================
  // API（SQL の public.api_* と同じ名前・同じ引数・同じ結果）
  // =================================================================
  const API = {
    api_bootstrap() {
      const plans = this.db.plans.filter(p => p.is_active && p.kind === 'monthly')
        .sort((a, b) => a.sort_order - b.sort_order || a.id - b.id).map(p => this.planJson(p.id));
      return {
        today: this.today(),
        stores: this.db.stores.filter(s => s.is_active).sort((a, b) => a.sort_order - b.sort_order || a.id - b.id).map(s => ({ id: s.id, name: s.name })),
        staff: this.db.staff.filter(s => s.is_active && s.pin_hash != null).sort((a, b) => a.id - b.id).map(s => ({ id: s.id, name: s.name })),
        plans,
      };
    },

    api_customer_login({ p_store_id, p_name, p_birth_date }) {
      const ip = this.clientIp(), now = this.realNow();
      const fails = this.db.attempts.filter(a => a.kind === 'customer' && a.ip === ip && !a.success && a.at > now - 600000).length;
      if (fails >= 20) return { ok: false, message: '入力の間違いが続いたため、10分ほどたってからもう一度お試しください' };
      if (p_store_id == null || p_birth_date == null || normName(p_name) === '') {
        return { ok: false, message: '店舗・お名前・生年月日をすべて入れてください' };
      }
      const nk = normName(p_name), kk = normKana(p_name);
      const ids = this.db.customers.filter(c => c.store_id === p_store_id && c.birth_date === p_birth_date &&
        (c.name_key === nk || c.kana_key === kk)).map(c => c.id);
      if (ids.length !== 1) {
        this.db.attempts.push({ id: this.nextId('attempts'), kind: 'customer', ip, subject: String(p_store_id), success: false, at: now });
        if (ids.length > 1) return { ok: false, message: '同じお名前・生年月日の方が複数いらっしゃいます。店舗スタッフにお声がけください' };
        return { ok: false, message: '一致するお客様が見つかりませんでした。店舗・お名前・生年月日をご確認ください' };
      }
      this.db.attempts.push({ id: this.nextId('attempts'), kind: 'customer', ip, subject: String(p_store_id), success: true, at: now });
      return { ok: true, role: 'customer', token: this.issueToken('customer', ids[0], null) };
    },

    api_staff_login({ p_staff_id, p_pin }) {
      const ip = this.clientIp(), now = this.realNow();
      const fails = this.db.attempts.filter(a => a.kind === 'staff' && a.ip === ip && !a.success && a.at > now - 600000).length;
      if (fails >= 30) return { ok: false, message: '間違いが続いたため、10分ほどたってからもう一度お試しください' };
      const st = this.db.staff.find(s => s.id === p_staff_id && s.is_active);
      if (!st || st.pin_hash == null) {
        this.db.attempts.push({ id: this.nextId('attempts'), kind: 'staff', ip, subject: p_staff_id == null ? '' : String(p_staff_id), success: false, at: now });
        return { ok: false, message: '名前か暗証番号が違います' };
      }
      if (st.failed_count >= 10) return { ok: false, message: 'ロックされています。管理者に解除を頼んでください' };
      if (st.locked_until != null && st.locked_until > now) {
        return { ok: false, message: 'ロック中です。あと' + Math.ceil((st.locked_until - now) / 60000) + '分待ってください' };
      }
      if (p_pin == null || this.hashPin(st.pin_salt, p_pin) !== st.pin_hash) {
        const n = st.failed_count + 1;
        st.failed_count = n;
        if (n >= 5) st.locked_until = now + 30 * 60000;
        this.db.attempts.push({ id: this.nextId('attempts'), kind: 'staff', ip, subject: String(st.id), success: false, at: now });
        return { ok: false, message: n >= 10 ? 'ロックしました。管理者に解除を頼んでください'
          : n >= 5 ? '5回続けて間違えたため、30分ロックしました' : `名前か暗証番号が違います（あと${5 - n}回でロック）` };
      }
      st.failed_count = 0; st.locked_until = null;
      this.db.attempts.push({ id: this.nextId('attempts'), kind: 'staff', ip, subject: String(st.id), success: true, at: now });
      return { ok: true, role: st.role, token: this.issueToken('staff', null, st.id), staff: { id: st.id, name: st.name, role: st.role } };
    },

    api_logout({ p_token }) {
      const h = hashText(p_token == null ? '' : p_token);
      for (const s of this.db.sessions) if (s.token_hash === h && s.revoked_at == null) s.revoked_at = this.realNow();
      return { ok: true };
    },

    api_me({ p_token }) {
      const ctx = this.auth(p_token, 'any');
      if (ctx.kind === 'customer') return { role: 'customer', name: this.cust(ctx.customer_id).name };
      return { role: ctx.role, staff: { id: ctx.staff_id, name: ctx.staff_name, role: ctx.role } };
    },

    api_customer_home({ p_token }) {
      const ctx = this.auth(p_token, 'customer');
      this.ensureCurrent(ctx.customer_id);
      return this.customerSummary(ctx.customer_id, false);
    },

    api_customer_history({ p_token }) {
      const ctx = this.auth(p_token, 'customer');
      this.ensureCurrent(ctx.customer_id);
      return { periods: this.history(ctx.customer_id, 'customer', null) };
    },

    api_search_customers({ p_token, p_store_id = null, p_query = '' }) {
      this.auth(p_token, 'staff');
      const q = normName(p_query), qk = normKana(p_query);
      const hits = this.db.customers.filter(c => (p_store_id == null || c.store_id === p_store_id) &&
        (q === '' || c.name_key.includes(q) || c.kana_key.includes(qk)));
      hits.sort((a, b) => (a.kana_key < b.kana_key ? -1 : a.kana_key > b.kana_key ? 1 : a.id - b.id));
      const ids = hits.slice(0, 100).map(c => c.id);
      const t = this.today();
      const due = new Set();
      for (const id of ids) {
        const k = this.openContract(id); if (!k) continue;
        const p = this.openPeriod(k.id); if (p && p.end_date <= t) due.add(id);
      }
      for (const id of [...due].sort((a, b) => a - b)) this.ensureCurrent(id);
      return {
        customers: ids.map(id => {
          const c = this.cust(id), k = this.openContract(id), p = k ? this.openPeriod(k.id) : null;
          return { id: c.id, name: c.name, name_kana: c.name_kana, store: this.db.stores.find(s => s.id === c.store_id).name,
            plan: p ? this.plan(p.plan_id).name : null, status: p ? p.status : 'ended',
            available: this.totalBalance(id), next_renewal: p ? p.end_date : null };
        }),
      };
    },

    api_customer_detail({ p_token, p_customer_id }) {
      const ctx = this.auth(p_token, 'staff');
      this.ensureCurrent(p_customer_id);
      return Object.assign(this.customerSummary(p_customer_id, true), {
        history: this.history(p_customer_id, ctx.role, ctx.staff_id),
        changes: this.contractChanges(p_customer_id),
        viewer: { role: ctx.role, staff_id: ctx.staff_id },
      });
    },

    // セッション登録：p_minutes は 30・60・90（60分＝1回）
    api_register_session({ p_token, p_customer_id, p_kind, p_minutes = 60, p_note = null, p_request_id = null }) {
      const ctx = this.auth(p_token, 'staff');
      if (p_kind == null || !['session', 'cancel_consume', 'cancel_free'].includes(p_kind)) throw err('登録の種類を選んでください');
      const minutes = p_minutes == null ? 60 : Number(p_minutes);
      if (![30, 60, 90].includes(minutes)) throw err('時間は30分・60分・90分から選んでください');
      this.ensureCurrent(p_customer_id);
      const prev = this.priorResult(p_request_id);
      if (prev) return prev;
      const periodId = this.currentPeriodId(p_customer_id);
      const before = this.totalBalance(p_customer_id);
      const uses = p_kind !== 'cancel_free';
      const amount = uses ? minutes / 60 : 0;
      let used = [];
      let plan = [];
      if (uses) {
        const r = this.consumePlan(p_customer_id, amount);
        if (r.short > 0) {
          throw err(`チケットが足りません（残り${fmtN(before)}回、必要${fmtN(amount)}回）。管理者にチケットの付与を頼んでください`);
        }
        plan = r.plan;
        used = plan.map(x => ({ lot_type: x.lot_type, qty: x.qty }));
      }
      const eid = this.nextId('events');
      for (const x of plan) this.ledgerAdd(p_customer_id, x.lot_id, 'consume', -x.qty, ctx.staff_id, p_kind, p_note, periodId, null, null, eid);
      this.db.events.push({ id: eid, customer_id: p_customer_id, period_id: periodId, kind: p_kind, minutes, amount,
        occurred_at: this.now(), staff_id: ctx.staff_id, note: trimOrNull(p_note),
        voided_at: null, voided_by: null, void_reason: null });
      const after = this.totalBalance(p_customer_id);
      this.audit(ctx.role, ctx.staff_id, p_customer_id, 'session_' + p_kind, after - before,
        { event_id: eid, minutes, used, before, after, note: trimOrNull(p_note), request_id: p_request_id });
      return this.saveResult(p_request_id, 'register_session', p_customer_id, ctx.staff_id,
        { ok: true, event_id: eid, kind: p_kind, minutes, amount, used, before, after });
    },

    // 登録前の確認：どの束から何回使うか（記録はしない）
    api_preview_session({ p_token, p_customer_id, p_minutes = 60 }) {
      this.auth(p_token, 'staff');
      this.ensureCurrent(p_customer_id);
      const amount = Number(p_minutes) / 60;
      const { plan, short } = this.consumePlan(p_customer_id, amount);
      return { amount, before: this.totalBalance(p_customer_id), short, used: plan.map(x => ({ lot_type: x.lot_type, qty: x.qty })) };
    },

    api_void_event({ p_token, p_event_id, p_reason, p_request_id = null }) {
      const ctx = this.auth(p_token, 'staff');
      if (trimOrNull(p_reason) == null) throw err('取消の理由を選んでください');
      let e = this.db.events.find(x => x.id === p_event_id);
      if (!e) throw err('記録が見つかりません');
      this.ensureCurrent(e.customer_id);
      const prev = this.priorResult(p_request_id);
      if (prev) return prev;
      e = this.db.events.find(x => x.id === p_event_id);
      if (e.voided_at != null) throw err('この記録はすでに取り消されています');
      const before = this.totalBalance(e.customer_id);
      const gs = this.db.ledger.filter(g => g.event_id === e.id && g.entry_type === 'consume');
      if (gs.some(g => !this.lotUsableOn(g.lot_id, this.today()))) {
        throw err('このチケットは有効期間が終わっているため取り消せません。管理者が回数を調整してください');
      }
      for (const g of gs) this.ledgerAdd(e.customer_id, g.lot_id, 'void', -g.qty, ctx.staff_id, 'void', p_reason, e.period_id, null, null, e.id);
      Object.assign(e, { voided_at: this.now(), voided_by: ctx.staff_id, void_reason: String(p_reason).trim() });
      const after = this.totalBalance(e.customer_id);
      this.audit(ctx.role, ctx.staff_id, e.customer_id, 'session_voided', after - before,
        { event_id: e.id, kind: e.kind, minutes: e.minutes, reason: String(p_reason).trim(), before, after });
      return this.saveResult(p_request_id, 'void_event', e.customer_id, ctx.staff_id, { ok: true, event_id: e.id, before, after });
    },

    api_create_customer({ p_token, p_data }) {
      const ctx = this.auth(p_token, 'staff');
      const d = p_data || {};
      const storeId = intOrNull(d.store_id);
      if (!this.db.stores.some(s => s.id === storeId && s.is_active)) throw err('店舗を選んでください');
      if (normName(d.name) === '') throw err('お名前を入れてください');
      if (normName(d.name_kana) === '') throw err('ふりがなを入れてください');
      const birth = trimOrNull(str(d.birth_date));
      if (birth == null || birth >= this.today()) throw err('生年月日を選んでください');
      const start = trimOrNull(str(d.start_date)) || this.today();
      const day = intOrNull(d.renewal_day) != null ? intOrNull(d.renewal_day) : +start.slice(8, 10);
      const plan = this.db.plans.find(p => p.id === intOrNull(d.plan_id) && p.kind === 'monthly' && p.is_active);
      if (!plan) throw err('プランを選んでください');
      const nk = normName(d.name), kk = normKana(d.name_kana);
      if (this.db.customers.some(c => c.store_id === storeId && c.name_key === nk && c.birth_date === birth)) {
        throw err('同じ店舗に、同じお名前・生年月日の方がすでに登録されています');
      }
      const ts = this.now();
      const id = this.nextId('customers');
      this.db.customers.push({ id, store_id: storeId, name: String(d.name).trim(), name_kana: String(d.name_kana).trim(),
        name_key: nk, kana_key: kk, birth_date: birth, note: trimOrNull(d.note), created_at: ts, created_by: ctx.staff_id, updated_at: ts });
      const batch = uuid();
      this.startContract(id, plan.id, start, day, ctx.staff_id, batch);
      const periodId = this.currentPeriodId(id);
      const mig = d.migrate || {};
      const mr = numOrNull(mig.monthly_remaining);
      const cr = numOrNull(mig.carryover) || 0;
      const ur = numOrNull(mig.unlimited) || 0;
      if (mr != null && (!isHalf(mr) || mr < 0 || mr > 99)) throw err('当月分の残りは0〜99（0.5回単位）で入れてください');
      if (!isHalf(cr) || !isHalf(ur) || cr < 0 || cr > 99 || ur < 0 || ur > 99) throw err('残数は0〜99（0.5回単位）で入れてください');
      if (mr != null && mr !== plan.sessions) {
        const lot = this.db.lots.find(l => l.period_id === periodId && l.lot_type === 'monthly');
        if (!lot) {
          const lid = this.newLot(id, 'monthly', periodId, start, null, null, ctx.staff_id);
          this.ledgerAdd(id, lid, 'grant', mr, ctx.staff_id, 'migration', '移行時の当月分', periodId, batch);
        } else {
          this.ledgerAdd(id, lot.id, 'adjust', mr - plan.sessions, ctx.staff_id, 'migration', '移行前に利用済みの分', periodId, batch);
        }
      }
      if (cr > 0) {
        const lid = this.newLot(id, 'carryover', periodId, start, null, null, ctx.staff_id);
        this.ledgerAdd(id, lid, 'grant', cr, ctx.staff_id, 'migration', '移行時の前月繰越', periodId, batch);
      }
      if (ur > 0) {
        const lid = this.newLot(id, 'unlimited', null, this.today(), null, null, ctx.staff_id);
        this.ledgerAdd(id, lid, 'grant', ur, ctx.staff_id, 'migration', '移行時の無期限チケット', periodId, batch);
      }
      this.audit(ctx.role, ctx.staff_id, id, 'customer_created', this.totalBalance(id),
        { name: String(d.name).trim(), plan: plan.name, start_date: start, renewal_day: day, migrate: clone(mig) });
      return { ok: true, customer_id: id };
    },

    api_update_customer({ p_token, p_customer_id, p_data }) {
      const ctx = this.auth(p_token, 'staff');
      const o = this.cust(p_customer_id);
      if (!o) throw err('お客様が見つかりません');
      const d = p_data || {}, n = Object.assign({}, o);
      if ('store_id' in d) {
        if (!this.db.stores.some(s => s.id === intOrNull(d.store_id))) throw err('店舗を選んでください');
        n.store_id = intOrNull(d.store_id);
      }
      if ('name' in d) { if (normName(d.name) === '') throw err('お名前を入れてください'); n.name = String(d.name).trim(); n.name_key = normName(n.name); }
      if ('name_kana' in d) { if (normName(d.name_kana) === '') throw err('ふりがなを入れてください'); n.name_kana = String(d.name_kana).trim(); n.kana_key = normKana(n.name_kana); }
      if ('birth_date' in d) {
        n.birth_date = trimOrNull(str(d.birth_date));
        if (n.birth_date == null || n.birth_date >= this.today()) throw err('生年月日を選んでください');
      }
      if ('note' in d) n.note = trimOrNull(d.note);
      if (this.db.customers.some(c => c.id !== o.id && c.store_id === n.store_id && c.name_key === n.name_key && c.birth_date === n.birth_date)) {
        throw err('同じ店舗に、同じお名前・生年月日の方がすでに登録されています');
      }
      const before = { store_id: o.store_id, name: o.name, name_kana: o.name_kana, birth_date: o.birth_date, note: o.note };
      Object.assign(o, { store_id: n.store_id, name: n.name, name_key: n.name_key, name_kana: n.name_kana, kana_key: n.kana_key,
        birth_date: n.birth_date, note: n.note, updated_at: this.now() });
      this.audit(ctx.role, ctx.staff_id, o.id, 'customer_updated', null, { before,
        after: { store_id: n.store_id, name: n.name, name_kana: n.name_kana, birth_date: n.birth_date, note: n.note } });
      return { ok: true };
    },

    api_start_contract({ p_token, p_customer_id, p_plan_id, p_start_date = null, p_renewal_day = null }) {
      const ctx = this.auth(p_token, 'staff');
      this.ensureCurrent(p_customer_id);
      const start = p_start_date || this.today();
      const day = p_renewal_day != null ? p_renewal_day : +start.slice(8, 10);
      const k = this.startContract(p_customer_id, p_plan_id, start, day, ctx.staff_id, uuid());
      const plan = this.plan(p_plan_id);
      this.audit(ctx.role, ctx.staff_id, p_customer_id, 'contract_started', null,
        { plan: plan ? plan.name : null, start_date: start, renewal_day: day });
      return { ok: true, contract_id: k };
    },

    api_change_plan({ p_token, p_customer_id, p_plan_id, p_timing = 'next', p_reason = null }) {
      const ctx = this.auth(p_token, 'staff');
      this.ensureCurrent(p_customer_id);
      const c = this.openContract(p_customer_id);
      if (!c) throw err('契約中の契約がありません');
      const p = this.openPeriod(c.id);
      const oldPlan = this.plan(p.plan_id);
      const np = this.db.plans.find(x => x.id === p_plan_id && x.kind === 'monthly' && x.is_active);
      if (!np) throw err('プランを選んでください');
      const timing = p_timing == null ? 'next' : p_timing;
      if (timing === 'next') {
        c.pending_plan_id = np.id === p.plan_id ? null : np.id;
        c.updated_at = this.now();
        this.audit(ctx.role, ctx.staff_id, p_customer_id, 'plan_change_scheduled', null,
          { from: oldPlan.name, to: np.name, effective: p.end_date, reason: p_reason });
        return { ok: true, effective: p.end_date };
      }
      if (timing === 'now') {
        if (np.id === p.plan_id) throw err('今と同じプランです');
        const granted = p.sessions_granted;
        Object.assign(p, { plan_id: np.id, carryover_max: np.carryover_max, sessions_granted: p.status === 'active' ? np.sessions : 0 });
        let delta = 0;
        if (p.status === 'active') {
          const lot = this.db.lots.find(l => l.period_id === p.id && l.lot_type === 'monthly');
          if (!lot) {
            if (np.sessions > 0) {
              const lid = this.newLot(p_customer_id, 'monthly', p.id, this.today(), null, null, ctx.staff_id);
              this.ledgerAdd(p_customer_id, lid, 'grant', np.sessions, ctx.staff_id, 'plan_change', p_reason, p.id);
              delta = np.sessions;
            }
          } else {
            const bal = this.lotBalance(lot.id);
            delta = Math.max(np.sessions - granted, -bal);
            if (delta !== 0) this.ledgerAdd(p_customer_id, lot.id, 'plan_change', delta, ctx.staff_id, 'plan_change', p_reason, p.id);
          }
        }
        c.pending_plan_id = null; c.updated_at = this.now();
        this.audit(ctx.role, ctx.staff_id, p_customer_id, 'plan_changed_now', delta, { from: oldPlan.name, to: np.name, delta, reason: p_reason });
        return { ok: true, delta };
      }
      throw err('変更のタイミングを選んでください');
    },

    api_change_renewal_day({ p_token, p_customer_id, p_day, p_reason = null }) {
      const ctx = this.auth(p_token, 'staff');
      if (p_day == null || p_day < 1 || p_day > 31) throw err('更新日は1〜31日から選んでください');
      this.ensureCurrent(p_customer_id);
      const c = this.openContract(p_customer_id);
      if (!c) throw err('契約中の契約がありません');
      if (c.renewal_day === p_day) throw err('今と同じ更新日です');
      const p = this.openPeriod(c.id);
      const before = p.end_date, nd = D.renewalOnOrAfter(p.end_date, p_day);
      p.end_date = nd;
      const fromDay = c.renewal_day;
      c.renewal_day = p_day; c.updated_at = this.now();
      this.audit(ctx.role, ctx.staff_id, p_customer_id, 'renewal_day_changed', null,
        { from_day: fromDay, to_day: p_day, next_renewal_before: before, next_renewal_after: nd, reason: p_reason });
      return { ok: true, next_renewal: nd };
    },

    api_change_status({ p_token, p_customer_id, p_action, p_timing = 'next', p_reason = null }) {
      const ctx = this.auth(p_token, 'staff');
      this.ensureCurrent(p_customer_id);
      const c = this.openContract(p_customer_id);
      if (!c) throw err('契約中の契約がありません');
      const p = this.openPeriod(c.id);
      const timing = p_timing == null ? 'next' : p_timing;
      if (p_action === 'cancel_pending') {
        const pp = c.pending_plan_id != null ? this.plan(c.pending_plan_id).name : null, ps = c.pending_status || null;
        c.pending_plan_id = null; c.pending_status = null; c.updated_at = this.now();
        this.audit(ctx.role, ctx.staff_id, p_customer_id, 'pending_cancelled', null, { plan: pp, status: ps });
        return { ok: true };
      }
      if (p_action === 'pause') {
        if (p.status === 'paused' && c.pending_status == null) throw err('すでに休会中です');
        c.pending_status = p.status === 'paused' ? null : 'paused'; c.updated_at = this.now();
        this.audit(ctx.role, ctx.staff_id, p_customer_id, 'status_scheduled', null, { status: 'paused', effective: p.end_date, reason: p_reason });
        return { ok: true, effective: p.end_date };
      }
      if (p_action === 'resume') {
        if (p.status === 'active') {
          if (['paused', 'ended'].includes(c.pending_status)) {
            const ps = c.pending_status;
            c.pending_status = null; c.updated_at = this.now();
            this.audit(ctx.role, ctx.staff_id, p_customer_id, 'pending_cancelled', null, { status: ps, reason: p_reason });
            return { ok: true };
          }
          throw err('休会中ではありません');
        }
        if (timing === 'next') {
          c.pending_status = 'active'; c.updated_at = this.now();
          this.audit(ctx.role, ctx.staff_id, p_customer_id, 'status_scheduled', null, { status: 'active', effective: p.end_date, reason: p_reason });
          return { ok: true, effective: p.end_date };
        }
        const plan = this.plan(c.pending_plan_id != null ? c.pending_plan_id : p.plan_id);
        Object.assign(p, { status: 'active', plan_id: plan.id, carryover_max: plan.carryover_max, sessions_granted: plan.sessions });
        if (plan.sessions > 0) {
          const lot = this.db.lots.find(l => l.period_id === p.id && l.lot_type === 'monthly');
          const batch = uuid();
          if (!lot) {
            const lid = this.newLot(p_customer_id, 'monthly', p.id, this.today(), null, null, ctx.staff_id);
            this.ledgerAdd(p_customer_id, lid, 'grant', plan.sessions, ctx.staff_id, 'resume', p_reason, p.id, batch);
          } else {
            this.ledgerAdd(p_customer_id, lot.id, 'adjust', plan.sessions, ctx.staff_id, 'resume', p_reason, p.id, batch);
          }
        }
        c.pending_status = null; c.pending_plan_id = null; c.updated_at = this.now();
        this.audit(ctx.role, ctx.staff_id, p_customer_id, 'status_changed_now', plan.sessions,
          { status: 'active', plan: plan.name, granted: plan.sessions, reason: p_reason });
        return { ok: true };
      }
      if (p_action === 'withdraw') {
        if (timing === 'next') {
          c.pending_status = 'ended'; c.updated_at = this.now();
          this.audit(ctx.role, ctx.staff_id, p_customer_id, 'status_scheduled', null, { status: 'ended', effective: p.end_date, reason: p_reason });
          return { ok: true, effective: p.end_date };
        }
        let exp = 0;
        const batch = uuid();
        for (const l of this.db.lots.filter(x => x.period_id === p.id).sort((a, b) => a.id - b.id)) {
          const b = this.lotBalance(l.id);
          if (b > 0) { this.ledgerAdd(p_customer_id, l.id, 'expire', -b, ctx.staff_id, 'withdrawn', p_reason, p.id, batch); exp += b; }
        }
        const ts = this.now();
        for (const l of this.db.lots) if (l.period_id === p.id) l.closed_at = ts;
        p.closed_at = ts;
        Object.assign(c, { ended_on: this.today(), pending_plan_id: null, pending_status: null, updated_at: ts });
        this.audit(ctx.role, ctx.staff_id, p_customer_id, 'status_changed_now', -exp, { status: 'ended', expired: exp, reason: p_reason });
        return { ok: true, expired: exp };
      }
      throw err('操作を選んでください');
    },

    api_adjust_tickets({ p_token, p_customer_id, p_lot_type, p_qty, p_reason, p_note = null, p_request_id = null }) {
      const ctx = this.auth(p_token, 'staff');
      if (p_lot_type == null || !['monthly', 'carryover', 'unlimited'].includes(p_lot_type)) throw err('チケットの種類を選んでください');
      if (p_qty == null || p_qty === 0 || !isHalf(p_qty) || Math.abs(p_qty) > 20) throw err('増減は-20〜+20（0.5回単位）で選んでください');
      if (trimOrNull(p_reason) == null) throw err('理由を選んでください');
      this.ensureCurrent(p_customer_id);
      const prev = this.priorResult(p_request_id);
      if (prev) return prev;
      const periodId = this.currentPeriodId(p_customer_id);
      const before = this.totalBalance(p_customer_id);
      if (p_lot_type === 'unlimited') {
        if (p_qty > 0) {
          const lid = this.newLot(p_customer_id, 'unlimited', null, this.today(), null, null, ctx.staff_id);
          this.ledgerAdd(p_customer_id, lid, 'grant', p_qty, ctx.staff_id, p_reason, p_note, periodId);
        } else {
          if (this.balances(p_customer_id).unlimited < -p_qty) throw err('無期限チケットの残りより多くは減らせません');
          let left = -p_qty;
          for (const v of this.vLots(p_customer_id).filter(x => x.lot_type === 'unlimited' && x.closed_at == null && x.balance > 0).sort((a, b) => a.id - b.id)) {
            if (left === 0) break;
            const take = Math.min(left, v.balance);
            this.ledgerAdd(p_customer_id, v.id, 'adjust', -take, ctx.staff_id, p_reason, p_note, periodId);
            left -= take;
          }
        }
      } else {
        if (periodId == null) throw err('契約中の期間がないため、当月分・前月繰越は調整できません');
        const lot = this.db.lots.find(l => l.period_id === periodId && l.lot_type === p_lot_type);
        if (!lot) {
          if (p_qty < 0) throw err('減らせる回数がありません');
          const lid = this.newLot(p_customer_id, p_lot_type, periodId, this.period(periodId).start_date, null, null, ctx.staff_id);
