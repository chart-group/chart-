  // ------------------------------------------------------------------
  // 状態と画面の切り替え
  // ------------------------------------------------------------------
  const S = { boot: null, token: null, role: null, me: null, view: null, params: {}, stack: [] };
  const VIEWS = {};
  const WIDE = new Set(['sSearch', 'cDetail', 'aMenu', 'aStaff', 'aStores', 'aLog', 'aPlans', 'aNew']);
  let renderSeq = 0;

  function go(view, params = {}, { replace = false } = {}) {
    if (!replace && S.view) S.stack.push({ view: S.view, params: S.params });
    S.view = view; S.params = params;
    render({ top: true });
  }
  function back() {
    const p = S.stack.pop();
    if (p) { S.view = p.view; S.params = p.params; render({ top: true }); }
    else go('start', {}, { replace: true });
  }
  async function render({ top = false, quiet = false } = {}) {
    const seq = ++renderSeq;
    const root = document.getElementById('app');
    root.className = 'app' + (WIDE.has(S.view) ? ' wide' : '');
    const y = window.scrollY;
    if (!quiet) root.replaceChildren(loadingEl());
    try {
      const el = await VIEWS[S.view](S.params);
      if (seq !== renderSeq) return;
      root.replaceChildren(el);
      window.scrollTo(0, top ? 0 : y);
      rememberView();
    } catch (e) {
      if (seq !== renderSeq) return;
      if (!handleError(e)) root.replaceChildren(h('div', { class: 'loading' }, e.message || 'エラーが起きました',
        h('button', { class: 'btn small', type: 'button', onclick: () => render() }, 'もう一度読み込む')));
    }
  }
  const refresh = () => render({ quiet: true });
  function handleError(e) {
    if (e && e.hint === 'auth') {
      clearLogin();
      S.stack = [];
      toast(e.message || 'もう一度ログインしてください', { error: true });
      S.view = 'start'; S.params = {};
      render({ top: true });
      return true;
    }
    toast((e && e.message) || 'エラーが起きました', { error: true });
    return false;
  }
  // ログインは「お客様側」「従業員側」それぞれ覚えておき、次は前回の画面から始める
  const sideOf = role => (role === 'customer' ? 'customer' : 'staff');
  const SIDE_VIEWS = { customer: ['cHome', 'cHistory'], staff: ['sSearch', 'cDetail', 'aMenu', 'aStaff', 'aStores', 'aLog', 'aPlans'] };
  function setLogin(r, role, me) {
    S.token = r.token; S.role = role; S.me = me;
    const side = sideOf(role);
    keep.set('tok_' + side, r.token); keep.set('side', side);
  }
  function clearLogin() {
    if (S.role) { const side = sideOf(S.role); keep.set('tok_' + side, null); keep.set('last_' + side, null); }
    S.token = null; S.role = null; S.me = null;
  }
  function rememberView() {
    if (!S.token || !S.role) return;
    const side = sideOf(S.role);
    if (!SIDE_VIEWS[side].includes(S.view)) return;
    keep.set('last_' + side, JSON.stringify({ view: S.view, params: S.params || {} }));
    keep.set('side', side);
  }
  // 保存しているログインで、その側の前回の画面へ（なければログイン画面へ）
  async function enterSide(side, { silent = false } = {}) {
    const t = keep.get('tok_' + side);
    if (t) {
      try {
        const me = await api('api_me', { p_token: t });
        if (sideOf(me.role) === side) {
          S.token = t; S.role = me.role; S.me = me.role === 'customer' ? { name: me.name } : me.staff;
          let last = null;
          try { last = JSON.parse(keep.get('last_' + side) || 'null'); } catch (e) { last = null; }
          const v = last && SIDE_VIEWS[side].includes(last.view) ? last : { view: side === 'customer' ? 'cHome' : 'sSearch', params: {} };
          S.stack = [];
          keep.set('side', side);
          go(v.view, v.params || {}, { replace: true });
          return true;
        }
      } catch (e) { /* 期限切れなど：ログイン画面へ */ }
      keep.set('tok_' + side, null);
    }
    if (!silent) go(side === 'customer' ? 'cLogin' : 'sLogin');
    return false;
  }
  function toStart() { S.stack = []; S.view = null; go('start', {}, { replace: true }); }
  async function logout() {
    const t = S.token;
    clearLogin();
    S.stack = [];
    if (t) api('api_logout', { p_token: t }).catch(() => {});
    go('start', {}, { replace: true });
  }

  // お知らせ（予定の変更・休会・もうすぐ失効する回数）
  function notices(d, forStaff) {
    const out = [], c = d.contract, b = d.balances;
    const note = (text, cls = '') => h('div', { class: 'notice ' + cls }, h('span', { class: 'ic' }, '●'), h('span', null, text));
    if (c) {
      const p = c.pending || {};
      if (p.status === 'ended') out.push(note(`${jpd(c.next_renewal)}の更新日で退会になります。当月分と前月繰越はその日に失効します。`));
      else if (p.status === 'paused') out.push(note(`${jpd(c.next_renewal)}から休会になります。休会中は月額分の付与がお休みになります。`));
      else if (p.status === 'active') out.push(note(`${jpd(c.next_renewal)}から再開します。`, 'info'));
      if (p.plan && p.status !== 'ended') out.push(note(`${jpd(c.next_renewal)}の更新から${p.plan.name}プランになります。`, 'info'));
      if (c.status === 'paused' && !p.status) out.push(note('休会中です。前月繰越と無期限チケットは使えます。', 'info'));
      const lose = p.status === 'ended' ? 0 : b.carryover + Math.max(0, b.monthly - c.plan.carryover_max);
      if (lose > 0 && c.days_left <= 7) {
        out.push(note(`${jpd(D.add(c.next_renewal, -1))}までに使わないと、${N(lose)}回が失効します（当月分の残りは${c.plan.carryover_max}回まで翌月に繰越。前月繰越の残りは消えます）。`));
      }
    } else if (d.ended_contract) {
      out.push(note(b.unlimited > 0 ? `${jpd(d.ended_contract.ended_on)}に退会しました。無期限チケットは引き続き使えます。`
        : `${jpd(d.ended_contract.ended_on)}に退会しました。`, 'info'));

    if (forStaff && d.customer.note) out.push(note(`備考：${d.customer.note}`, 'info'));

  }

      if (isEvent) meta.push(hm(it.at));

        const r = await api('api_search_customers', { p_token: S.token, p_store_id: storeSel.value ? +storeSel.value : null, p_query: q.value });

        count.textContent = r.customers.length >= 100 ? '100人まで表示しています。名前で絞り込んでください' : `${r.customers.length}人`;
        list.replaceChildren(...(r.customers.length ? r.customers.map(custRow) : [h('div', { class: 'period' }, h('div', { class: 'empty' }, '見つかりませんでした'))]));
      } catch (e) { if (!handleError(e)) list.replaceChildren(); }
    }
    let t = null;
    q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 250); });
    storeSel.addEventListener('change', run);
    run();
    return h('div', null,
      staffBar(),
      h('div', { style: 'display:flex;justify-content:flex-end;margin-bottom:4px' },
        h('button', { class: 'btn small primary', type: 'button', onclick: () => go('aNew') }, '＋ 新規顧客登録')),
      h('div', { class: 'searchbar' }, storeSel, q),
      count, list);
  };
  function custRow(c) {
    const badge = c.status === 'paused' ? h('span', { class: 'badge paused' }, '休会中') : c.status === 'ended' ? h('span', { class: 'badge ended' }, '退会') : null;

  }

        !c && h('button', { class: 'btn', type: 'button', onclick: () => openRestart(d) }, h('span', null, '再入会', h('span', { class: 's' }, '新しく契約を始める'))),
        h('button', { class: 'btn', type: 'button', onclick: () => openAdjust(d) }, h('span', null, 'チケット付与・修正', h('span', { class: 's' }, '無期限の付与・回数の調整'))),
        h('button', { class: 'btn', type: 'button', onclick: () => openEdit(d) }, h('span', null, '顧客情報の編集', h('span', { class: 's' }, '店舗・名前・生年月日・備考'))),
        h('button', { class: 'btn', type: 'button', onclick: () => go('aLog', { customer_id: cu.id, customer: cu.name }) }, h('span', null, '操作ログ', h('span', { class: 's' }, 'この方への操作だけ'))))) : null;

    const changes = admin && d.changes && d.changes.length ? h('details', { class: 'more', style: 'margin-top:10px' },

  // セッション登録
  function openRegister(d) {
    const kinds = [
      { k: 'session', t: '通常セッション', s: '来店＋1・時間の分だけチケットを引く' },
      { k: 'cancel_consume', t: '当日キャンセル（チケットを消化する）', s: '来店は増えない・時間の分だけチケットを引く' },
      { k: 'cancel_free', t: 'キャンセル（チケットを消化しない）', s: 'チケットはそのまま・記録だけ残す' },
    ];
    sheet('セッション登録', (body, close) => {
      const step1 = () => {
        body.replaceChildren(
          h('p', { style: 'font-size:14px;color:var(--muted);margin-bottom:12px' }, `${d.customer.name} 様　利用可能 ${N(d.balances.total)}回`),
          ...kinds.map((x, i) => h('button', { class: 'choice' + (i === 0 ? ' main' : ''), type: 'button', onclick: () => step2(x) },
            h('span', { class: 't' }, x.t), h('span', { class: 'd' }, x.s), h('span', { class: 'e' }, '→'))));
      };
      const step2 = x => {
        const rid = uuid();
        const uses = x.k !== 'cancel_free';
        const before = d.balances.total;
        const minutes = select([30, 60, 90].map(m => ({ value: m, label: MIN_LABEL(m) })), keep.get('minutes') || 60);
        const afterEl = h('span', { class: 'num after' });
        const how = h('div', { class: 's' });
        const note = h('textarea', { class: 'textarea', placeholder: '例：当日の体調不良のため' });
        const msg = msgBox();
        const btn = h('button', { class: 'btn primary big block', type: 'button' }, '登録する');
        let seq = 0;
        const upd = async () => {
          if (!uses) { afterEl.textContent = N(before); how.textContent = '残りの回数は変わりません'; return; }
          const my = ++seq;
          try {
            const pv = await api('api_preview_session', { p_token: S.token, p_customer_id: d.customer.id, p_minutes: +minutes.value });
            if (my !== seq) return;
            if (pv.short > 0) {
              afterEl.textContent = '—'; btn.disabled = true;
              how.textContent = `チケットが足りません（残り${N(pv.before)}回）。時間を短くするか、管理者に付与を頼んでください`;
            } else {
              afterEl.textContent = N(pv.before - pv.amount); btn.disabled = false;
              how.textContent = pv.used.map(u => `${LOT[u.lot_type]}から${N(u.qty)}回`).join('・') + '使います';
            }
          } catch (e) { handleError(e); }
        };
        minutes.addEventListener('change', () => { keep.set('minutes', minutes.value); upd(); });
        btn.addEventListener('click', () => busy(btn, async () => {
          try {
            const r = await api('api_register_session', { p_token: S.token, p_customer_id: d.customer.id, p_kind: x.k,
              p_minutes: uses ? +minutes.value : 60, p_note: note.value || null, p_request_id: rid });
            close();
            await refresh();
            toast(uses ? `登録しました（${r.minutes}分）。残り${N(r.after)}回` : '登録しました（チケットはそのまま）', {
              action: { label: '取り消す', fn: () => undoEvent(r.event_id) },
            });
          } catch (e) { if (!handleError(e)) msg.show(e.message); }
        }));
        body.replaceChildren(
          h('div', { class: 'confirm-box' },
            h('div', { class: 'kind' }, x.t),
            h('div', { class: 's' }, `${d.customer.name} 様`),
            h('div', { class: 'flow' },
              h('span', { class: 'num' }, N(before)), h('span', { class: 'arr' }, '→'), afterEl, h('span', null, '回')),
            how),
          uses && h('div', { class: 'form', style: 'margin-top:12px' }, field('時間', minutes)),
          h('details', { class: 'more', style: 'margin-top:12px' }, h('summary', null, '備考を入れる（任意）'), h('div', { class: 'inner' }, note)),
          msg,
          h('div', { class: 'acts' }, btn, h('button', { class: 'btn ghost block', type: 'button', onclick: step1 }, '選び直す')));
        upd();
      };
      step1();
    });
  }
  async function undoEvent(eventId) {
    try {
      await api('api_void_event', { p_token: S.token, p_event_id: eventId, p_reason: '登録直後の取消', p_request_id: uuid() });
      await refresh();
      toast('取り消しました');
    } catch (e) { handleError(e); }
  }
  function openVoid(d, it) {
    sheet('登録の取消', (body, close) => {
      const reason = select([
        { value: '入力ミス（別のお客様）', label: '入力ミス（別のお客様だった）' },
        { value: '入力ミス（種類の間違い）', label: '入力ミス（登録の種類を間違えた）' },
        { value: '二重登録', label: '二重に登録してしまった' },
        { value: 'その他', label: 'その他' }], null, { placeholder: '理由を選んでください' });
      const msg = msgBox();
      const btn = h('button', { class: 'btn primary big block', type: 'button' }, '取り消す');
      btn.addEventListener('click', () => busy(btn, async () => {
        if (!reason.value) return msg.show('理由を選んでください');
        try {
          const r = await api('api_void_event', { p_token: S.token, p_event_id: it.event_id, p_reason: reason.value, p_request_id: uuid() });
          close(); await refresh();
          toast(`取り消しました。残り${N(r.after)}回`);
        } catch (e) { if (!handleError(e)) msg.show(e.message); }
      }));
      body.append(
        h('div', { class: 'preview' }, h('b', null, `${md(it.on)} ${KIND[it.type]}`), ` を取り消します。`,
          it.type !== 'cancel_free' ? `使ったチケット${N(-it.delta)}回（${(it.lot_types || [it.lot_type]).map(t => LOT[t]).join('・')}）が戻ります。` : '回数は変わりません。', '記録は「取消」として残ります。'),
        h('div', { class: 'form', style: 'margin-top:14px' }, field('理由', reason)), msg,
        h('div', { class: 'acts' }, btn));
    });
  }

  // ------------------------------------------------------------------
  // 管理者の操作
  // ------------------------------------------------------------------
  function planOptions(withPrice = true) {
    return S.boot.plans.map(p => ({ value: p.id, label: withPrice ? `${p.name}（${yen(p.price_yen)}・繰越${p.carryover_max}回まで）` : p.name }));
  }
  function simpleForm(body, close, { fields, preview, submitLabel, submit }) {
    const msg = msgBox();
    const pv = preview ? h('div', { class: 'preview' }) : null;
    const btn = h('button', { class: 'btn primary big block', type: 'button' }, submitLabel);
    const upd = () => { if (pv) { const t = preview(); pv.replaceChildren(...(Array.isArray(t) ? t : [t])); pv.hidden = !t; } };
    btn.addEventListener('click', () => busy(btn, async () => {
      try {
        const r = await submit(msg);
        if (r === false) return;
        close(); await refresh();
        if (typeof r === 'string') toast(r);
      } catch (e) { if (!handleError(e)) msg.show(e.message); }
    }));
    body.append(h('div', { class: 'form' }, fields, pv, msg), h('div', { class: 'acts' }, btn));
    body.addEventListener('change', upd); body.addEventListener('input', upd); upd();
  }

  function openPlanChange(d) {
    const c = d.contract;
    sheet('プラン変更', (body, close) => {
      const plan = select(planOptions(), c.pending.plan ? c.pending.plan.id : c.plan.id);
      const timing = select([{ value: 'next', label: `次回更新から（${mdw(c.next_renewal)}）` }, { value: 'now', label: '今日から（当月分を差分だけ増減）' }], 'next');
      const reason = h('input', { class: 'input', placeholder: '例：回数を減らしたい' });
      simpleForm(body, close, {
        fields: [field('新しいプラン', plan), field('変更のタイミング', timing, { hint: 'ふだんは「次回更新から」を使います' }), field('理由（任意）', reason)],
        preview: () => {
          const np = S.boot.plans.find(p => p.id === +plan.value);
          if (!np) return '';
          if (timing.value === 'next') {
            if (np.id === c.plan.id) return c.pending.plan ? `予約している${c.pending.plan.name}への変更を取り消します。` : '今と同じプランです。';
            return [h('b', null, `${jpd(c.next_renewal)}の更新から${np.name}`), `（毎月${np.sessions}回・繰越${np.carryover_max}回まで）になります。今の期間はそのままです。繰越の上限は今の${c.plan.name}で判定します。`];
          }
          if (np.id === c.plan.id) return '今と同じプランです。';
          if (c.status === 'paused') return `今日から${np.name}にします（休会中なので付与はありません）。`;
          const delta = Math.max(np.sessions - c.plan.sessions, -d.balances.monthly);
          return [h('b', null, `今日から${np.name}`), `。当月分を${signed(delta)}回調整します（${N(d.balances.monthly)} → ${N(d.balances.monthly + delta)}回）。残りより多くは減らしません。`];
        },
        submitLabel: '変更する',
        submit: async () => {
          const r = await api('api_change_plan', { p_token: S.token, p_customer_id: d.customer.id, p_plan_id: +plan.value, p_timing: timing.value, p_reason: reason.value || null });
          return timing.value === 'next' ? `${md(r.effective)}からの変更を予約しました` : 'プランを変更しました';
        },
      });
    });
  }

  function openRenewalDay(d) {
    const c = d.contract;
    sheet('更新日の変更', (body, close) => {
      const days = []; for (let i = 1; i <= 31; i++) days.push({ value: i, label: `毎月${i}日${i >= 29 ? '（ない月は月末）' : ''}` });
      const day = select(days, c.renewal_day);
      const reason = h('input', { class: 'input', placeholder: '例：引き落とし日の変更' });
      simpleForm(body, close, {
        fields: [field('新しい更新日', day), field('理由（任意）', reason)],
        preview: () => {
          const v = +day.value;
          if (v === c.renewal_day) return '今と同じ更新日です。';
          const nn = D.renewalOnOrAfter(c.next_renewal, v);
          const ext = D.diff(nn, c.next_renewal);
          return [h('b', null, `今の期間：${md(c.period.start)}〜${md(D.add(nn, -1))}（次回更新 ${mdw(nn)}）`),
            ext > 0 ? `。今の期間が${ext}日延び、前月繰越と当月分の期限も一緒に延びます。` : '。次回更新日は変わりません。',
            '期間を縮めることはしないので、二重付与や早すぎる失効は起きません。'];
        },
        submitLabel: '変更する',
        submit: async () => {
          const r = await api('api_change_renewal_day', { p_token: S.token, p_customer_id: d.customer.id, p_day: +day.value, p_reason: reason.value || null });
          return `更新日を変更しました（次回更新 ${md(r.next_renewal)}）`;
        },
      });
    });
  }

  function openStatus(d) {
    const c = d.contract, p = c.pending || {};
    const opts = [];
    if (p.status || p.plan) opts.push({ value: 'cancel_pending|next', label: '予定している変更を取り消す' });
    if (c.status === 'active') {
      if (p.status !== 'paused') opts.push({ value: 'pause|next', label: `休会する（${md(c.next_renewal)}から）` });
    } else {
      if (p.status !== 'active') opts.push({ value: 'resume|next', label: `再開する（${md(c.next_renewal)}から）` });
      opts.push({ value: 'resume|now', label: '再開する（今日から・月額分をすぐ付与）' });
    }
    if (p.status !== 'ended') opts.push({ value: 'withdraw|next', label: `退会する（${md(c.next_renewal)}の更新日で）` });
    opts.push({ value: 'withdraw|now', label: '退会する（今日で・当月分と繰越は失効）' });
    sheet('休会・再開・退会', (body, close) => {
      const act = select(opts, null, { placeholder: '操作を選んでください' });
      const reason = h('input', { class: 'input', placeholder: '例：出張のため' });
      simpleForm(body, close, {
        fields: [field('操作', act), field('理由（任意）', reason)],
        preview: () => {
          const [a, t] = (act.value || '|').split('|');
          const plan = (p.plan || c.plan);
          switch (`${a}|${t}`) {
            case 'cancel_pending|next': return '予約しているプラン変更・休会・再開・退会をすべて取り消します。';
            case 'pause|next': return `${jpd(c.next_renewal)}から休会します。休会中の期間は月額分を付与しません。前月繰越（最大${c.plan.carryover_max}回）と無期限チケットは使えます。`;
            case 'resume|next': return `${jpd(c.next_renewal)}から再開し、${plan.name}の月額分を付与します。`;
            case 'resume|now': return `今日から再開し、今の期間（〜${md(c.period.end)}）に${plan.name}の${plan.sessions}回をすぐ付与します。期間の長さを合わせたいときは、あわせて更新日を変更してください。`;
            case 'withdraw|next': return `${jpd(c.next_renewal)}の更新日で退会します。それまでは今の回数を使えます。当月分と前月繰越はその日に失効し、無期限チケットは残ります。`;
            case 'withdraw|now': return [h('b', null, '今日で退会します。'), `当月分${N(d.balances.monthly)}回と前月繰越${N(d.balances.carryover)}回はすぐ失効します。無期限チケット${N(d.balances.unlimited)}回は残ります。`];
            default: return '';
          }
        },
        submitLabel: '実行する',
        submit: async msg => {
          if (!act.value) { msg.show('操作を選んでください'); return false; }
          const [a, t] = act.value.split('|');
          await api('api_change_status', { p_token: S.token, p_customer_id: d.customer.id, p_action: a, p_timing: t, p_reason: reason.value || null });
          return a === 'cancel_pending' ? '予定を取り消しました' : t === 'next' ? `${md(c.next_renewal)}からの予定にしました` : '変更しました';
        },
      });
    });
  }

  function openRestart(d) {
    sheet('再入会（新しく契約を始める）', (body, close) => {
      const today = S.boot.today;
      const plan = select(planOptions(), null, { placeholder: 'プランを選んでください' });
      const start = startSelect(today);
      const day = renewalDaySelect(+today.slice(8, 10));
      start.addEventListener('change', () => { if (!day.dataset.touched) day.value = String(+start.value.slice(8, 10)); });
      day.addEventListener('change', () => { day.dataset.touched = '1'; });
      simpleForm(body, close, {
        fields: [field('プラン', plan), field('開始日', start), field('更新日', day)],
        preview: () => firstPeriodPreview(start.value, +day.value, S.boot.plans.find(p => p.id === +plan.value)),
        submitLabel: '契約を始める',
        submit: async msg => {
          if (!plan.value) { msg.show('プランを選んでください'); return false; }
          await api('api_start_contract', { p_token: S.token, p_customer_id: d.customer.id, p_plan_id: +plan.value, p_start_date: start.value, p_renewal_day: +day.value });
          return '契約を始めました';
        },
      });
    });
  }

  const ADJ_REASONS = ['キャンペーン', '紹介特典', '会社判断', 'お詫び対応', '入力ミスの修正', 'その他'];
  function openAdjust(d) {
    sheet('チケット付与・修正', (body, close) => {
      const types = [{ value: 'unlimited', label: '無期限チケット（期限なし）' }];

  // 開始日（今日から31日前まで）と更新日のプルダウン
  function startSelect(today) {
    const opts = [];
    for (let i = 0; i <= 31; i++) { const s = D.add(today, -i); opts.push({ value: s, label: i === 0 ? `今日（${mdw(s)}）` : mdw(s) }); }
    return select(opts, today);
  }
  function renewalDaySelect(v) {
    const days = []; for (let i = 1; i <= 31; i++) days.push({ value: i, label: `毎月${i}日${i >= 29 ? '（ない月は月末）' : ''}` });
    return select(days, v);
  }
  function firstPeriodPreview(start, day, plan) {
    if (!start || !day) return '';
    const end = D.nextRenewalAfter(start, day);
    if (end <= S.boot.today) return h('span', { style: 'color:var(--danger)' }, '開始日が古すぎます。今の期間の開始日（直近の更新日）を選んでください。');
    const len = D.diff(end, start);
    return [h('b', null, `初回の期間：${md(start)}〜${md(D.add(end, -1))}（${len}日間）`), `・次回更新 ${mdw(end)}`,
      plan ? `・${plan.name}の${plan.sessions}回を付与` : '', len < 20 ? '。初回の期間が短くなります。更新日を開始日と同じ日にすると1か月になります。' : ''];
  }

  function downloadBackup() {
    const blob = new Blob([backend.engine.snapshot()], { type: 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `chart-member-backup-${S.boot.today}.json` });

  function restoreBackup(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const db = JSON.parse(r.result);
        if (!db || !Array.isArray(db.stores) || !Array.isArray(db.ledger)) throw new Error();
        backend.engine.db = db; backend.save();
        clearLogin(); S.stack = []; S.boot = await api('api_bootstrap');

  // 操作ログ
  const ACTION = {

    session_voided: '登録の取消', tickets_adjusted: 'チケット付与・修正', customer_created: '顧客登録', customer_updated: '顧客情報の変更',
    contract_started: '再入会', plan_change_scheduled: 'プラン変更の予約', plan_changed_now: 'プラン変更（今日から）',
    renewal_day_changed: '更新日の変更', status_scheduled: '休会・再開・退会の予約', status_changed_now: '休会・再開・退会（今日から）',
    pending_cancelled: '予定の取り消し', renewal: '月額更新（自動）', contract_ended: '退会（自動）', renewal_error: '更新エラー',
    staff_created: '従業員の追加', staff_updated: '従業員の変更', staff_pin_set: '暗証番号の設定', store_saved: '店舗の保存',
    renewals_run: '更新処理の手動実行', setup_admin: '管理者の設定',
  };
  const LOG_GROUPS = {
    '': null,
    session: ['session_session', 'session_cancel_consume', 'session_cancel_free', 'session_voided'],
    tickets: ['tickets_adjusted'],
    contract: ['customer_created', 'customer_updated', 'contract_started', 'plan_change_scheduled', 'plan_changed_now', 'renewal_day_changed', 'status_scheduled', 'status_changed_now', 'pending_cancelled'],
    auto: ['renewal', 'contract_ended', 'renewal_error', 'renewals_run'],
    admin: ['staff_created', 'staff_updated', 'staff_pin_set', 'store_saved', 'setup_admin'],
  };
  const STATUS_JA = { paused: '休会', active: '再開', ended: '退会' };
  function auditSummary(action, x) {
    x = x || {};
    switch (action) {
      case 'session_session': case 'session_cancel_consume':
        return `${x.minutes ? `${x.minutes}分・` : ''}残り ${N(x.before)}→${N(x.after)}回（${(x.used || (x.lot_type ? [{ lot_type: x.lot_type }] : [])).map(u => LOT[u.lot_type]).join('・')}）${x.note ? `・${x.note}` : ''}`;
      case 'session_cancel_free': return `残りは変わらず ${N(x.after)}回${x.note ? `・${x.note}` : ''}`;
      case 'session_voided': return `${KIND[x.kind] || ''}${x.minutes && x.kind !== 'cancel_free' ? ` ${x.minutes}分` : ''}を取消・${x.reason || ''}・残り ${N(x.before)}→${N(x.after)}回`;
      case 'tickets_adjusted': return `${LOT[x.lot_type]} ${signed(x.qty)}（${x.reason}${x.note ? `・${x.note}` : ''}）残り ${N(x.before)}→${N(x.after)}回`;
      case 'customer_created': return `${x.name || ''}・${x.plan || ''}・開始 ${md(x.start_date)}・毎月${x.renewal_day}日更新`;
      case 'customer_updated': {
        const b = x.before || {}, a = x.after || {}, ch = [];
        if (b.name !== a.name) ch.push(`名前 ${b.name}→${a.name}`);
        if (b.name_kana !== a.name_kana) ch.push('ふりがな');
        if (b.birth_date !== a.birth_date) ch.push('生年月日');
        if (b.store_id !== a.store_id) ch.push('店舗');
        if (b.note !== a.note) ch.push('備考');
        return ch.join('・') + 'を変更';
      }
      case 'contract_started': return `${x.plan || ''}・開始 ${md(x.start_date)}・毎月${x.renewal_day}日更新`;
      case 'plan_change_scheduled': return `${x.from} → ${x.to}（${md(x.effective)}から）${x.reason ? `・${x.reason}` : ''}`;
      case 'plan_changed_now': return `${x.from} → ${x.to}（当月分 ${signed(x.delta)}）${x.reason ? `・${x.reason}` : ''}`;
      case 'renewal_day_changed': return `毎月${x.from_day}日 → ${x.to_day}日（次回更新 ${md(x.next_renewal_before)} → ${md(x.next_renewal_after)}）`;
      case 'status_scheduled': return `${md(x.effective)}から${STATUS_JA[x.status] || ''}${x.reason ? `・${x.reason}` : ''}`;
      case 'status_changed_now': return `今日から${STATUS_JA[x.status] || ''}${x.expired ? `・${x.expired}回失効` : ''}${x.granted ? `・${x.granted}回付与` : ''}${x.reason ? `・${x.reason}` : ''}`;
      case 'pending_cancelled': return '予定していた変更を取り消し';
      case 'renewal': return `${md(x.period_start)}更新・繰越${x.carried}・失効${x.expired}・付与${x.granted}（次回 ${md(x.next_renewal)}）`;
      case 'contract_ended': return `${md(x.ended_on)}で退会・${x.expired}回失効`;
      case 'renewal_error': return x.error || '';
      case 'staff_created': return `${x.name}（${x.role === 'admin' ? '管理者' : '従業員'}）`;
      case 'staff_updated': return `${(x.before || {}).name} → ${(x.after || {}).name}・${(x.after || {}).role === 'admin' ? '管理者' : '従業員'}・${(x.after || {}).is_active ? '有効' : '無効'}`;
      case 'staff_pin_set': return x.name || '';
      case 'store_saved': return `${x.name}${x.is_active === false ? '（非表示）' : ''}`;
      case 'renewals_run': return `${x.processed}人を処理`;
      case 'setup_admin': return x.name || '';
      default: return '';
    }
  }
  VIEWS.aLog = async (params) => {
    const group = select([{ value: 'session', label: 'セッション登録・取消' }, { value: 'tickets', label: 'チケット付与・修正' },
      { value: 'contract', label: '顧客・契約の変更' }, { value: 'auto', label: '自動更新' }, { value: 'admin', label: '従業員・店舗' }],
      params.group || '', { placeholder: 'すべての操作' });
    const who = select(S.boot.staff.map(s => ({ value: s.id, label: s.name })), params.staff_id || '', { placeholder: 'すべての人' });
    const list = h('div', { class: 'log' }, loadingEl());
    async function run() {
      params.group = group.value; params.staff_id = who.value;
      try {
        const r = await api('api_audit_log', { p_token: S.token, p_filters: { customer_id: params.customer_id || null, staff_id: who.value || null, limit: 300 } });
        const g = LOG_GROUPS[group.value];
        const rows = r.logs.filter(l => !g || g.includes(l.action));
        list.replaceChildren(...(rows.length ? rows.map(l => h('div', { class: 'logrow' },
          h('span', { class: 'a' }, ACTION[l.action] || l.action, l.qty ? ` ${signed(l.qty)}` : ''),
          h('span', { class: 't' }, `${md(D.jstDateOf(l.at))} ${hm(l.at)}`),
          h('span', { class: 'm' }, [l.actor, l.customer && `${l.customer}（${l.store}）`, auditSummary(l.action, l.detail)].filter(Boolean).join('・'))))
          : [h('div', { class: 'empty' }, '記録はありません')]));
      } catch (e) { handleError(e); }
    }
    group.addEventListener('change', run); who.addEventListener('change', run);
    run();
    return h('div', null, staffBar({ backable: true, title: params.customer ? `操作ログ：${params.customer}` : '操作ログ' }),
      h('div', { class: 'row2', style: 'margin-bottom:10px' }, group, who),
      h('p', { style: 'font-size:12px;color:var(--muted);margin-bottom:8px' }, '新しい順・最大300件。記録は削除できません。'),
      list);
  };

  // ------------------------------------------------------------------
  // 起動
  // ------------------------------------------------------------------
  async function start() {
    const root = document.getElementById('app');
    root.replaceChildren(loadingEl());
    backend = LIVE ? makeLive() : makeLocal();
    try {
      S.boot = await api('api_bootstrap');
    } catch (e) {
      root.replaceChildren(h('div', { class: 'start' },
        h('div', { class: 'start-mark' }, h('div', { class: 'wordmark' }, 'CHART ', h('b', null, 'MEMBER'))),
        h('div', { class: 'msg' }, `サーバーに接続できませんでした（${e.message}）。`),
        h('p', { style: 'font-size:13px;color:var(--muted)' }, 'ファイル先頭の SUPABASE_URL・SUPABASE_KEY と、セットアップSQLを実行したかを確かめてください。'),
        h('button', { class: 'btn', type: 'button', onclick: start }, 'もう一度つなぐ')));
      return;
    }
    // 前回ログインしていた側（お客様／従業員）の、前回の画面から始める
    const side = keep.get('side');
    if ((side === 'customer' || side === 'staff') && await enterSide(side, { silent: true })) return;
    go('start', {}, { replace: true });
  }
  start();
})();

</script>
