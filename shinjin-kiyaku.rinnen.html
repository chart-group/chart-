  --paper:#FFFFFF; --wash:#F6FBFB;
  --teal:#0ABAB5; --teal-l:#81D8D0; --teal-p:#E6F7F6; --teal-d:#04837F;
  --ink:#333333; --ink2:#55605F; --mute:#8A9695;
  --line:#E3EDEC; --line2:#CFE2E0;
  --warn:#B37E28; --warn-bg:#FDF7EC; --warn-line:#EFDCB8;
  --f-geo:"Avenir Next","Futura","Century Gothic","Avenir","Trebuchet MS",sans-serif;
  --f-round:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Maru Gothic Pro","Zen Maru Gothic","Hiragino Sans",sans-serif;
  --f-head:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",Meiryo,sans-serif;
  --sh:0 4px 18px rgba(51,51,51,.06);
  --sh2:0 12px 32px rgba(51,51,51,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--wash);color:var(--ink);font-family:var(--f-body);
  font-size:16px;line-height:1.9;letter-spacing:.014em;-webkit-font-smoothing:antialiased;
  padding-bottom:40px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.fic{background-repeat:no-repeat;background-position:bottom center;background-size:contain;
  mix-blend-mode:multiply;flex:none;display:inline-block}
.ic-hello{background-image:var(--m-hello)}
.ic-cheer{background-image:var(--m-cheer)}
.ic-hmm{background-image:var(--m-hmm)}
.ic-stop{background-image:var(--m-stop)}
.ic-bow{background-image:var(--m-bow)}

/* ---------- 共通パーツ ---------- */
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:var(--sh)}
.btn{display:block;width:100%;background:var(--teal);color:#fff;border:none;border-radius:14px;
  font-family:var(--f-round);font-size:16px;font-weight:700;letter-spacing:.04em;
  padding:16px;cursor:pointer;box-shadow:0 6px 18px rgba(10,186,181,.28);transition:opacity .15s}
.btn:disabled{background:var(--line2);color:#fff;box-shadow:none;cursor:not-allowed}
.btn.sub{background:var(--paper);color:var(--ink2);border:1.5px solid var(--line2);box-shadow:none;font-size:14px;padding:13px}
.btn.sub:hover{border-color:var(--teal);color:var(--teal-d)}
.lab{font-family:var(--f-round);font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--teal-d);text-transform:uppercase}
.mute{color:var(--mute);font-size:13px;line-height:1.8}

/* ---------- スタート ---------- */
.hd{background:linear-gradient(180deg,#FFF 0%,#FFF 44%,var(--teal-p) 100%);padding:30px 0 26px;border-bottom:1px solid var(--line)}
.brow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brow::before{content:"";flex:none;width:24px;height:3px;border-radius:3px;background:var(--teal)}
.brow span{font-family:var(--f-geo);font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--teal-d)}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(24px,6.4vw,32px);line-height:1.45;letter-spacing:.02em}
h1 em{position:relative;font-style:normal;z-index:0}
h1 em::after{content:"";position:absolute;left:-2px;right:-2px;bottom:.06em;height:.36em;background:var(--teal-l);opacity:.45;border-radius:3px;z-index:-1}
.hdrow{display:flex;align-items:flex-end;gap:14px;margin-top:12px}
.hdrow p{flex:1;min-width:0;font-size:14px;line-height:1.85;color:var(--ink2)}
.hdrow .fic{width:clamp(84px,22vw,124px);height:clamp(98px,26vw,144px);margin-bottom:-6px}

.rule{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--paper);border:1.5px solid var(--line2);border-radius:999px;
  font-family:var(--f-round);font-size:12.5px;font-weight:700;color:var(--ink2);padding:7px 14px}
.chip b{color:var(--teal-d)}
.sec-list{margin-top:14px;border-top:1.5px solid var(--line)}
.sec-list div{display:flex;justify-content:space-between;align-items:center;gap:12px;
  border-bottom:1.5px solid var(--line);padding:11px 2px;font-size:14px}
.sec-list span{font-family:var(--f-round);font-size:12px;color:var(--mute);white-space:nowrap}

.field{margin-top:16px}
.field label{display:block;font-family:var(--f-round);font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:7px;letter-spacing:.04em}
.field input,.field select{width:100%;background:var(--paper);color:var(--ink);border:1.5px solid var(--line2);
  border-radius:12px;padding:14px 15px;font-size:16px;font-family:var(--f-body);outline:none}
.field input:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(10,186,181,.15)}
.field input::placeholder{color:#B9C6C5}
.ex{font-family:var(--f-round);font-size:11.5px;color:var(--mute);margin-top:6px}

/* ---------- 出題 ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(246,251,251,.94);backdrop-filter:blur(6px);
  padding:12px 0 10px;border-bottom:1.5px solid var(--line)}
.bar .in{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--f-round);font-size:12px;color:var(--mute)}
.bar b{font-family:var(--f-geo);font-size:17px;color:var(--teal-d);letter-spacing:.02em}
.track{height:5px;background:var(--line);border-radius:99px;margin-top:9px;overflow:hidden}
.track i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .25s ease}

.qsec{font-family:var(--f-round);font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--mute);margin-bottom:7px}
.qtxt{font-family:var(--f-head);font-size:18px;font-weight:700;line-height:1.66;letter-spacing:.01em}
.opts{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:var(--paper);border:1.5px solid var(--line2);border-radius:14px;padding:14px 15px;
  font-family:var(--f-body);font-size:15px;line-height:1.72;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--teal-l)}
.opt em{flex:none;width:23px;height:23px;border-radius:50%;background:var(--wash);color:var(--ink2);
  font-family:var(--f-geo);font-size:12px;font-style:normal;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.opt.on{border-color:var(--teal);background:var(--teal-p)}
.opt.on em{background:var(--teal);color:#fff}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{flex:1}

/* ---------- 結果 ---------- */
.score{text-align:center;padding:8px 0 4px}
.score .pct{font-family:var(--f-geo);font-size:64px;font-weight:700;line-height:1;color:var(--teal-d);letter-spacing:-.02em}
.score .pct small{font-size:24px;margin-left:2px}
.score .cnt{font-family:var(--f-round);font-size:13px;color:var(--mute);margin-top:8px}
.verdict{display:flex;align-items:center;gap:14px;margin-top:18px;border-radius:16px;padding:16px 17px}
.verdict.ok{background:var(--teal-p)}
.verdict.ng{background:var(--warn-bg)}
.verdict .fic{width:66px;height:76px;margin-bottom:-4px}
.verdict h2{font-family:var(--f-head);font-size:19px;font-weight:700;line-height:1.5}
.verdict.ok h2{color:var(--teal-d)}
.verdict.ng h2{color:var(--warn)}
.verdict p{font-size:13px;line-height:1.75;color:var(--ink2);margin-top:3px}
.alert{display:flex;gap:12px;align-items:center;background:var(--warn-bg);border:1.5px solid var(--warn-line);
  border-radius:14px;padding:13px 15px;margin-top:14px}
.alert .fic{width:42px;height:48px}
.alert p{flex:1;min-width:0;font-size:13px;line-height:1.75;color:#8A7448}
.alert b{font-family:var(--f-round);color:var(--warn)}

.rv{margin-top:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);overflow:hidden}
.rv h3{font-family:var(--f-head);font-size:15px;padding:15px 16px 0}
.rvi{border-top:1.5px solid var(--line);padding:15px 16px;margin-top:13px}
.rvi:first-of-type{margin-top:13px}
.rvq{font-family:var(--f-head);font-size:15px;font-weight:700;line-height:1.66}
.rvq .no{font-family:var(--f-geo);color:var(--mute);margin-right:7px}
.rvl{font-family:var(--f-round);font-size:11px;font-weight:700;letter-spacing:.08em;margin:9px 0 2px}
.rvl.x{color:#C0736B}
.rvl.o{color:var(--teal-d)}
.rvt{font-size:14px;line-height:1.75;color:var(--ink2)}
.rve{font-size:13.5px;line-height:1.8;color:var(--ink2);background:var(--wash);border-radius:11px;padding:11px 13px;margin-top:10px}
.must{display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:999px;
  font-family:var(--f-round);font-size:10.5px;font-weight:700;padding:1px 9px;margin-left:7px;vertical-align:2px}
.rep{width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:13px 14px;
  font-size:13.5px;line-height:1.85;font-family:var(--f-body);background:var(--wash);color:var(--ink);
  resize:vertical;-webkit-user-select:text;user-select:text}
.rep:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(10,186,181,.15)}
.rvm{font-family:var(--f-round);font-size:12px;color:var(--mute);margin-top:9px;letter-spacing:.02em}
.rvm b{color:var(--teal-d)}
.ft{margin-top:22px;font-size:12.5px;line-height:1.9;color:var(--mute)}
.ft .fic{width:52px;height:60px;float:right;margin:0 0 4px 12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;font-family:var(--f-round);font-size:13px;padding:11px 20px;border-radius:999px;
  transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:600px){
  body{font-size:15.5px}
  .wrap{padding:0 15px}
  .qtxt{font-size:17px}
  .score .pct{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:3px;border-radius:5px}
</style>

<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 出題プール ============
   s: A=企業理念・心得 / B=就業規則・規程 / C=勤務ルール・店舗運営 / D=現場の最低限
   must: 安全・コンプライアンス上、落としたら現場に出せない問題              */
/* 新人研修OJTの並びに合わせたセクション */
const SECS={'1':'企業理念・社会人として','2':'就業規則・勤務ルール','3':'基礎業務','4':'技術','5':'新規体験'};
/* 安全・コンプライアンス（must）は毎回すべて出題し、残りをランダムで埋める */
const DRAW={'1':4,'2':5,'3':4,'4':2,'5':3};
const PASS=90;

const BANK=[{"s": "1","q": "企業精神9ヶ条は、何を測るための物差しか。","c": ["売上と数字","人格・行動・姿勢","勤続年数","保有資格"],"a": 1,"e": "9ヶ条は売上ではなく人格・行動・姿勢を測る物差し。正解がない場面で各自が判断するための共通のコンパスとして置かれている。","m": "企業理念"},{"s": "1","q": "売上を大きく出しているスタッフが規律違反をした。会社の立場は。","c": ["売上を出しているので大目に見る","数字が良い人ほど規律の適用は厳格にする","本人が認めれば不問","売上が落ちてから指摘する"],"a": 1,"e": "「規律を乱す者は不要」。売上を出していても例外にしない。1人の例外が組織全体の基準を下げる。","m": "企業理念"},{"s": "1","q": "「仕事漬けにならない」が9ヶ条に入っている理由は。","c": ["労働時間を短くして人件費を下げるため","仕事漬けの人間は自分のことしか考えられなくなるから","副業の時間を作るため","有給の消化率を上げるため"],"a": 1,"e": "プライベートの充実が新たな活力を産み、サービスを受ける側になって顧客の気持ちが分かる。遊びは業務品質の一部という位置づけ。","m": "企業理念"},{"s": "1","q": "「社員は会社の資産、私物化しない」で厳罰とされているのは。","c": ["風紀の乱れ・金の貸し借り・私用で部下を動かすこと","勤務中の私語","休憩中の外出","部下との食事"],"a": 0,"e": "上下関係があると断りにくさが生まれる。断れない相手に頼むことは頼みではなく指示になるため、厳罰とされている。","m": "企業理念"},{"s": "1","q": "お客様とプライベートで会ったり連絡を取ることについて。","c": ["本人同士が良ければ自由","禁止。必要な場合は上司の許可が必須で、無断が発覚したら懲戒","店長に事後報告すればよい","退会したお客様なら自由"],"a": 1,"e": "記録が残らないやり取りは、トラブル時にどちらも守れない。信頼の問題ではなく双方を守る仕組みの問題として運用されている。","m": "企業理念"},{"s": "1","q": "サプリメント販売などのマルチ商法が発覚した場合。","c": ["始末書","減給","一発懲戒免職","注意のみ"],"a": 2,"e": "会社・お客様・仲間の信頼を一瞬で壊すため。顧客やスタッフへの商品紹介は一切行わず、誘われた場合も断って上長に報告する。","m": "企業理念"},{"s": "1","q": "報連相のタイミングとして正しいものは。","c": ["完成してから見せる","2割と8割の段階で2回見せる","8割の段階で1回だけ見せる","聞かれたときに答える"],"a": 1,"e": "2割で方向性を確認できるのでやり直しのリスクが下がり、8割で最終調整ができる。報連相は監視ではなく防御の仕組み。","m": "企業理念"},{"s": "1","q": "「言わせない・聞かせない」とはどういう意味か。","c": ["上司やお客様に、聞かれる前に自分から報告する","余計なことを言わない","悪い情報は伏せておく","確定するまで報告しない"],"a": 0,"e": "事前対応の大変さ1に対して事後対応は100。同じ情報でも、誰が先に口に出すかで意味が反転する。","m": "企業理念"},{"s": "1","q": "新人が最初にやるべきこととして示されているのは。","c": ["入社90日以内に爪痕を残す","半年で売上100万を作る","1年は黙って言われたことをやる","3ヶ月以内に資格を取る"],"a": 0,"e": "最初に結果を出す人間が最後まで結果を出している。90日は能力の証明期間ではなく印象の形成期間で、後から変えるコストが極めて高い。","m": "企業理念"},{"s": "1","q": "「新人もプロ」と言われる理由は。","c": ["新人でも指名が付くから","お客様が払う料金は同じで、新人もベテランも関係ないから","研修に費用がかかっているから","資格を持っているから"],"a": 1,"e": "技術の未熟さは事実として存在するが、それを免罪符にしない。「まだ新人なので」を顧客の前で言わない。","m": "企業理念"},{"s": "1","q": "先輩にアドバイスを求めたときの正しい動き方は。","c": ["自分に合う形にアレンジして試す","まず言われた通りにやり、結果を報告する","複数の先輩に聞いて多数決で決める","やらずに様子を見る"],"a": 1,"e": "守破離の順番を飛ばさない。助言を求めることは相手の時間や労力を取っているということ。マスターした後にオリジナルがある。","m": "企業理念"},{"s": "1","q": "会社や店舗のやり方に意見があるとき、求められているのは。","c": ["不満を口に出さないこと","意見と一緒に代案を出すこと","SNSに書かないこと","上司にだけ伝えること"],"a": 1,"e": "評価される側なのに評論家にならない。ただし事実の報告は代案なしで歓迎される。異常をそのまま上げるのは別の話。","m": "企業理念"},{"s": "1","q": "ご馳走になったりプレゼントをもらったときの「3回お礼」とは。","c": ["その場・LINE・次回会った時","その場で3回言う","本人・上司・周囲の3方向に伝える","3日以内に3回連絡する"],"a": 0,"e": "3回目が最も効く。形式だけ守って中身がないと軽く見えるので、3回とも具体的に何が良かったかを添える。","m": "企業理念"},{"s": "1","q": "CHART BASICの「誠実」の定義として示されているのは。","c": ["お客様に優しく接すること","都合が悪くても事実を言うこと","ルールを守ること","約束の時間を守ること"],"a": 1,"e": "愛は相手の長期利益を取ること、規律は感情に判断を渡さないこと、誠実は都合が悪くても事実を言うこと。誠実は他の2つの前提条件。","m": "企業理念"},{"s": "1","q": "CHARTが最終的に売っているものは何か。","c": ["整体とトレーニングの技術","身体を通じて人生の選択肢を増やすこと","痩せるという結果","会員制の設備"],"a": 1,"e": "痛みが取れることも体型が変わることも、それ自体が目的ではない。それによって諦めていたことに戻れる、そこが最終的な価値。","m": "企業理念"},{"s": "2","q": "給与の締め日と支払日は。","c": ["15日締め・当月末払い","末日締め・翌月25日払い","末日締め・翌月10日払い","20日締め・翌月5日払い"],"a": 1,"e": "毎月末日締め、翌月25日払い。支払日が休日の場合は前営業日に支払われる。","m": "就業規則"},{"s": "2","q": "法定時間外労働（残業）の割増率は。","c": ["1.0倍","1.25倍","1.35倍","1.5倍"],"a": 1,"e": "時間外1.25／法定休日1.35／法定外の休日労働1.25。月30時間分は基本給に含まれ、超えた分が残業手当として支給される。","m": "就業規則"},{"s": "2","q": "深夜（22時〜翌5時）に働いた場合の割増は。","c": ["割増はない","0.25倍を加算する","1.25倍に置き換わる","1.35倍に置き換わる"],"a": 1,"e": "深夜割増は他の割増と重複して発生する。時間外かつ深夜なら1.25＋0.25。","m": "就業規則"},{"s": "2","q": "年次有給休暇が最初に付与されるのはいつで、何日か。","c": ["入社日に5日","入社3ヶ月で5日","入社6ヶ月・全労働日の8割以上出勤で10日","入社1年で10日"],"a": 2,"e": "週5日以上勤務の場合。以降は勤続年数に応じて増え、6年6ヶ月以上で20日。繰り越しは翌年に限る（2年で時効）。","m": "就業規則"},{"s": "2","q": "有給休暇の申請について正しいものは。","c": ["取得後に申請すればよい","休暇日の前日までに申請する。できる限り3週間以上前に出す","当日の朝に連絡すればよい","上司が代わりに申請する"],"a": 1,"e": "手続きをしなかった場合は欠勤扱い。事後の申請は認められない。","m": "就業規則"},{"s": "2","q": "年10日以上の有給が付与された社員について、会社に義務があるのは。","c": ["全日数を取らせること","付与日から1年以内に5日取得させること","本人が希望した日に必ず取らせること","買い取ること"],"a": 1,"e": "会社が意見を聴いたうえで時季を指定して取得させる法定義務。自分の意思で取得した分と計画的付与の分は差し引かれる。","m": "就業規則"},{"s": "2","q": "退職したいときは何日前に申し出るか。","c": ["14日以上前","30日以上前","60日以上前","3ヶ月以上前"],"a": 1,"e": "30日以上前に退職願を提出する。引継ぎを完全に行った者は、退職予定日まで有給休暇を取得できると明記されている。","m": "就業規則"},{"s": "2","q": "無断欠勤が連続14勤務日に及んだ場合。","c": ["懲戒解雇となる","その最終日をもって自己都合退職とみなされる","減給処分となる","特に規定はない"],"a": 1,"e": "病気その他やむを得ない理由で連絡できなかったと会社が認めた場合は取り消せる。","m": "就業規則"},{"s": "2","q": "就業規則が定める懲戒処分の種類は。","c": ["譴責・減給・出勤停止・降格・諭旨退職・懲戒解雇の6種類","戒告・減給・解雇の3種類","口頭注意・書面注意の2種類","減給と解雇のみ"],"a": 0,"e": "2つ以上を併科することもある。減給は1回の額が平均賃金1日分の半額、総額が1賃金支払期の10分の1が上限。","m": "就業規則"},{"s": "2","q": "同僚に打刻を頼んだ場合はどうなるか。","c": ["本人が申告すれば問題ない","本人以外の打刻も、依頼した側も懲戒事由","店長の許可があれば可","遅刻でなければ問題ない"],"a": 1,"e": "労働時間の記録は割増賃金の根拠そのもの。直行直帰で打刻できない場合は事前に会社の許可を得る。","m": "就業規則"},{"s": "2","q": "トレーナーの休日について正しいものは。","c": ["週2日が原則。確保できない場合も4週で8日以上","週1日のみ","月6日","完全自由"],"a": 0,"e": "シフト制で会社が指定し、原則として月初めに各店舗責任者が提示する。","m": "就業規則"},{"s": "2","q": "通勤手当の上限は。","c": ["月額15,000円","月額20,000円","月額25,000円","上限なし"],"a": 2,"e": "公共交通機関を利用し通勤経路届を提出した者に支給。バスは停留所間の走行距離が2km以上の場合に限る。","m": "就業規則"},{"s": "2","q": "ハラスメントを受けた、または目撃したときの扱いとして正しいものは。","c": ["被害者本人だけが相談できる","目撃者も、発生のおそれがある段階でも申し出ができる","証拠がなければ相談できない","直属の上司にだけ相談する"],"a": 1,"e": "申出は書面でも口頭でもよい。申し出たことを理由に不利益な取扱いをすることは規程で禁止されている。","m": "就業規則"},{"s": "2","q": "副業について会社の立場は。","c": ["自由","原則禁止。事情がある場合は人事MTG等で飯泉に相談","申告すれば自由","土日のみ可"],"a": 1,"e": "会社が特に認めた場合のみ可能。無許可で行った場合は懲戒処分の対象になりうる。","m": "就業規則"},{"s": "2","q": "入社直後の雇用契約について正しいものは。","c": ["最初から無期雇用","原則として入社後6ヶ月間は有期雇用契約","1年間は有期雇用","試用期間3ヶ月の後に本採用"],"a": 1,"e": "期間満了時の評価により無期雇用へ転換することがある。その間も給与面や待遇は正社員と同じ。","m": "就業規則"},{"s": "2","q": "健康診断について正しいものは。","c": ["希望者のみ受診","入社時と年1回以上の定期健診は必須","2年に1回","35歳以上のみ"],"a": 1,"e": "特定業務従事者は年2回以上。健康要注意となった者は会社の医師の指示に従う義務がある。","m": "就業規則"},{"s": "2","q": "退職した後の守秘義務は。","c": ["退職と同時になくなる","退職・解雇の後も免れない","1年間だけ残る","契約書がなければ発生しない"],"a": 1,"e": "対象は営業秘密・ノウハウ・技術情報に加え、社員の個人情報・人事情報まで含む。退職時に秘密保持誓約書を求められることがある。","m": "就業規則"},{"s": "2","q": "出勤の打刻はいつ、どこで行うか。","c": ["家を出るときに打刻する","最初のセッションの30分前、店舗に到着してから","営業開始時刻ちょうど","お客様が来店したとき"],"a": 1,"e": "位置情報も管理されるため移動中の打刻はNG。打刻後に着替え・清掃・空調・WORKS共有事項の確認を行う。","m": "勤務ルール"},{"s": "2","q": "お客様をお出迎えできる状態は、何分前までに作るか。","c": ["5分前（新規体験は10分前）","15分前（新規体験は20分前）","30分前（新規体験は40分前）","時間ちょうど"],"a": 1,"e": "1本目が7時なら6時30分打刻、6時45分までに準備を終え、7時までのバッファでお水・BGM・カルテを最終確認する。","m": "勤務ルール"},{"s": "2","q": "勤務時間外・休日の連絡ルールは。","c": ["24時間いつでも可","23:00〜翌7:00の連絡は禁止","20:00以降は禁止","休日のみ禁止"],"a": 1,"e": "目的はプライベート時間と休息の確保、長時間労働の防止。全グループLINEで必須のルール。","m": "勤務ルール"},{"s": "2","q": "23:00〜翌7:00の連絡禁止に対する例外として認められているのは。","c": ["売上報告","お客様トラブルなど至急対応が必要な場合／部下から上司への緊急相談／提出物関連","雑談以外すべて","上司からの連絡はすべて"],"a": 1,"e": "この3つ以外は翌朝に回す。送る側が「見なくていい」と思っていても、受け手は通知で起きる。時間指定送信を使う。","m": "勤務ルール"},{"s": "2","q": "休憩について正しいものは。","c": ["空いた時間に取れたら取る","1日2時間まで確保してよく、埋まる前に先にブロックする","1時間までしか取れない","売上が低い日は取れない"],"a": 1,"e": "休憩のブロックは許可制ではなく権利として運用されている。5セッション以下なら1時間、6セッション以上なら2時間が推奨。","m": "勤務ルール"},{"s": "2","q": "予約枠をブロックしてよいものはどれか。","c": ["事務作業","通院","休憩・各種MTG・承認済みの有休","個人の予定"],"a": 2,"e": "休憩以外はエリア統括の確認を経てから入れる。事務作業・通院・仮ブロック・個人の予定・SNS投稿での使用は禁止。","m": "勤務ルール"},{"s": "2","q": "1日のうちに他店舗へ移動して担当する日の扱いは。","c": ["移動時間は自己負担でブロックしない","移動時間を含めてブロックする","移動中も予約を受ける","前日までに申請が必要"],"a": 1,"e": "例：西落合店から東長崎店へ移動して14時からのセッションなら、移動30分を見て13:30〜15:30をブロックする。","m": "勤務ルール"},{"s": "2","q": "退勤前に必ず確認することは。","c": ["翌日のスケジュール／LINEの未読・未返信／担当店舗とブロック","売上と入会数のみ","お客様の体重の記録のみ","特にない"],"a": 0,"e": "その日に来た通知はその日に返信する。やりとりの最後はトレーナー側で終了する。戸締まりまで確認してからHRMOSで退勤打刻。","m": "勤務ルール"},{"s": "2","q": "業務日報に書く内容として正しいものは。","c": ["感想と反省","どの業務をどれくらいの時間実施したかが分かる形","売上だけ","お客様の名前一覧"],"a": 1,"e": "例：セッション4名4.5h／ポスティング2h／MTG 1h／移動0.5h＝合計8h。緊急の報連相は日報ではなくDMまたは電話で行う。","m": "勤務ルール"},{"s": "2","q": "休日（公休以外の休み）の申請方法は。","c": ["口頭で店長に伝える","LINE WORKSの【休日申請】テンプレートから、原則1ヶ月前までに申請","当日の朝に連絡","エリア統括に電話"],"a": 1,"e": "有給が残っていない場合は必ず欠勤を選ぶ。理由の詳細な記入は不要。急な体調不良等はまず上長へ連絡したうえで申請する。","m": "勤務ルール"},{"s": "2","q": "立替払いをした領収書の提出先は。","c": ["西落合事務所","千川アネックス","各店舗の金庫","エリア統括に手渡し"],"a": 1,"e": "本社が千川アネックスに移転したため、西落合事務所と書かれた資料は古い。備品のストックも同じ場所。","m": "勤務ルール"},{"s": "2","q": "お客様が写っている写真をSNSに投稿したいとき。","c": ["顔が写っていなければ投稿してよい","書面での同意がない限り出さない","口頭の了承があれば投稿してよい","店長の許可があれば投稿してよい"],"a": 1,"e": "顔が写っていなくても、施術中の様子や体型が分かる画像は個人が特定されうる。撮ってから許可を取るのではなく、撮る前に取る。","m": "勤務ルール"},{"s": "2","q": "顧客情報の取り扱いとして正しいものは。","c": ["私物スマホで撮影して自宅で作業する","店の外に持ち出さない・私物端末に残さない・業務外で話さない","共有は自分が使いやすい方法でよい","退勤後の飲み会でなら話してよい"],"a": 1,"e": "漏洩は本人が悪意なく起こすケースが大半。共有は会社が指定した経路のみ。ヒアリングシートも店舗内で保管し持ち出さない。","m": "勤務ルール"},{"s": "2","q": "既存会員の当日キャンセル・無断キャンセルへの対応は。","c": ["1回目から回数消化","1回目は丁寧に確認して当月内変更可、2回目以降は回数消化","何度でも振替可","その都度店長が判断"],"a": 1,"e": "1回目の時点で「2回目以降は消化扱いになります」と必ず伝える。事前告知が前提。新規体験の当日無断キャンセルは違約金5,500円。","m": "勤務ルール"},{"s": "2","q": "お客様から「定休日に見てほしい」と言われたとき。","c": ["対応してよい","原則禁止。エリア統括の判断を通す","断る","店長の判断で決める"],"a": 1,"e": "一度対応すると以降も同じ対応を求められ、お客様が増えた場合に全員へ対応するのは不可能になるため。要望はその場で可否を答えず預かる。","m": "勤務ルール"},{"s": "2","q": "備品や器具の不具合を見つけたときの対応は。","c": ["自分で応急処置する","使用を停止して報告し、使用停止の表示を出す","次の点検まで様子を見る","お客様に気づかれないよう隠す"],"a": 1,"e": "現場判断の応急処置は直ったように見えて事故につながる。写真を撮って状況を添えて報告する。","m": "勤務ルール"},{"s": "2","q": "Googleマップの口コミへの返信は。","c": ["良い口コミにだけ返す","1営業日以内に返信する","週1回まとめて返す","本部が返すので現場は触らない"],"a": 1,"e": "口コミは新規顧客が最も参考にする情報。悪い口コミには感情的に反論せず、改善する点だけを短く述べる。","m": "勤務ルール"},{"s": "5","q": "施術中にお客様が痛みを訴えた。最初にすることは。","c": ["即座に手を止める","もう少しで楽になると伝えて続ける","痛みの種類を聞いてから判断する","セッション終了まで様子を見る"],"a": 0,"e": "即座に止める。判断は後。しびれ・放散痛・力が入らない等があればその日は施術を終了し、医療機関の受診を案内。上長へ即報告する。","m": "整体マニュアル","must": true},{"s": "5","q": "セッション後に「体調が悪くなった」と電話が来た。正しい対応は。","c": ["好転反応だと説明して安心させる","原因を電話で断定せず、症状と現在の状態を聞き取り、必要なら受診を案内する","様子を見てくださいと伝える","次回来店時に確認する"],"a": 1,"e": "電話では因果関係を断定できる情報を持っていない。強い痛み・しびれ・発熱・動けない等があれば受診案内を最優先。その後に上長と施術内容を検証する。","m": "整体マニュアル","must": true},{"s": "5","q": "セッション中にお客様が胸の痛みを訴え、意識がもうろうとしている。","c": ["水を飲ませて休ませる","119番通報する","タクシーで病院へ送る","家族に連絡して指示を待つ"],"a": 1,"e": "軽度（めまい・軽い吐き気）は中止して安静・水分補給。中等度〜重度（胸痛・呼吸困難・失神など）は119番。嘔吐があれば横向きにして窒息を防ぐ。","m": "基礎業務（緊急対応）","must": true},{"s": "5","q": "お客様がケガをしたときの応急処置の基本は。","c": ["RICE（安静・冷却・圧迫・挙上）","温めてマッサージする","ストレッチで動かす","湿布を貼って続行"],"a": 0,"e": "即時中断→安静な場所へ誘導→状況確認→RICE→重症なら119。発生時刻・状況・対応を必ず記録してエリア統括へ報告し、事故報告書を作成する。","m": "基礎業務（緊急対応）","must": true},{"s": "5","q": "お客様と連絡を取るときに使うものは。","c": ["自分の個人LINE","CHART公式LINE","電話番号のSMS","どれでもよい"],"a": 1,"e": "個人LINEは記録が残らずトラブルの元になる。誤って個人アカウントを教えてしまった場合は、すぐ上長に報告する。","m": "お客様公式LINEやりとりマニュアル","must": true},{"s": "5","q": "「これで腰痛は治りますか」と聞かれたときの答え方は。","c": ["「治ります」と言い切って安心させる","「治る」という言葉は使わず、症状が軽くなる方が多い・動ける範囲を広げられる、と実際に提供できる範囲で答える","「分かりません」とだけ答える","「医者に聞いてください」と断る"],"a": 1,"e": "「治る」は医療行為の領域。言葉の選び方がそのままリスク管理になる。ただし慎重になりすぎて何も約束できないと頼りないので、できることは断言する。","m": "接客・言葉遣いマニュアル","must": true},{"s": "5","q": "SNSや店内POPで避けるべき表現は。","c": ["効果を断定する表現／体験談を効果の証明として使う表現","店舗の住所","スタッフの名前","営業時間"],"a": 0,"e": "効能効果の標榜は医薬品等に許された領域で、施術やレッスンには適用されない。ビフォーアフター写真を効果の保証として掲載しない。迷ったら投稿前に本部確認。","m": "接客・言葉遣いマニュアル","must": true},{"s": "5","q": "資格についてお客様に説明するとき、使ってはいけない訴求は。","c": ["「全スタッフ国家資格保有」","自分が持っている資格を伝える","資格で何ができるかを説明する","医療連携があることを伝える"],"a": 0,"e": "名簿上、資格欄が空欄の方や民間資格のみの方が複数いるため、全員という前提が成り立たない。個々の資格を個別に伝えるのは問題ない。","m": "企業理念","must": true},{"s": "5","q": "施術や指導でお客様の身体に触れるときの基本は。","c": ["黙って手早く触れる","触れる部位と目的を毎回声に出してから触れる","同性のスタッフに交代する","事前の書面があれば説明は不要"],"a": 1,"e": "意図がどうであれ、相手がそう感じた時点で問題として成立する領域。指摘を受けたら即座に謝罪し、上長に必ず報告する。自己判断で処理しない。","m": "整体マニュアル","must": true},{"s": "5","q": "未成年のお客様への対応で必須なのは。","c": ["本人の同意だけでよい","保護者の同意が前提。契約も施術も例外を作らない","18歳以上なら不要","店長が認めれば可"],"a": 1,"e": "未成年との契約は法的に取り消しの対象になりうる。可能な限り初回は保護者同席、施術内容と負荷を保護者にも説明する。","m": "スクエア契約書マニュアル","must": true},{"s": "5","q": "同意書で必ず口頭説明すべき4点に含まれないものは。","c": ["医療行為ではないこと","持病・妊娠等は必ず申告すること","体調不良があれば中止できること","解約時の返金条件"],"a": 3,"e": "4点は①医療行為ではない②持病・妊娠等は必ず申告③体調不良があれば中止できる④必要に応じて身体接触がある。書面を渡すだけで終わらせず、説明した事実を記録に残す。","m": "カウンセリングシート記入研修"},{"s": "5","q": "ヒアリングシートで必須の記入項目は。","c": ["電話番号・緊急連絡先・e-mail","体重・体脂肪率","職業・年収","家族構成"],"a": 0,"e": "既往歴や妊娠の可能性は聞きにくいが事故防止のため必須確認。初回体験時のカルテには必ず写真で保存し、シートは店舗内で保管して持ち出さない。","m": "カウンセリングシート記入研修"},{"s": "3","q": "カルテでセッション回数を記載する場所は。","c": ["顧客シートのメモ欄だけ","セッション時間の欄だけ","顧客シートのメモ欄・セッション時間・期限内回数の3箇所すべて","どこか1箇所でよい"],"a": 2,"e": "どこか1箇所だけだと必ずミスが発生する。回数のズレは金銭トラブルに直結し、返金対応の原因になる。","m": "カルテ記載マニュアル"},{"s": "5","q": "新規体験の問い合わせがLINEに入ったときの返信目安は。","c": ["理想30分以内、遅くとも6時間以内","24時間以内","翌営業日まで","手が空いたとき"],"a": 0,"e": "新規は最初の反応速度がそのまま来店率に効くため、他の業務より優先度が高い。6時間を超えるとエリア統括が代理で予約対応する。","m": "体験時のLINE対応ルール"},{"s": "1","q": "電話対応の基本として正しいものは。","c": ["3コール以内に出て、明るい「笑声」で話し、電話番号は必ず復唱する","鳴り終わる前に出ればよい","落ち着いた低い声で話す","番号はメモだけ取る"],"a": 0,"e": "「7」は「なな」、17時は「じゅうななじ」と読む。11時と17時は聞き間違いが起きやすいため、午前・午後を付けるなど二重に確認する。","m": "電話対応・飛込みマニュアル"},{"s": "5","q": "新規体験の日程調整で禁止されている聞き方は。","c": ["「◯月◯日（◯）10:00〜でご案内可能です」","「いつが良いですか？」","「午前と午後、どちらがご都合よろしいですか？」","具体的な日時を5日以上提示する"],"a": 1,"e": "主導権は必ず店舗側が持つ。判断を委ねると迷いが生まれて離脱する。空き状況を確認したうえで、こちらから日程を5日以上提示するのが基本。","m": "体験時のLINE対応ルール"},{"s": "5","q": "体験の予約が確定するのはどの時点か。","c": ["お客様が「その日でお願いします」と返した時点","店舗側が日時・場所・持ち物・所要時間を含む確定文を送った時点","当日来店した時点","カレンダーに入力した時点"],"a": 1,"e": "候補提示→お客様選択→店側の確定文、の3ステップ。確定文がないと双方の認識がずれたまま当日を迎える。当日キャンセルや来店ミスの多くはここで起きる。","m": "体験時のLINE対応ルール"},{"s": "4","q": "お客様から「精神的につらい」と打ち明けられたとき。","c": ["カウンセラーとして相談に乗り続ける","否定せずに聞くが助言はせず、専門機関の存在を伝え、抱え込まない","話題を変える","家族に連絡する"],"a": 1,"e": "専門外の領域で助言をすると状況を悪化させる可能性がある。対応するスタッフ側の消耗が離職につながることも多い。内容は上長に共有する。","m": "継続率アップ"},{"s": "5","q": "妊娠中・産後のお客様への対応の起点は。","c": ["本人の希望","医師の許可","店長の判断","体調が良さそうかどうか"],"a": 1,"e": "妊娠期・産後は個人差が極めて大きく、外見や本人の申告では判断できない。開始後も出血・痛み・違和感があれば即中止し受診を促す。","m": "整体マニュアル","must": true},{"s": "4","q": "食事について聞かれたとき、どこまで答えてよいか。","c": ["個別の食事療法まで指示してよい","一般的な情報提供まで。既往歴・服薬がある方や極端な制限をしている方は医療機関や管理栄養士につなぐ","何も答えない","サプリを勧める"],"a": 1,"e": "管理栄養士・医師でない者が疾患を持つ人に個別の食事療法を指示することは範囲を超える。範囲内でできることは具体的に伝え、範囲外はなぜ言えないかを説明する。","m": "食事関係基礎知識"},{"s": "5","q": "ヒヤリハット（事故には至らなかった出来事）が起きたとき。","c": ["大事に至らなければ報告不要","当日中に事実・時刻・状況・対応を報告する","月次でまとめて報告する","原因が分かってから報告する"],"a": 1,"e": "報告しないことが最大の事故。軽微なうちに集まれば対策が打てるが、報告が上がらない文化では対策の起点がない。原因の推測は後回しでよい。","m": "基礎業務（緊急対応）","must": true},{"s": "4","q": "新規体験でトレーニングを行うときの強度は。","c": ["限界まで追い込む","通常の60〜70%。「もう少しやりたかった」で終わらせる","お客様の希望のまま","軽く流す程度"],"a": 1,"e": "初回で追い込みすぎると翌日の筋肉痛がひどく、また行きたい気持ちが消える。物足りなさが継続率・入会率に直結する。","m": "基礎トレーニング"},{"s": "1","q": "セッション見学をするときの立ち位置と態度は。","c": ["お客様の正面に立ってしっかり見る","斜め後ろ〜横に立ち、「黒子」として存在感を出さない","質問しながら見る","メモに集中する"],"a": 1,"e": "正面に立つと視線に入り続けて集中を妨げ、評価されている感を与える。口を挟む・勝手にフォーム修正する・私語やスマホもNG。見学後は必ず質問を1つ持っていく。","m": "セッション見学マニュアル"},{"s": "1","q": "「CHARTってどんなところ？」と聞かれたときの説明として適切なのは。","c": ["整体で体を整え、パーソナルトレーニングで体を鍛える。根本改善と筋力強化を同じ場所・同じスタッフが一貫して行うスタジオ","安くて通いやすいダイエットジム","マシンが充実しているフィットネスクラブ","整体が受けられるリラクゼーションサロン"],"a": 0,"e": "「ダイエットジム」と自己紹介した瞬間に価格でしか比較されなくなる。整骨院は筋力・姿勢の強化が弱く再発しやすい、パーソナルジムは歪みや痛みへの対応が外れやすい。両方を1か所で完結させる点が差別化。","m": "企業理念"},{"s": "1","q": "コーポレートサイトが掲げている理念は。","c": ["No Pain, No Gain","Health is happiness","Training for Everyone","Body Design"],"a": 1,"e": "単に痩せることではなく、家族との外出やおしゃれを自信を持って楽しめる状態、つまり幸せな人生の土台としての健康を支えるという位置づけ。","m": "企業理念"},{"s": "1","q": "なぜトレーニングの前に整体を行うのか。","c": ["お客様にリラックスしてもらうため","歪んだ状態のまま負荷をかけると代償動作を強化して怪我につながるから","整体の売上を上げるため","トレーニングの時間を短くするため"],"a": 1,"e": "順番自体がメソッド。「整体もついてくる」と説明するとオプション扱いになり価値が半減する。「整体をやってからでないとトレーニングが効きません」と必然として説明する。","m": "企業理念"},{"s": "1","q": "月4プランの料金（税込）と入会金（税込）は。","c": ["月会費22,000円／入会金33,000円","月会費33,000円／入会金44,000円","月会費44,000円／入会金55,000円","月会費33,000円／入会金無料"],"a": 1,"e": "月4プラン30,000円（税込33,000円）、月8プラン56,000円（税込61,600円）、入会金40,000円（税込44,000円）。ただし金額は店舗ごとに異なることがあるので、案内前に必ず自店の最新表を確認する。","m": "企業理念"},{"s": "1","q": "入会金が無料になる条件は。","c": ["体験当日に入会すること","2回目の来店までに入会すること","紹介で入会すること","キャンペーン期間中に入会すること"],"a": 0,"e": "持ち帰った時点で入会率が大きく落ちるため、当日入会を条件にしている。値引きではなく決断のタイミングを設計する仕組み。価値の合意が取れた後に伝える。","m": "企業理念"},{"s": "1","q": "ペア割の条件として正しいものは。","c": ["家族なら誰でも適用","初回体験セッションを同日に受けた2人が入会した場合、継続中ずっと10%OFF","2人目が入会した月だけ10%OFF","どちらかが紹介すれば適用"],"a": 1,"e": "同日体験が条件。夫婦でも、どちらかが後から入会した場合はペア割ではなく紹介割の対象になる。他キャンペーンとの併用は不可。予約の段階で「お二人ご一緒ですか」を確認する。","m": "企業理念"},{"s": "1","q": "紹介割で、紹介した側の会員が受けられるのは。","c": ["翌月の月会費が10,000円オフ","永年10%オフ","入会金が無料","セッション1回無料"],"a": 0,"e": "紹介された方はプランに応じて5,000〜15,000円オフ。適用は1ヶ月のみ。新規入会時に「〇〇さんの紹介」と申告すること、紹介者が在籍中であることが条件。","m": "企業理念"},{"s": "1","q": "「持ち物は何が必要ですか」と聞かれたときの答えは。","c": ["ウェア・シューズ・タオルをご持参ください","ウェア・シューズ・タオルは無料レンタル。手ぶらで来店できます","タオルだけご持参ください","有料でレンタルできます"],"a": 1,"e": "水もウォーターサーバーで無料。手ぶらで来られることは体験のハードルを下げる最も効きやすい情報で、伝えられていないと当日キャンセルの理由になる。予約確定の連絡に必ず入れる。","m": "企業理念"},{"s": "1","q": "消化できなかったセッション回数の繰り越しについて正しいものは。","c": ["繰り越しはできない","次月に繰り越せる。ただしプランごとに上限が違う（月4→1回、月8→2回など）","無制限に繰り越せる","店長の判断で決まる"],"a": 1,"e": "上限まで言い切らずに「繰り越せます」だけで止めると、後で「聞いていない」というトラブルに直結する。入会時に口頭で説明し、書面かLINEに残す。","m": "企業理念"},{"s": "1","q": "支払い方法として案内できるのは。","c": ["現金のみ","クレジットカードのみ","現金またはクレジットカード","電子マネーのみ"],"a": 2,"e": "Visa／Mastercard／Amex／JCB／Diners Club／Discover。分割や決済手段の追加については店舗判断で答えず、本部の最新案内を確認する。","m": "企業理念"},{"s": "1","q": "「整体は保険がききますか」と聞かれたときの答えは。","c": ["保険適用できます","CHARTは自費の施術。その分、一人ひとりの状態に合わせた施術ができると伝える","条件によって適用できます","分かりませんと答える"],"a": 1,"e": "保険が使える整骨院は施術時間や内容に制限があることが多い。制度の違いと提供内容の違いを混ぜずに説明する。整体とパーソナルは基本的に同じ日に続けて行う。","m": "企業理念"},{"s": "1","q": "整骨院に通っているお客様への説明として効くのは。","c": ["整骨院では治らないと伝える","「行くたびに楽になるのに、しばらくするとまた戻っていませんか」と繰り返す理由を構造で説明する","料金の安さを伝える","通う回数を増やすよう勧める"],"a": 1,"e": "整体で歪みをとっても、それを支える筋肉がないと日常生活でまた崩れる。他院を否定しない。否定に聞こえた瞬間、お客様は自分の判断を否定されたと感じる。","m": "企業理念"},{"s": "1","q": "医療機関との提携について正しいものは。","c": ["提携はしていない","2026年5月に増本整形外科（荻窪）と医療提携を開始した","全国の整形外科と提携している","提携先で診断もできる"],"a": 1,"e": "こちらの範囲を超えた症例を確実に渡せること、医師の診断を踏まえた上で運動を設計できることが提携の意味。提携があること自体は診断能力を意味しないので、現場で診断めいた発言はしない。","m": "企業理念"},{"s": "1","q": "「満足度92%」という数字の使い方として正しいのは。","c": ["そのまま「満足度92%です」と伝える","「会員198名に調査した結果です」と母数と出典をセットで伝える","キャンペーンのときだけ使う","数字は使わない"],"a": 1,"e": "数字は根拠を示せた瞬間に強い説得材料になり、示せなければ怪しい広告文句になる。調査時点や条件が変われば数字も変わるので、掲出物の更新時期も確認する。","m": "企業理念"},{"s": "1","q": "CHARTとMiarce（ピラティス）の関係として正しいのは。","c": ["同じ会社の2ブランドで、解決している課題が違う","Miarceは他社のブランド","Miarceは安い方のプラン","CHARTの上位プランがMiarce"],"a": 0,"e": "マンツーマンで深く入る必要がある層と、続けられる環境そのものが必要な層は別。「安い方・高い方」で説明した瞬間に、片方の価値を自分たちで削ることになる。合わない人には素直にもう一方を案内する。","m": "企業理念"},{"s": "1","q": "CHART株式会社の代表取締役は。","c": ["飯泉友裕","大久保泰成","志水秀吾","板橋"],"a": 1,"e": "CHART株式会社／設立2025年2月14日／代表取締役 大久保泰成／本社 東京都新宿区西落合。ブランドとしてのCHARTの創業は2022年6月（表参道/外苑前1号店）で、法人設立の2025年とずれている理由も説明できるようにしておく。","m": "企業理念"},{"s": "1","q": "名刺の渡し方として正しいものは。","c": ["片手で、自分から読める向きで渡す","名刺入れから1枚だけ取り出し、相手から読める向きにして、相手より低い位置で両手で渡す","ポケットから出して渡す","テーブルに置いて相手に取ってもらう"],"a": 1,"e": "受け取るときは「頂戴いたします」と両手で受け取り、すぐ名刺入れの上に置いて確認してから机へ。会話中は机に置いて相手の名前を意識する。折れた名刺・汚れた名刺はNG。","m": "名刺の渡し方"},{"s": "1","q": "電話で日時を伝えるときの注意は。","c": ["早口で簡潔に伝える","「7」は「なな」と読み、17時は「じゅうななじ」と言う。午前・午後も添えて二重に確認する","相手が復唱するのを待つ","メールで送るので口頭では省略する"],"a": 1,"e": "「11時（じゅういちじ）」と「17時（じゅうしちじ）」は聞き間違いが起きやすい。電話番号も必ず復唱する。つらつら話さず、句読点をつけるイメージで文章を切る。","m": "電話対応・飛込みマニュアル"},{"s": "1","q": "セッション中にアポなしの飛び込み来店があった。対応として正しいのは。","c": ["「こちらの番号かQRコードからご連絡ください」と案内する","担当中のお客様を中断して対応する","「今の時間は対応できかねます。改めてご案内しますので、お名前とお電話番号をお聞きしてよろしいでしょうか」とこちらから取りに行く","何も言わず会釈だけする"],"a": 2,"e": "受け身にならない。相手に委ねるのがNG例として明示されている。折り返しに都合の良い時間も聞く。ただし担当中のお客様が最優先。","m": "電話対応・飛込みマニュアル"},{"s": "1","q": "勤務プランは何種類あるか。","c": ["PREMIUM（無敵）・フレキシブル・コンパクトの3つ","フルタイムとパートの2つ","4つ","個別に決める"],"a": 0,"e": "PREMIUMとフレキシブルは営業時間12時間、コンパクトは11時間。フレキシブルとコンパクトには週1回の平日半休制度がある。3プランとも土日の公休設定は不可。","m": "働き方プラン、登録、発注関係"},{"s": "1","q": "予約が入っていない時間の扱いは。","c": ["必ず店舗にいなければならない","予約が入っていない枠は、本来の終了時間を待たずに帰宅してよい","事務作業を必ず入れる","店長の許可が毎回必要"],"a": 1,"e": "早上がりだけでなく遅出や中抜けも可能。ただし正社員は月163時間を下回ると減給の対象になるため、不足しそうなら他店応援や本部業務を自分から申し出る。","m": "働き方プラン、登録、発注関係"},{"s": "3","q": "予約はどこで管理するか。","c": ["店舗ごとのノートで管理する","すべてSquare予約で管理する。オンライン予約は12時間前まで、それ以降はスタッフが代理登録する","LINEのやり取りを予約とみなす","Googleカレンダー"],"a": 1,"e": "電話・LINE・店頭で受けた場合は管理画面から入力し、反映を確認する。変更・キャンセルもすべてSquare上で処理。確認は毎朝と営業終了後の2回。","m": "予約管理方法"},{"s": "3","q": "指名予約かどうかはどこで見分けるか。","c": ["お客様に毎回確認する","予約詳細のスタッフ欄に「（予約可能なスタッフで予約）」が無ければ指名予約","カルテのメモ欄","見分ける方法はない"],"a": 1,"e": "指名されている場合は極力担当変更をしない。変更せざるを得ない場合は、変更前にお客様へ連絡し理由を伝える。黙って変えない。","m": "予約管理方法"},{"s": "3","q": "誤って請求してしまったときの正しい動きは。","c": ["自分の判断でSquareから払い戻して終わり","上長へ報告し、誰の判断で払い戻したかを記録に残したうえで、Square請求書アプリから理由「注文の間違い」で払い戻す","お客様に現金で返す","次回の請求で相殺する"],"a": 1,"e": "操作手順を知っていることと、判断権限があることは別。返金の可否は現場で即答せず、契約条件と経緯を確認し、上長と基準に照らして判断してから操作する。","m": "スクエア決済マニュアル"},{"s": "3","q": "振り込みでの支払いを希望されたとき、正しいものは。","c": ["請求書（PDF）は発行できるが、インボイス対応の請求書は発行できない","インボイス対応の請求書を発行できる","振り込みには対応していない","振込手数料は会社が負担する"],"a": 0,"e": "CHARTは現在、適格請求書発行事業者ではない。振込手数料はお客様負担であることを案内時に必ず伝える。振込完了後、振込日・金額・名義を連絡してもらう。独自判断での対応は禁止。","m": "振り込み希望対応マニュアル"},{"s": "3","q": "Outlookに届いた新規体験の問い合わせに返信するとき、NGなのは。","c": ["定型文のみ、予約確認のみの返信","お礼から書き始める","コメントに触れる","締めの挨拶を入れる"],"a": 0,"e": "返信目安は理想1時間以内、遅くとも6時間以内。トレーナーへのコメントが入っている場合は必ず返信文に反映する。送信前に名前・コメント・店舗名の3点をチェック。","m": "Outlook新規体験問い合わせ返信マニュアル"},{"s": "3","q": "LINE WORKSで社外とやり取りするときの扱いは。","c": ["チャットで自由にやり取りしてよい","メール機能を使い、機密情報はパスワード付きファイルで送信する","個人のメールアドレスを使う","社外とはやり取りしない"],"a": 1,"e": "チャットで外部とやり取りする場合は管理者設定が必要。ヒアリングシートは店舗内で保管し持ち出さない。退職・異動者のアカウント削除は管理者が対応する。","m": "LINEワークス使用マニュアル"},{"s": "3","q": "閉店作業で、退勤打刻はどのタイミングで押すか。","c": ["最後の顧客が帰った直後","清掃を始める前","日報提出と戸締まり確認が終わった後","翌日の朝にまとめて"],"a": 2,"e": "戸締まりまでが業務だから打刻を最後に置いている。退勤前にはLINEの未読・未返信ゼロ、次回出勤時のスケジュール、担当店舗とブロックも確認する。","m": "日々の業務フロー（開店〜閉店）"},{"s": "3","q": "タオルの畳み方について正しいものは。","c": ["店舗ごとに決めてよい","全店舗統一。半分→半分（最初の折り目を少し外側へ）→縦半分→半分","見た目が整っていれば自由","ボディタオルとフェイスタオルで手順が違う"],"a": 1,"e": "2工程目で端をきっちり揃えすぎず、最初の折り目をわずかに外側へ出すのがポイント。これを怠ると仕上がりが崩れる。ボディもフェイスも同じ手順。","m": "全店舗統一タオルの畳み方"},{"s": "3","q": "タオルやウェアの洗濯について正しいものは。","c": ["家庭にある洗剤でよい","指定洗剤のみ使用し、基本は週2回。レンタルウェアは使用後に必ず洗濯する","コインランドリーで乾燥まで行う","月1回まとめて洗う"],"a": 1,"e": "洗濯機がない店舗はコインランドリーで洗濯のみ行い、乾燥はせず持ち帰って店内で干す。コインランドリーは経費削減のため必要量が溜まってから1回にまとめる。","m": "日々の業務フロー（開店〜閉店）"},{"s": "3","q": "カルテ（ビフォアフ）の基礎情報に書く4区分は。","c": ["プラン・目標・運動歴と生活習慣・ポイント","氏名・住所・電話番号・生年月日","体重・体脂肪・筋肉量・BMI","入会日・更新日・担当者・店舗"],"a": 0,"e": "目標はできる限り《過程目標》《成果目標》《パフォーマンス目標》の3つに分けて書く。顧客名欄は「フルネーム＋何回プラン＋更新日」。","m": "ビフォアフマニュアル"},{"s": "3","q": "セッション内容の記載で必ず書くものは。","c": ["お客様の感想","種目名と「重量×rep数×set数」","所要時間","次回の予約日"],"a": 1,"e": "次に担当するトレーナーがお客様の運動レベルを把握できるようにするため。メモ欄には①疼痛・体調 ②PDCAを意識した実施内容 の2点を必ず書く。","m": "カルテ記載マニュアル"},{"s": "3","q": "他店舗のお客様のカルテを見たいとき。","c": ["どの店舗からでも見られる","その店舗でログインする必要がある","本部に依頼する","見ることはできない"],"a": 1,"e": "ビフォアフのログイン方法は店舗ごとに異なる。店舗Aのお客様のカルテを扱うには店舗Aでのログインが必要。","m": "ビフォアフマニュアル"},{"s": "3","q": "開店準備の時間の使い方として正しいものは。","c": ["1本目の10分前に出勤して準備する","1本目の30分前に打刻し、15分前までに清掃・空調・共有事項確認を終える","営業開始と同時に清掃を始める","前日の担当者が全部やっておく"],"a": 1,"e": "1本目が7時なら6時30分打刻、6時45分までにウェア着替え・清掃・空調管理・WORKS共有事項確認を終え、7時までのバッファでお水・BGM・カルテを最終確認する。","m": "日々の業務フロー（開店〜閉店）"},{"s": "4","q": "整体の基本手技は大きく何系統か。","c": ["なでる（軽擦法）・もむ（揉捏法）・おす（指圧法）の3系統","もむ・たたくの2系統","押す・引く・ひねるの3系統","5系統"],"a": 0,"e": "軽擦法は手掌・母指・二指・四指に分かれ、揉捏法は手掌揉捏と母指揉捏、指圧法は母指指圧で全身に使える。手や足では末梢から中枢（心臓方向）に向けてもむ。","m": "整体マニュアル"},{"s": "4","q": "母指揉捏法のポイントは。","c": ["指先を立てて強く押す","親指のはらを直角にあて、均等に力を入れる","手首のスナップを使う","できるだけ速く動かす"],"a": 1,"e": "脊柱筋や手足の筋・腱をもむときは、両親指で筋肉をはさむようにあて、それぞれ反対方向にこねるようにもむ。母指に負担が集中すると自分の手を壊すので手掌揉捏と使い分ける。","m": "整体マニュアル"},{"s": "4","q": "施術の前に必ず伝える3点は。","c": ["料金・時間・キャンセル規定","どこに何をするか（部位・手技）／なぜそこをやるのか（根拠）／終わったらどう変わるか（期待値）","自分の経歴・資格・実績","今日の目標・来月の目標・半年の目標"],"a": 1,"e": "説明のない施術は、気持ちよくても価値が伝わらない。期待値は言い切らずに幅を持たせる（「軽くなります」ではなく「軽くなる感覚があると思います」）。","m": "整体マニュアル"},{"s": "4","q": "キューイング（声かけ）が伝わらない原因は。","c": ["声が小さいから","相手の身体感覚にない言葉を使っているから","お客様の理解力の問題","回数が足りないから"],"a": 1,"e": "「骨盤を後傾」は解剖用語であって感覚ではない。1つの動きに対し、解剖表現・感覚表現・比喩表現の3種類を用意しておく。同じ言葉を大声で繰り返さない。","m": "基礎トレーニング"},{"s": "4","q": "代償動作はどこまで修正するか。","c": ["気づいたものは全部その場で直す","最も上流にある1つを特定し、その日はそれだけ言う","本人が気にしたときだけ直す","3回目以降から指摘する"],"a": 1,"e": "指摘が3つ以上になると相手は動けなくなる。1セッション1テーマが原則。ただし腰椎の過伸展や膝の内側崩れなど安全に関わる代償は例外で、即時修正する。","m": "基礎トレーニング"},{"s": "4","q": "継続率を上げるために最も効くのは。","c": ["半年ごとのキャンペーン","初回から3回目までの体験設計","料金の割引","イベントの開催"],"a": 1,"e": "やめる人の大半は最初の1ヶ月で心が離れている。1回目は変化を出す、2回目は理由を説明する、3回目は自分でできることを渡す。この順番を崩さない。","m": "継続率アップ"},{"s": "4","q": "ARCの3要素は。","c": ["A＝親和性、R＝具体性、C＝対話","A＝分析、R＝結果、C＝改善","A＝挨拶、R＝réponse、C＝契約","A＝安全、R＝リスク、C＝確認"],"a": 0,"e": "3つが正三角形になるのが目標。対話（C）はプレゼンテーション（一方的に伝える）の対義語として定義されている。自分がどの型に偏っているかを診断し、最も低いものを1つだけ伸ばす。","m": "継続率アップ"},{"s": "4","q": "感動体験（ビフォーアフター演出）の作り方は。","c": ["毎回ほめる","①現状を数値化 ②問題点の明確化 ③定期的な測定","毎回メニューを変える","写真を撮って見せる"],"a": 1,"e": "初回で目標に合わせた数値を記録し（お腹の引き締め→ウエスト、腰痛改善→体幹の捻転可動域）、月1程度のペースで測定して変化を見える化する。数値がないと感動は作れない。","m": "継続率アップ"},{"s": "5","q": "新規体験の大目的は。","c": ["良い体験をしたと思ってもらうこと","来店したお客様に「今日入会する」と決めてもらうこと","身体の状態を詳しく知ること","また来たいと思ってもらうこと"],"a": 1,"e": "新規体験は、お客様がCHARTに通うかを決める唯一の機会。前提は3つ。お客様はサービスではなく未来の自分を買う／人は良いサービスより良い人に課金する／クロージングは最初の挨拶から始まっている。","m": "カウンセリング並びにクロージング研修"},{"s": "5","q": "来店時の第一印象で押さえる4点は。","c": ["笑顔・声量・目線・姿勢","服装・髪型・靴・時計","挨拶・名刺・案内・着席","清掃・BGM・香り・温度"],"a": 0,"e": "声量は通常会話の1.2倍が目安。目線を外す・下を向くは自信がないサイン。猫背・腕組み・ポケット手はNG。最初の20分で「この人は信頼できる」という感覚を作る。","m": "カウンセリング並びにクロージング研修"},{"s": "5","q": "深掘りヒアリングの正しい順番は。","c": ["質問→共感→提案","共感→質問→深掘り","提案→共感→質問","深掘り→提案→共感"],"a": 1,"e": "多くのスタッフは共感で止まる。「いつ頃から出始めましたか」「一番辛いのはどういう状況ですか」で質問し、「解消されたら一番したいことは何ですか」で深掘りする。深掘りが浅いまま提案しても刺さらない。","m": "カウンセリング並びにクロージング研修"},{"s": "5","q": "料金を伝えた直後にすることは。","c": ["メリットの説明を重ねる","2〜3秒沈黙して相手が口を開くのを待つ","すぐに割引の話をする","他プランの案内に移る"],"a": 1,"e": "沈黙を恐れて説明を重ねると、言い訳しているように見え、価格に自信がない印象を与える。ただし相手が明らかに困っているなら「何か気になる点はありますか」と開く。待つことと放置は違う。","m": "カウンセリング並びにクロージング研修"},{"s": "5","q": "「前提クロージング」とは。","c": ["入会を前提にした質問で、頭の中を「するかどうか」から「いつから」に切り替える","前回の体験内容を確認する","前もって料金を伝えておく","契約書を先に出す"],"a": 0,"e": "「いつ頃から始められそうですか」「最初は週何回来られそうですか」。迷っているサインが出た時点で使う。完全に断る姿勢の人に使うと押し売りになる。","m": "カウンセリング並びにクロージング研修"},{"s": "5","q": "事前カウンセリングシート（Googleフォーム）はいつ送るか。","c": ["体験の前日","予約確定メッセージを送った直後","体験の当日朝","体験の後"],"a": 1,"e": "予約確定→即フォーム送信をセットで行う。時間を空けると回答率が大きく落ちる。所要5分程度。来店前に悩みを把握でき、当日のヒアリング時間を短縮できる。","m": "カウンセリングシート記入研修"},{"s": "5","q": "事前問診票の回答が届いたら、トレーナーは何をするか。","c": ["当日まで見ない","回答を確認し、指導案を作り、既往歴をチェックする","内容をお客様に読み上げて確認する","カルテに転記だけする"],"a": 1,"e": "事前に読んでおかないと「事前に答えたのにまた同じことを聞かれた」という最悪の体験になる。事前問診は、読まないなら送らない方がまだまし。当日の朝に必ず確認する。","m": "カウンセリングシート記入研修"},{"s": "5","q": "体験のキャンセル規定として正しいものは。","c": ["当日キャンセルはすべて無料","前日までのキャンセルと当日連絡ありの時間変更は無料。当日の無断キャンセルは違約金5,500円","無断キャンセルでも請求はしない","当日キャンセルは一律3,000円"],"a": 1,"e": "金額が発生する条件なので、予約確定の時点で必ず書面（メール・LINE）で伝えていることが前提。伝えていない相手に後から請求することはできない。","m": "新規体験の問い合わせが入ってから終了まで"},{"s": "5","q": "体験が終わった後にやることの順番は。","c": ["カルテ作成→シート入力→報告→当日中にお礼","報告だけでよい","翌日にまとめて入力する","お礼は次回来店時に伝える"],"a": 0,"e": "入会有無をシートに入力し、入会なら顧客管理売上ページにも入力、LINE WORKS「新規体験報告」で報告、当日中にお礼メッセージ。翌日に持ち越すと必ず抜ける。","m": "新規体験の問い合わせが入ってから終了まで"},{"s": "5","q": "空き枠の確認に時間がかかるとき、返信はどうするか。","c": ["確認できてからまとめて返す","確認中であることを一次返信で必ず伝える","他のスタッフに任せる","電話に切り替える"],"a": 1,"e": "放置するとお客様側には「無視された」としか見えない。基本方針は「早く・丁寧に・止めない」。ただし一次返信を出す以上、回答の目安時間も併せて伝える。","m": "体験時のLINE対応ルール"},{"s": "5","q": "お客様へのLINEの文面ルールとして正しいものは。","c": ["絵文字を多めに使って親しみを出す","【名前＋一言】を文頭に必ず入れ、です・ます調、絵文字は最大1個","「笑」「w」で柔らかくする","文頭の挨拶は省略して用件から入る"],"a": 1,"e": "名前を呼ぶことは距離を縮めて信頼を構築する基本技術。丁寧7：親しみ3。馴れ馴れしすぎる言葉や軽い表現は禁止事項に入っている。丁寧すぎて距離が遠いのも継続に響く。","m": "体験時のLINE対応ルール"},{"s": "5","q": "入会しなかったお客様の見送り方は。","c": ["手続きだけして早めに帰ってもらう","入会の有無に関わらず笑顔で見送り、体験の感想を聞いていつでも相談できることを伝える","next回の来店を強く勧める","理由を詳しく問いただす"],"a": 1,"e": "「あそこ感じ良かった」が紹介につながる。体験終了と同時に集中が切れるのが典型的な失点パターン。退店後にLINEでお礼を送り、その日の体の変化に触れる。追いかけは1回まで。","m": "カウンセリング並びにクロージング研修"}];



/* ============ 状態 ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
let who='', seg='', qs=[], ans=[], idx=0;

const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CORE=BANK.filter(q=>q.must);
function build(){
  qs=CORE.slice();
  for(const s in DRAW){
    const pool=shuffle(BANK.filter(q=>q.s===s&&!q.must)).slice(0,DRAW[s]);
    qs=qs.concat(pool);
  }
  qs=shuffle(qs).map(q=>{
    const order=shuffle(q.c.map((t,i)=>i));
    return {...q, co:order.map(i=>q.c[i]), ca:order.indexOf(q.a)};
  });
  ans=new Array(qs.length).fill(-1);
  idx=0;
}
const total=()=>CORE.length+Object.values(DRAW).reduce((a,b)=>a+b,0);
const need=()=>Math.ceil(total()*PASS/100);

function copyOut(txt,ta){
  const done=()=>toast('コピーしました');
  const manual=()=>{
    toast('枠の中を長押ししてコピーしてください');
    if(ta){ ta.focus(); ta.select(); ta.scrollIntoView({block:'center',behavior:'smooth'}); }
  };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done,manual);
  }else{
    try{
      const ta=document.createElement('textarea');
      ta.value=txt;ta.style.cssText='position:fixed;top:-1000px';
      document.body.appendChild(ta);ta.select();
      const ok=document.execCommand('copy');ta.remove();
      ok?done():manual();
    }catch(e){manual()}
  }
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1600)}

/* ============ 画面 ============ */
function start(){
  app.innerHTML=`
  <header class="hd"><div class="wrap">
    <div class="brow"><span>CHART GROUP &nbsp;NEW STAFF</span></div>
    <h1><em>現場デビュー</em>テスト</h1>
    <div class="hdrow">
      <p>企業理念・会社とサービス・就業規則・勤務ルール・現場の安全から出題します。<br>
      <b>${total()}問中${need()}問（${PASS}%）以上</b>で合格、現場デビューです。</p>
      <span class="fic ic-hello" aria-hidden="true"></span>
    </div>
  </div></header>

  <div class="wrap" style="padding-top:18px">
    <div class="card">
      <div class="lab">出題範囲</div>
      <div class="sec-list">
        <div><b style="color:var(--warn)">安全・コンプライアンス（毎回必須）</b><span>${CORE.length}問</span></div>
        ${Object.keys(SECS).map(k=>`<div>${SECS[k]}<span>${DRAW[k]}問</span></div>`).join('')}
      </div>
      <div class="rule">
        <span class="chip">全<b>${total()}</b>問</span>
        <span class="chip">合格ライン <b>${need()}問</b></span>
        <span class="chip">目安 <b>15分</b></span>
      </div>
      <p class="mute" style="margin-top:14px">安全・コンプライアンスの${CORE.length}問は毎回必ず出ます。残りは毎回ランダムに入れ替わり、選択肢の並びも変わります。位置ではなく内容を覚えてください。</p>

      <div class="field">
        <label for="nm">氏名</label>
        <input id="nm" type="text" placeholder="例：飯泉 友裕" autocomplete="name">
        <div class="ex">※ グレーの文字は記入例です。上書きして入力してください</div>
      </div>
      <div class="field">
        <label for="sg">区分</label>
        <select id="sg">
          <option value="パーソナル正社員">パーソナル正社員</option>
          <option value="パーソナル業務委託">パーソナル業務委託</option>
          <option value="Miarce社員">Miarce社員</option>
          <option value="Miarce業務委託">Miarce業務委託</option>
        </select>
      </div>
      <div style="margin-top:20px"><button class="btn" id="go">テストを始める</button></div>
    </div>
    <p class="mute" style="margin:16px 2px 0">分からない問題があっても、まず最後まで進めてください。終了後に、間違えた問題の正解と解説が出ます。</p>
  </div>`;
  $('#go').addEventListener('click',()=>{
    who=$('#nm').value.trim(); seg=$('#sg').value;
    if(!who){ $('#nm').focus(); toast('氏名を入力してください'); return; }
    build(); quiz();
  });
}

function quiz(){
  const q=qs[idx], n=idx+1;
  app.innerHTML=`
  <div class="wrap">
    <div class="bar">
      <div class="in"><span>${q.must?'安全・コンプライアンス':SECS[q.s]}</span><span><b>${n}</b> / ${qs.length}</span></div>
      <div class="track"><i style="width:${(n-1)/qs.length*100}%"></i></div>
    </div>
    <div style="padding:22px 2px 0">
      <div class="qsec">第${n}問</div>
      <p class="qtxt">${esc(q.q)}</p>
      <div class="opts">
        ${q.co.map((t,i)=>`<button class="opt${ans[idx]===i?' on':''}" data-i="${i}"><em>${'ABCD'[i]}</em><span>${esc(t)}</span></button>`).join('')}
      </div>
      <div class="nav">
        ${idx>0?'<button class="btn sub" id="prev">← 前の問題</button>':''}
        <button class="btn sub" id="next" ${ans[idx]<0?'disabled':''}>${idx===qs.length-1?'回答を確認する':'次の問題 →'}</button>
      </div>
    </div>
  </div>`;
  let moving=false;
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(moving) return; moving=true;
    ans[idx]=+b.dataset.i;
    app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));
    setTimeout(()=>{ if(idx<qs.length-1){idx++;quiz()} else confirmScreen(); window.scrollTo(0,0); },260);
  }));
  const p=$('#prev'); if(p) p.addEventListener('click',()=>{if(moving)return;moving=true;idx--;quiz();window.scrollTo(0,0)});
  const nx=$('#next'); if(nx) nx.addEventListener('click',()=>{
    if(moving) return; moving=true;
    if(idx<qs.length-1){idx++;quiz()} else confirmScreen(); window.scrollTo(0,0);
  });
}

function confirmScreen(){
  const miss=ans.map((a,i)=>a<0?i+1:0).filter(Boolean);
  app.innerHTML=`
  <div class="wrap" style="padding-top:26px">
    <div class="card">
      <div class="lab">確認</div>
      <h1 style="font-size:22px;margin:8px 0 10px">${miss.length?'未回答があります':'全問に回答しました'}</h1>
      <p class="mute">${miss.length?'第'+miss.join('問・第')+'問が未回答です。未回答は不正解として採点されます。':'採点すると、間違えた問題の正解と解説が表示されます。'}</p>
      <div style="margin-top:18px"><button class="btn" id="mark">採点する</button></div>
      <div style="margin-top:10px"><button class="btn sub" id="back">← 問題に戻る</button></div>
    </div>
  </div>`;
  $('#mark').addEventListener('click',()=>{result();window.scrollTo(0,0)});
  $('#back').addEventListener('click',()=>{idx=(miss[0]?miss[0]-1:qs.length-1);quiz();window.scrollTo(0,0)});
}

function result(){
  const ok=qs.map((q,i)=>ans[i]===q.ca);
  const hit=ok.filter(Boolean).length;
  const pct=Math.round(hit/qs.length*100);
  const pass=hit>=need();
  const wrong=qs.map((q,i)=>({q,i})).filter(x=>!ok[x.i]);
  const mustNg=wrong.filter(x=>x.q.must);
  const d=new Date(), p2=n=>String(n).padStart(2,'0');
  const ymd=`${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())}`;
  const hm=`${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const mustAll=qs.filter(q=>q.must).length;
  const report=[
    '【現場デビューテスト 結果】',
    '氏名：'+who,
    '区分：'+seg,
    '受験日：'+ymd+' '+hm,
    '点数：'+hit+'/'+qs.length+'問（'+pct+'%）',
    '判定：'+(pass?'合格（'+need()+'問以上）':'不合格（あと'+(need()-hit)+'問）'),
    '安全項目：'+(mustAll-mustNg.length)+'/'+mustAll+'問'+(mustNg.length?'（要確認 '+mustNg.length+'問）':' 全問正解'),
    '',
    wrong.length?'■ 復習する項目（'+wrong.length+'問）':'■ 間違いなし',
    ...wrong.map((x,i)=>(i+1)+'. '+x.q.q+'（'+x.q.m+'）')
  ].join('\n');

  app.innerHTML=`
  <div class="wrap" style="padding-top:26px">
    <div class="card">
      <div class="lab">結果</div>
      <div class="score">
        <div class="pct">${pct}<small>%</small></div>
        <div class="cnt">${qs.length}問中 ${hit}問 正解（合格ライン ${need()}問）</div>
      </div>
      <div class="verdict ${pass?'ok':'ng'}">
        <span class="fic ${pass?'ic-cheer':'ic-hmm'}" aria-hidden="true"></span>
        <div>
          <h2>${pass?'合格。現場デビューできます':'あと'+(need()-hit)+'問。もう一度'}</h2>
          <p>${esc(who)}さん（${esc(seg)}）／${ymd}</p>
        </div>
      </div>
      ${mustNg.length?`<div class="alert">
        <span class="fic ic-stop" aria-hidden="true"></span>
        <p><b>安全・コンプライアンスの問題を${mustNg.length}問落としています。</b>ここは事故と信用に直結します。合否に関わらず、現場に出る前に必ず確認してください。</p>
      </div>`:''}
      <div style="margin-top:18px"><button class="btn sub" id="again">もう一度（別の${qs.length}問）</button></div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="lab">提出用</div>
      <p class="mute" style="margin:7px 0 11px">下のボタンでコピーして、そのまま研修進捗／LINE WORKSに貼り付けて提出してください。コピーできないときは枠の中を長押しして全選択してください。</p>
      <textarea class="rep" id="rep" rows="${Math.min(16,10+wrong.length)}" readonly>${esc(report)}</textarea>
      <div style="margin-top:11px"><button class="btn" id="copy">この内容をコピー</button></div>
    </div>

    ${wrong.length?`<div class="rv">
      <h3>間違えた問題（${wrong.length}問）</h3>
      ${wrong.map(x=>`
      <div class="rvi">
        <p class="rvq"><span class="no">${x.i+1}.</span>${esc(x.q.q)}${x.q.must?'<span class="must">安全</span>':''}</p>
        <div class="rvl x">あなたの回答</div>
        <p class="rvt">${ans[x.i]<0?'（未回答）':esc(x.q.co[ans[x.i]])}</p>
        <div class="rvl o">正解</div>
        <p class="rvt">${esc(x.q.co[x.q.ca])}</p>
        <p class="rve">${esc(x.q.e)}</p>
        <p class="rvm">読み直す → <b>${esc(x.q.m)}</b></p>
      </div>`).join('')}
    </div>`:''}

    <p class="ft"><span class="fic ic-bow" aria-hidden="true"></span>
    分からないことがあれば、遠慮なく飯泉まで直接連絡してください。<br>
    <a href="https://works.do/5jql0MO" target="_blank" rel="noopener" style="color:var(--teal-d);font-weight:700">works.do/5jql0MO</a><br>
    詳しい内容は「AI飯泉」で検索できます。</p>
  </div>`;

  $('#again').addEventListener('click',()=>{build();quiz();window.scrollTo(0,0)});
  const ta=$('#rep');
  ta.addEventListener('focus',()=>ta.select());
  $('#copy').addEventListener('click',()=>copyOut(report,ta));
}

start();
</script>
</body>
</html>
