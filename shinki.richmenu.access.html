<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CHART 店舗・アクセス</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="パーソナルジムCHARTの店舗一覧。各店舗の住所・アクセス・営業時間・駅からの道順をご案内します。">
<meta property="og:title" content="CHART 店舗・アクセス">
<meta property="og:description" content="整体×トレーニングのパーソナルジムCHART。店舗一覧と行き方のご案内。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Caveat:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&text=CHARTFINDYOUW%20&display=swap">
<style>
  :root{
    /* Layout: one phone-width column. Brand row, a hero set like the rich-menu tile (script word, bold title, short tan rule),
       then a finder (search + area pulldown) over area-grouped store cards. Each card opens to address, hours and walking directions.
       Single light look on purpose: it matches the rich menu art and the other CHART pages. */
    --ground:#F6F9FA;
    --blob:#FBF0DD;
    --blob-0:rgba(251,240,221,0);
    --blob-2:#EAF5FC;
    --blob-2-0:rgba(234,245,252,0);
    --line:#DCE6EB;
    --card:#FFFFFF;

    /* 店舗・アクセスタイルの色（リッチメニュー画像から採色） */
    --acc:#E1A343;
    --acc-hover:#D6952F;
    --acc-deep:#8E5B12;
    --acc-soft:#FBF0DD;
    --acc-script:#EAC29A;
    --rule:#B5966F;
    --ring:rgba(225,163,67,.3);
    --shadow:rgba(142,91,18,.32);

    /* ロゴの色（いただいたロゴ画像から採色）と、CHARTの青 */
    --logo:#373737;
    --blue:#0877AA;

    --ink:#0E1B26;
    --text:#2D4555;
    --muted:#4F6B7A;
    --hint:#6E8796;

    --font-jp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
    --font-script:"Caveat","Segoe Script","Bradley Hand",cursive;
    --font-brand:"Montserrat","Avenir Next","Helvetica Neue",Arial,sans-serif;
    color-scheme:light;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    margin:0;
    background:
      radial-gradient(440px 300px at 100% 0,var(--blob) 0,var(--blob-0) 72%),
      radial-gradient(380px 320px at 0 40%,var(--blob-2) 0,var(--blob-2-0) 72%),
      var(--ground);
    color:var(--text);
    font-family:var(--font-jp);
    font-weight:500;
    font-size:15px;
    line-height:1.75;
    line-break:strict;
  }
  h1,h2,h3{text-wrap:balance;word-break:auto-phrase;font-feature-settings:"palt"}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  svg{flex:none}
  [hidden]{display:none !important}
  .wrap{width:100%;max-width:520px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  .page{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:22px;padding-block:14px 40px}
  .wm{position:absolute;top:-74px;left:-62px;width:180px;height:180px;color:var(--blue);opacity:.05;pointer-events:none}

  /* ブランド */
  .brand{position:relative;margin:0;display:flex;align-items:center;gap:11px;color:var(--ink)}
  .brand-logo{display:block;height:18px;width:auto;color:var(--logo)}
  .brand-sub{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;line-height:1.2;padding-left:10px;border-left:1px solid var(--line)}

  /* 見出し（リッチメニューのタイルと同じ組み方） */
  .hero{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:9px;margin-top:-2px;padding-top:12px}
  .hero::before{content:"";position:absolute;z-index:-1;top:-10px;right:0;width:74%;height:150px;border-radius:50%;background:radial-gradient(closest-side,var(--acc-soft),var(--blob-0));pointer-events:none}
  .hero-script{align-self:flex-start;margin:0 0 -3px 2px;font-family:var(--font-script);font-weight:500;font-size:33px;line-height:1;color:var(--acc-script);transform:rotate(-6deg);transform-origin:0 100%;white-space:nowrap;pointer-events:none}
  .hero h1{margin:0;font-size:30px;line-height:1.3;font-weight:800;color:var(--ink);letter-spacing:.04em}
  .rule{display:block;width:44px;height:4px;border-radius:4px;background:var(--rule)}
  .lead{margin:0;font-size:14.5px;line-height:1.85;max-width:34em}

  /* 店舗さがし */
  .finder{display:flex;flex-direction:column;gap:10px}
  .search{position:relative;margin:0;display:flex;align-items:center}
  .search-icon{position:absolute;left:17px;width:20px;height:20px;color:var(--acc-deep);pointer-events:none}
  .search input{width:100%;height:52px;padding:0 50px 0 46px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;font-weight:500;-webkit-appearance:none;appearance:none}
  .search input::placeholder{color:var(--hint);opacity:1}
  .search input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--ring)}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
  .search-clear{position:absolute;right:8px;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:var(--acc-soft);color:var(--acc-deep);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .search-clear svg{width:16px;height:16px}
  .select{position:relative}
  .select select{width:100%;height:48px;padding:0 46px 0 18px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;font-weight:700;-webkit-appearance:none;appearance:none;cursor:pointer}
  .select select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--ring)}
  .select svg{position:absolute;right:16px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--acc-deep);pointer-events:none}
  .count{margin:0 0 0 4px;font-size:13px;font-weight:700;color:var(--acc-deep)}

  /* エリアごとの一覧 */
  .groups{display:flex;flex-direction:column;gap:18px}
  .group{display:flex;flex-direction:column;gap:8px}
  .group-h{margin:0 0 0 4px;display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:800;color:var(--ink);letter-spacing:.06em}
  .group-h small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .group-pin .group-h{color:var(--acc-deep)}
  .spots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

  /* 店舗カード（タップで開く） */
  .spot{border:1.5px solid var(--line);border-radius:18px;background:var(--card);transition:border-color .15s,box-shadow .15s}
  .spot[open]{border-color:var(--acc);box-shadow:0 14px 24px -20px var(--shadow)}
  .spot summary{list-style:none;cursor:pointer;border-radius:16px;-webkit-tap-highlight-color:transparent}
  .spot summary::-webkit-details-marker{display:none}
  .sum{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px 10px 16px}
  .spot-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .spot-name{font-size:16.5px;font-weight:800;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
  .spot-sub{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .spot-sub svg{width:14px;height:14px;color:var(--acc)}
  .spot-chev{flex:none;width:32px;height:32px;border-radius:50%;background:var(--acc-soft);color:var(--acc-deep);display:grid;place-items:center;transition:transform .2s}
  .spot-chev svg{width:16px;height:16px}
  .spot[open] .spot-chev{transform:rotate(180deg)}
  .spot-body{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}

  .info{margin:0;padding-top:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13.5px;line-height:1.65}
  .info dt{font-size:12px;font-weight:800;color:var(--acc-deep);white-space:nowrap;padding-top:1px}
  .info dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
  .info .zip{font-size:12.5px;color:var(--muted)}
  .info .nb{display:inline-block}
  .info a{color:var(--blue);font-weight:800;text-decoration:none;font-variant-numeric:tabular-nums}

  .route{display:flex;flex-direction:column;gap:8px;padding:12px 14px 13px;border-radius:14px;background:var(--acc-soft)}
  .route-h{margin:0;font-size:12.5px;font-weight:800;color:var(--acc-deep);letter-spacing:.04em}
  .route ol{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:6px}
  .route li{position:relative;padding-left:28px;font-size:13.5px;line-height:1.65;color:var(--ink);counter-increment:st}
  .route li::before{content:counter(st);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--ink);font-size:11.5px;font-weight:800;line-height:1;display:grid;place-items:center}

  .btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:800;line-height:1.3;text-align:center;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:background-color .15s,border-color .15s,transform .15s}
  .btn svg{width:17px;height:17px}
  .btn:active{transform:scale(.98)}
  .btn-map{background:var(--acc);color:var(--ink)}
  .btn-map:hover{background:var(--acc-hover)}
  .btn-ghost{background:var(--card);color:var(--acc-deep);border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:var(--acc)}

  .empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;border:1.5px dashed var(--line);border-radius:20px;background:var(--card)}
  .empty p{margin:0}
  .empty-title{font-weight:800;color:var(--ink);overflow-wrap:anywhere}
  .empty-sub{font-size:13.5px}
  .btn-sub{margin-top:4px;min-height:44px;padding:0 20px;border:1.5px solid var(--acc);border-radius:999px;background:var(--card);color:var(--acc-deep);font:inherit;font-size:14px;font-weight:800;cursor:pointer}

  .fine{margin:0;font-size:12px;line-height:1.75;color:var(--muted)}

  /* フッター */
  .foot{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:8px;padding-top:24px;border-top:1px solid var(--line)}
  .foot-logo{display:block;height:24px;width:auto;color:var(--logo)}
  .foot-tag{margin:0;color:var(--muted);font-family:var(--font-brand);font-weight:600;font-size:10.5px;letter-spacing:.3em}
  .foot-link{margin-top:6px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--blue);text-decoration:none}
  .foot-link svg{width:15px;height:15px}

  a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  @media (min-width:560px){
    .page{padding-top:28px}
    .hero h1{font-size:34px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>

      pid: "ChIJhyLZDmWNGGARsew4kanDmnA", kw: "外苑前 がいえんまえ 青山 あおやま 南青山 青山一丁目 銀座線" },

  ];

  // 代表の電話番号（tel を書いていない店舗はこの番号）
  const MAIN_TEL = "03-5843-1571";

  const AREAS = ["板橋区", "江戸川区", "大田区", "葛飾区", "北区", "品川区", "新宿区", "墨田区", "豊島区", "中野区", "練馬区", "港区", "静岡県富士市"];

  /* ============================================================
     ここから下は仕組み（ふだんは触らなくてOK）
     ============================================================ */
  const HP = "https://chart-happiness.com/";
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const norm = s => hira(String(s).normalize("NFKC").toLowerCase()).replace(/[\s・\/、。,.\-ー‐－―〜~（）()]/g, "");
  const byYomi = (a, b) => a.yomi.localeCompare(b.yomi, "ja");
  const icon = id => `<svg aria-hidden="true" focusable="false"><use href="#${id}"/></svg>`;
  // 住所は「番地」と「建物名」で分け、建物名が途中で改行されないようにする
  const addrHtml = a => { const i = a.indexOf(" "); return i < 0 ? esc(a) : `${esc(a.slice(0, i))} <span class="nb">${esc(a.slice(i + 1))}</span>`; };

  for (const s of STORES) {
    s.tel = s.tel || MAIN_TEL;
    const q = encodeURIComponent("パーソナルジムCHART " + s.name);
    s.map = "https://www.google.com/maps/search/?api=1&query=" + q + (s.pid ? "&query_place_id=" + encodeURIComponent(s.pid) : "");
    s.page = HP + s.id + "/#access";
    s.hay = norm([s.name, s.yomi, s.area, s.addr, s.access.join(" "), s.kw || ""].join(" "));
  }

  /* この公式LINEの店舗：URLに ?s=店舗ID を付けると、その店舗を一番上に開いた状態で出します（なくても動きます） */
  let pinned = [];
  try {
    const p = new URLSearchParams(location.search).get("s");
    if (p) pinned = p.split(/[,、\s]+/).map(id => STORES.find(s => s.id === id.trim())).filter(Boolean);
  } catch (e) {}
  const pinnedSet = new Set(pinned);

  const card = (s, open) =>
    `<li><details class="spot"${open ? " open" : ""}>` +
      `<summary><span class="sum"><span class="spot-main"><span class="spot-name">${esc(s.name)}</span><span class="spot-sub">${icon("i-train")}${esc(s.near)}</span></span><span class="spot-chev">${icon("i-chev")}</span></span></summary>` +
      `<div class="spot-body">` +
        `<dl class="info">` +
          `<dt>住所</dt><dd><span class="zip">〒${esc(s.zip)}</span><br>${addrHtml(s.addr)}</dd>` +
          `<dt>アクセス</dt><dd>${s.access.map(esc).join("<br>")}</dd>` +
          `<dt>営業時間</dt><dd>${s.hours.map(esc).join("<br>")}</dd>` +
          `<dt>定休日</dt><dd>${esc(s.closed)}</dd>` +
          `<dt>電話</dt><dd><a href="tel:${esc(s.tel.replace(/\D/g, ""))}">${esc(s.tel)}</a></dd>` +
        `</dl>` +
        (s.steps.length ? `<div class="route"><p class="route-h">駅からの道順</p><ol>${s.steps.map(t => `<li>${esc(t)}</li>`).join("")}</ol></div>` : "") +
        `<div class="btn-row">` +
          `<a class="btn btn-map" href="${esc(s.map)}">${icon("i-map")}地図で見る</a>` +
          `<a class="btn btn-ghost" href="${esc(s.page)}">${s.steps.length ? "写真つきで見る" : "公式サイト"}${icon("i-ext")}</a>` +
        `</div>` +
      `</div>` +
    `</details></li>`;

  /* ---------- 店舗さがし ---------- */
  const input = $("#q"), clear = $("#clear"), area = $("#area"), out = $("#groups"), count = $("#count"), empty = $("#empty");

  area.innerHTML = `<option value="">すべてのエリア（${STORES.length}店舗）</option>` +
    AREAS.filter(a => STORES.some(s => s.area === a))
         .map(a => `<option value="${esc(a)}">${esc(a)}（${STORES.filter(s => s.area === a).length}）</option>`).join("");

  function run() {
    const terms = input.value.split(/[\s　]+/).map(norm).filter(Boolean);
    const a = area.value;
    const idle = !terms.length && !a;
    const hits = STORES.filter(s => (!a || s.area === a) && terms.every(t => s.hay.includes(t)));
    const listed = idle ? hits.filter(s => !pinnedSet.has(s)) : hits;
    let html = idle && pinned.length
      ? `<section class="group group-pin"><h2 class="group-h">この公式LINEの店舗</h2><ul class="spots">${pinned.map(s => card(s, true)).join("")}</ul></section>`
      : "";
    for (const ar of AREAS) {
      const list = listed.filter(s => s.area === ar).sort(byYomi);
      if (!list.length) continue;
      html += `<section class="group"><h2 class="group-h">${esc(ar)}<small>${list.length}店舗</small></h2><ul class="spots">${list.map(s => card(s, false)).join("")}</ul></section>`;
    }
    out.innerHTML = html;
    clear.hidden = !input.value;
    empty.hidden = hits.length > 0;
    if (!hits.length) $("#emptyQ").textContent = input.value.trim() || a;
    count.textContent = idle ? `全${STORES.length}店舗` : `${hits.length}店舗が見つかりました`;
  }

  input.addEventListener("input", run);
  area.addEventListener("change", run);
  clear.addEventListener("click", () => { input.value = ""; run(); input.focus(); });
  $(".search").addEventListener("submit", e => { e.preventDefault(); input.blur(); });
  $("#showAll").addEventListener("click", () => { input.value = ""; area.value = ""; run(); });

  for (const el of document.querySelectorAll("[data-count]")) el.textContent = STORES.length;
  run();
})();
</script>
