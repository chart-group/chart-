<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHART 店舗マップ</title>
<style>
  :root{
    --ink:#070B14; --panel:#0D1524; --panel-2:#111C2E; --line:#1E2C46;
    --text:#E9EEF8; --muted:#77879F; --gold:#FFC759; --teal:#43D9C4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 700px at 78% -10%, #12203a 0%, transparent 60%),
      radial-gradient(900px 600px at 0% 100%, #0f1b2e 0%, transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic Medium","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; font-feature-settings:"palt" 1;
  }
  .wrap{max-width:1220px;margin:0 auto;padding:22px 18px 60px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
         padding-bottom:16px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand h1{margin:0;font-size:23px;font-weight:800;letter-spacing:.14em}
  .brand span{font-size:12px;color:var(--muted);letter-spacing:.06em}
  .tally{display:flex;align-items:flex-end;gap:22px}
  .tally .big{display:flex;align-items:baseline;gap:6px}
  .tally .big b{font-size:46px;font-weight:800;line-height:.85;letter-spacing:-.03em;color:var(--gold);
                text-shadow:0 0 22px rgba(255,199,89,.45);font-variant-numeric:tabular-nums}
  .tally .big i{font-style:normal;font-size:13px;color:var(--muted)}
  .split{display:flex;gap:14px;font-size:12.5px;color:var(--muted);padding-bottom:4px}
  .split u{text-decoration:none;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
  .dot.g{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .dot.t{background:var(--teal);box-shadow:0 0 8px var(--teal)}

  .controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1 1 170px;max-width:230px}
  .field label{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
  select{
    appearance:none;-webkit-appearance:none;
    background:var(--panel-2)
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2377879F' stroke-width='1.6'/></svg>")
      no-repeat right 12px center;
    color:var(--text);border:1px solid var(--line);border-radius:9px;
    padding:11px 34px 11px 13px;font-size:14.5px;width:100%;font-family:inherit;cursor:pointer;
  }
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .stage{display:grid;grid-template-columns:1fr 316px;gap:16px;align-items:start}
  @media (max-width:880px){ .stage{grid-template-columns:1fr} }

  .mapbox{position:relative;background:linear-gradient(160deg,#0b1424 0%,#0a1120 100%);
          border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .mapbox svg{display:block;width:100%;height:auto}
  .viewtag{position:absolute;left:14px;top:12px;font-size:12px;color:var(--muted);
           letter-spacing:.08em;pointer-events:none}
  .viewtag b{color:var(--text);font-weight:700;font-size:14px;letter-spacing:.06em}
  .hint{margin:9px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.6}

  .pref{fill:rgba(44,76,124,.14);stroke:rgba(12,20,34,.85);stroke-width:.9;stroke-linejoin:round}
  .pref.live{fill:rgba(255,199,89,.10);stroke:rgba(255,199,89,.30)}
  .coast{fill:none;stroke:#3A5D8F;stroke-width:1.2;stroke-linejoin:round}
  .rail{fill:none;stroke:rgba(255,199,89,.30);stroke-width:1.4}
  .river{fill:none;stroke:rgba(67,217,196,.24);stroke-width:1.6;stroke-linecap:round}
  .gridline{stroke:rgba(120,160,220,.055);stroke-width:1}
  .link{stroke:rgba(255,199,89,.16);stroke-width:1}

  .node{cursor:pointer}
  .halo{filter:url(#glow)}
  .node .core{stroke-width:.8}
  .node.dim{opacity:.16;pointer-events:none}
  .node .pulse{fill:none;stroke-width:1.4}

  .plabel{font-size:11.5px;fill:var(--muted);letter-spacing:.06em;pointer-events:none}
  .wlabel{font-size:10.5px;fill:rgba(119,135,159,.62);letter-spacing:.08em;pointer-events:none}
  .pcount{font-weight:800;font-size:15px;fill:#06101f;pointer-events:none;font-variant-numeric:tabular-nums}
  .nlabel{font-size:11.5px;font-weight:700;fill:var(--text);pointer-events:none;
          paint-order:stroke;stroke:#070B14;stroke-width:3.2px;stroke-linejoin:round}

  @keyframes ignite{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
  @keyframes ping{0%{transform:scale(1);opacity:.55}75%,100%{transform:scale(3.4);opacity:0}}
  .node{animation:ignite .5s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i) * 45ms);
        transform-box:fill-box;transform-origin:center}
  .node .pulse{animation:ping 3.4s ease-out infinite;animation-delay:calc(var(--i) * 220ms);
        transform-box:fill-box;transform-origin:center}
  @media (prefers-reduced-motion:reduce){
    .node,.node .pulse{animation:none}
    .node .pulse{opacity:.28}
  }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .panel h2{margin:0;padding:14px 16px 12px;font-size:13.5px;font-weight:700;letter-spacing:.07em;
            border-bottom:1px solid var(--line)}
  .list{max-height:540px;overflow-y:auto;overscroll-behavior:contain}
  @media (max-width:880px){ .list{max-height:360px} }
  .row{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;
       padding:11px 15px;border-bottom:1px solid rgba(30,44,70,.6);cursor:pointer;width:100%;
       background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;
       font-family:inherit}
  .row:hover,.row:focus-visible{background:var(--panel-2);outline:none}
  .row.on{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--gold)}
  .row.on.fc{box-shadow:inset 3px 0 0 var(--teal)}
  .row .pip{width:8px;height:8px;border-radius:50%;margin-top:6px}
  .row .nm{font-size:14.5px;font-weight:700;line-height:1.35;display:block}
  .row .ad{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:3px;
           word-break:break-all;display:block}
  .row .tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);
            border-radius:5px;padding:2px 6px;white-space:nowrap;margin-top:3px}

  .bars{padding:8px 16px 16px}
  .bar{display:grid;grid-template-columns:76px 1fr 30px;gap:10px;align-items:center;padding:9px 0;
       cursor:pointer;background:none;border:0;color:inherit;width:100%;font-family:inherit;text-align:left}
  .bar:hover .track i{filter:brightness(1.3)}
  .bar span{font-size:13px}
  .bar .track{height:7px;background:#131F33;border-radius:4px;overflow:hidden}
  .bar .track i{display:block;height:100%;background:var(--gold);box-shadow:0 0 12px rgba(255,199,89,.6)}
  .bar u{text-decoration:none;font-size:14px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}

  .tip{position:absolute;pointer-events:none;z-index:5;background:rgba(8,16,29,.94);
       border:1px solid var(--line);border-radius:10px;padding:9px 12px;max-width:230px;opacity:0;
       transform:translate(-50%,-118%);transition:opacity .12s;backdrop-filter:blur(6px)}
  .tip.show{opacity:1}
  .tip b{display:block;font-size:13.5px;margin-bottom:3px}
  .tip small{color:var(--muted);font-size:11px;line-height:1.5;display:block}
  .tip em{font-style:normal;color:var(--gold);font-size:10.5px}
  .tip em.fc{color:var(--teal)}
</style>
</head>

<div class="wrap">

  <header>

    </div>
    <aside class="panel">

      <div id="panelBody"></div>
    </aside>
  </div>
</div>

function makeProjector(b,w,h,pad){
  const s=b[0],we=b[1],n=b[2],e=b[3], kx=Math.cos((s+n)/2*Math.PI/180);

function relax(nodes,min){

    let moved=false;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);

        a.x-=dx*p;a.y-=dy*p;b.x+=dx*p;b.y+=dy*p;moved=true;

    }

  }

  const P=makeProjector(boundsFor(key),W,H,isJp?24:30);

  box.querySelectorAll("svg").forEach(n=>n.remove());
  const svg=el("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":(isJp?"全国":key)+"の店舗地図"});
  currentSvg=svg;
  defs(svg);
  svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"url(#dots)"}));
  const gl=el("g");
  for(let i=1;i<6;i++){
    gl.appendChild(el("line",{x1:0,y1:H*i/6,x2:W,y2:H*i/6,class:"gridline"}));
    gl.appendChild(el("line",{x1:W*i/6,y1:0,x2:W*i/6,y2:H,class:"gridline"}));
  }
  svg.appendChild(gl);
  $("viewtag").innerHTML="<b>"+(isJp?"全国":key)+"</b>";

  const live={};
  filtered().forEach(s=>{live[s.pref]=true});

  if(isJp){
    const g=el("g");
    Object.keys(PREF).forEach(p=>{
      g.appendChild(el("path",{d:path(PREF[p],P,true),class:"pref"+(live[p]?" live":"")}));
    });
    Object.keys(ISLES).forEach(k=>g.appendChild(el("path",{d:path(ISLES[k],P,true),class:"pref"})));
    svg.appendChild(g);
    $("hint").textContent="光っている点をタップすると、その都道府県の地図に切り替わります。都道府県の形はおおまかな輪郭です。";
    drawPrefNodes(svg,P); buildPrefPanel();
  }else{
    if(PREF[key]){
      svg.appendChild(el("path",{d:path(PREF[key],P,true),class:"pref live"}));
      svg.appendChild(el("path",{d:path(PREF[key],P,true),class:"coast"}));
    }
    if(key==="東京都"){
      svg.appendChild(el("path",{d:path(YAMANOTE,P,true),class:"rail"}));
      svg.appendChild(el("path",{d:path(ARAKAWA,P,false),class:"river"}));
      const wg=el("g");
      Object.keys(WARDS).forEach(w=>{
        const c=P(WARDS[w][0],WARDS[w][1]);
        if(c[0]<12||c[0]>W-12||c[1]<12||c[1]>H-12) return;
        wg.appendChild(Object.assign(el("text",{class:"wlabel",x:c[0],y:c[1],"text-anchor":"middle"}),{textContent:w}));
      });
      svg.appendChild(wg);
      const y=P(35.700,139.700);
      svg.appendChild(Object.assign(el("text",{class:"plabel",x:y[0]-4,y:y[1]+30}),{textContent:"山手線"}));
      $("hint").textContent="薄い文字は区名、金色の輪は山手線、青緑の線は荒川です。細い線で結ばれた店どうしは約2.5km以内で、行き来しやすい組み合わせです。";
    }else if(key==="静岡県"){
      const f=P(FUJI[0],FUJI[1]);
      svg.appendChild(el("path",{d:"M"+f[0]+" "+(f[1]-24)+"L"+(f[0]+27)+" "+(f[1]+14)+"L"+(f[0]-27)+" "+(f[1]+14)+"Z",class:"coast"}));
      svg.appendChild(Object.assign(el("text",{class:"plabel",x:f[0],y:f[1]+30,"text-anchor":"middle"}),{textContent:"富士山"}));
      $("hint").textContent="静岡県の輪郭と富士山の位置を重ねています。";
    }else{
      $("hint").textContent="細い線で結ばれた店どうしは約2.5km以内で、行き来しやすい組み合わせです。";
    }
    drawStoreNodes(svg,P,key); buildStorePanel(key);
  }
  box.appendChild(svg);
}

function drawPrefNodes(svg,P){
  const by={};
  filtered().forEach(s=>{(by[s.pref]=by[s.pref]||[]).push(s)});
  const g=el("g");
  Object.keys(by).forEach((pref,i)=>{
    const arr=by[pref];
    const lat=arr.reduce((a,s)=>a+s.lat,0)/arr.length, lng=arr.reduce((a,s)=>a+s.lng,0)/arr.length;
    const c0=P(lat,lng), x=c0[0], y=c0[1];
    const r=9+Math.sqrt(arr.length)*3.6;
    const c=arr.every(s=>s.type==="fc")?"var(--teal)":"var(--gold)";
    const n=el("g",{class:"node",style:"--i:"+i,tabindex:"0",role:"button",
      "aria-label":pref+" "+arr.length+"店舗",transform:"translate("+x+","+y+")"});
    n.appendChild(el("circle",{class:"pulse",cx:0,cy:0,r:r,stroke:c}));
    n.appendChild(el("circle",{class:"halo",cx:0,cy:0,r:r*.86,fill:c,opacity:.30}));
    n.appendChild(el("circle",{cx:0,cy:0,r:r*.62,fill:c,opacity:.95}));
    n.appendChild(Object.assign(el("text",{class:"pcount",x:0,y:5,"text-anchor":"middle"}),{textContent:arr.length}));
    n.appendChild(Object.assign(el("text",{class:"plabel",x:0,y:r+16,"text-anchor":"middle"}),{textContent:pref}));
    const go=()=>{selView.value=pref;selected=null;render();};
    n.addEventListener("click",go);
    n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
    n.addEventListener("pointerenter",()=>showTip(x,y,"<b>"+pref+"</b><small>"+arr.length+"店舗　タップで拡大</small>"));
    n.addEventListener("pointerleave",hideTip);
    g.appendChild(n);
  });
  svg.appendChild(g);
}

function drawStoreNodes(svg,P,pref){
  const list=filtered().filter(s=>s.pref===pref);
  const nodes=list.map(s=>{const p=P(s.lat,s.lng);return{s:s,x:p[0],y:p[1]};});
  relax(nodes,15);

  const lg=el("g");
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];
    const km=Math.hypot((a.s.lat-b.s.lat)*111,(a.s.lng-b.s.lng)*91);
    if(km<2.5) lg.appendChild(el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:"link"}));
  }
  svg.appendChild(lg);

  const g=el("g");
  nodes.forEach((nd,i)=>{
    const c=nd.s.type==="fc"?"var(--teal)":"var(--gold)";
    const n=el("g",{class:"node",style:"--i:"+i,tabindex:"0",role:"button",
      "aria-label":nd.s.name+" "+nd.s.addr,"data-name":nd.s.name,transform:"translate("+nd.x+","+nd.y+")"});
    n.appendChild(el("circle",{class:"pulse",cx:0,cy:0,r:7,stroke:c}));
    n.appendChild(el("circle",{class:"halo",cx:0,cy:0,r:8.5,fill:c,opacity:.34}));
    n.appendChild(el("circle",{class:"core",cx:0,cy:0,r:3.6,style:"fill:"+c+";stroke:#06101f"}));
    n.appendChild(Object.assign(el("text",{class:"nlabel",x:11,y:4,"data-label":nd.s.name,
      opacity:selected===nd.s.name?1:0}),{textContent:nd.s.name}));
    n.addEventListener("click",()=>select(nd.s.name));
    n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(nd.s.name);}});
    n.addEventListener("pointerenter",()=>showTip(nd.x,nd.y,
      "<b>"+nd.s.name+"</b><small>"+nd.s.addr+"</small><em class=\""+nd.s.type+"\">"+
      (nd.s.type==="fc" ? ("FC"+(nd.s.fc?"／"+nd.s.fc:"")) : ("直営"+(nd.s.area?"／エリア"+nd.s.area:"")))+"</em>"));
    n.addEventListener("pointerleave",hideTip);
    g.appendChild(n);
  });
  svg.appendChild(g);
  paintSelection();
}

function showTip(x,y,html){
  if(!currentSvg) return;
  const r=currentSvg.getBoundingClientRect(), vb=currentSvg.viewBox.baseVal;
  tip.innerHTML=html;
  tip.style.left=(x/vb.width*r.width)+"px";
  tip.style.top=(y/vb.height*r.height)+"px";
  tip.classList.add("show");
}
const hideTip=()=>tip.classList.remove("show");

function select(name){
  selected = selected===name ? null : name;
  paintSelection();
  const row=document.querySelector('.row[data-name="'+CSS.escape(name)+'"]');
  if(row&&selected) row.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function paintSelection(){
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("on",r.dataset.name===selected));
  document.querySelectorAll(".node[data-name]").forEach(n=>n.classList.toggle("dim",!!selected&&n.dataset.name!==selected));
  document.querySelectorAll("[data-label]").forEach(t=>t.setAttribute("opacity",t.dataset.label===selected?1:0));
}

function buildPrefPanel(){
  const by={};
  filtered().forEach(s=>{(by[s.pref]=by[s.pref]||[]).push(s)});
  const max=Math.max(1,...Object.keys(by).map(k=>by[k].length));
  $("panelTitle").textContent="都道府県別の店舗数";
  const wrap=document.createElement("div");wrap.className="bars";
  Object.keys(by).sort((a,b)=>by[b].length-by[a].length).forEach(pref=>{
    const arr=by[pref];
    const b=document.createElement("button");b.className="bar";
    b.innerHTML="<span>"+pref+"</span><div class=\"track\"><i style=\"width:"+(arr.length/max*100)+"%\"></i></div><u>"+arr.length+"</u>";
    b.addEventListener("click",()=>{selView.value=pref;selected=null;render();});
    wrap.appendChild(b);
  });
  const body=$("panelBody");body.innerHTML="";body.appendChild(wrap);
}

function buildStorePanel(pref){
  const list=filtered().filter(s=>s.pref===pref);
  $("panelTitle").textContent=pref+"の店舗　"+list.length+"件";
  const body=$("panelBody");body.innerHTML="";
  const lb=document.createElement("div");lb.className="list";
  if(!list.length) lb.innerHTML='<p style="padding:20px 16px;color:var(--muted);font-size:13px;margin:0">この条件に合う店舗はありません。絞り込みを「すべて」に戻してください。</p>';
  list.forEach(s=>{
    const col=s.type==="fc"?"var(--teal)":"var(--gold)";
    const b=document.createElement("button");
    b.className="row"+(s.type==="fc"?" fc":"");b.dataset.name=s.name;
    b.innerHTML="<span class=\"pip\" style=\"background:"+col+";box-shadow:0 0 9px "+col+"\"></span>"+
      "<span><span class=\"nm\">"+s.name+"</span><span class=\"ad\">"+s.addr+"</span></span>"+
      "<span class=\"tag\">"+(s.type==="fc"?"FC":(s.area||"直営"))+"</span>";
    b.addEventListener("click",()=>select(s.name));
    lb.appendChild(b);
  });
  body.appendChild(lb);
}

function init(){
  $("tCount").textContent=STORES.length;
  $("tOwn").textContent=STORES.filter(s=>s.type==="own").length;
  $("tFc").textContent=STORES.filter(s=>s.type==="fc").length;
  const prefs=[];
  STORES.forEach(s=>{if(prefs.indexOf(s.pref)<0)prefs.push(s.pref)});
  prefs.sort();
  selView.innerHTML='<option value="jp">全国</option>'+prefs.map(p=>'<option value="'+p+'">'+p+'</option>').join("");
  render();
}
selView.addEventListener("change",()=>{selected=null;render();});
selFilter.addEventListener("change",()=>{selected=null;render();});
window.addEventListener("resize",hideTip);
init();
</script>
</body>
</html>
